# 大脑独立栈 (brain standalone) — benchmark subject #1 of 2 (desktop is
# the wdio entry; mobile deferred by user decision 2026-10-14). The
# brain = 端脑 telencephalon (4 lobes: temporal/occipital/parietal/
# prefrontal) + 间脑 diencephalon (Thalamus) + 海马体 hippocampus (:
# 8081). Boot (verified live 2026-10-14, all four components healthy):
#   cd encephalon && NEURON_MODEL_DIRS=~/.neuron/models \
#     cargo run --release -p encephalon --example a2a_server -- --port 8082
# Two faces, two entries:
#  (a) A2A face (brain-a2a): telencephalon gateway reads skill from
#      message.metadata.skill and routes to a REGISTERED lobe — needs a
#      serving lobe process (registered lobes ship placeholder .local
#      URLs with empty skills; live probe: "skill not found, available
#      skills: []"). Wire contract in src/brain_agent.rs.
#  (b) neuron OpenAI face (brain-qwen06): full-stack serving /v1/chat/
#      completions — measures the brain-as-inference-host delta now.
#[[agent]]
#adapter = "brain"
#name = "brain-a2a"
#a2a_base_url = "http://127.0.0.1:8082"
#skill = "chat"
#timeout_secs = 900

[[agent]]
adapter = "openai"
name = "brain-qwen06"
base_url = "http://127.0.0.1:8082/v1"
model = "qwen3-0.6b"
max_tokens = 2048
timeout_secs = 900

# (c) parietal-real behavior-evaluation face — 真被测物第一行跑分。
# 前提：parietal-server 在跑（telencephalon/crates/behavior-stub 的
# parietal-server.exe，ENCEPHALON_URL=http://127.0.0.1:8082 起动自动
# 注册），端脑 lobe_cache 有 parietal-real（skills 含 behavior.evaluate）。
# suite: suites/behavior-smoke.json（浴缸温度阈值场景）。
[[agent]]
adapter = "brain"
name = "brain-parietal-behavior"
a2a_base_url = "http://127.0.0.1:8082"
skill = "behavior.evaluate"
timeout_secs = 60

