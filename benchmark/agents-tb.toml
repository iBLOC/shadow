# Terminal-Bench slice participants. Keys come from env vars — source
# benchmark/.env (gitignored) before running:
#   set -a; source .env; set +a
#   cargo run --bin bench -- run --suite suites/terminal-bench-2-smoke.json \
#     --agents agents-tb.toml --out reports/

# DeepSeek V3 — external model baseline on imported TB 2.x tasks.
# Large max_tokens: these tasks expect a full file delivered in one
# fenced code block, and the OpenAI adapter has no shell.
[[agent]]
adapter = "openai"
name = "deepseek-chat"
base_url = "https://api.deepseek.com/v1"
model = "deepseek-chat"
api_key_env = "SHADOW_BENCH_DEEPSEEK_KEY"
max_tokens = 8192
timeout_secs = 600

# Same model in agentic mode — bash / write_file / read_file /
# list_files / finish tool calling. The harness lets the model run
# commands in a real workdir, which is what Terminal-Bench actually
# measures (vs. one-shot text-only). 30 steps is enough for the
# TB smoke slice; per-step `max_tokens = 2048` covers most
# intermediate observations; overall timeout 900s covers ~30 steps.
[[agent]]
adapter = "openai"
name = "deepseek-chat-agentic"
base_url = "https://api.deepseek.com/v1"
model = "deepseek-chat"
api_key_env = "SHADOW_BENCH_DEEPSEEK_KEY"
max_tokens = 8192
timeout_secs = 900
[agent.mode]
kind = "agentic"
max_steps = 30

# Same agentic scaffold with a doubled step budget — diagnostics for
# whether the 3 SWE f2p misses / TB batching timeout are budget-bound
# or capability-bound.
[[agent]]
adapter = "openai"
name = "deepseek-chat-agentic-50"
base_url = "https://api.deepseek.com/v1"
model = "deepseek-chat"
api_key_env = "SHADOW_BENCH_DEEPSEEK_KEY"
max_tokens = 8192
timeout_secs = 1200
[agent.mode]
kind = "agentic"
max_steps = 50

