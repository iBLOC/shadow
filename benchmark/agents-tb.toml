# deepseek-chat + real browser tools (W3C WebDriver via chromedriver on
# :9515). Launch: chromedriver --port=9515. The browser_navigate /
# browser_snapshot / browser_click tools join the loop when
# webdriver_url is set.
[[agent]]
adapter = "openai"
name = "deepseek-browser-agentic"
base_url = "https://api.deepseek.com/v1"
model = "deepseek-chat"
api_key_env = "SHADOW_BENCH_DEEPSEEK_KEY"
max_tokens = 2048
timeout_secs = 900
webdriver_url = "http://127.0.0.1:9515"
[agent.mode]
kind = "agentic"
max_steps = 50

# 大脑容器 (ibloc-brain) — the full production stack (端脑+丘脑+海马体+
# neuron) behind ONE OpenAI face. Build: docker build -t ibloc-brain
# -f encephalon/Dockerfile . (repo root context); run with
# NEURON_REMOTE_* env per the Dockerfile header, port 8082 (local dev
# boots use `cargo run --example a2a_server -- --port 18082` since
# 8082 is held by a resident hippocampus-server).
# Requires the neuron remote engine (NEURON_REMOTE_* env, merged into
# neuron 2026-10-12) so cloud models live behind the brain's face.
[[agent]]
adapter = "openai"
name = "brain-docker"
base_url = "http://127.0.0.1:18082/v1"
model = "deepseek-chat"
max_tokens = 8192
timeout_secs = 900
[agent.mode]
kind = "agentic"
max_steps = 50

# Shadow-Desktop as benchmark subject #2 (大脑是 subject #1)。前提：
# `pnpm tauri dev` 在跑、wdio plugin 暴露在 :4445（默认配置见
# shadow-desktop/tests/wdio/wdio.conf.ts）。task_timeout_secs 必须
# ≥ reply_timeout_secs——runner 默认 180s 会先把任务杀掉（2026-10-27
# 首跑 4 题死在 180.0s 整点，全是被 runner 层误杀）。
[[agent]]
adapter = "shadow-desktop"
name = "shadow-desktop-agentic"
webdriver_url = "http://127.0.0.1:4445"
app_url = "http://localhost:1420"
reply_timeout_secs = 600
task_timeout_secs = 600

# (d) prefrontal-real LLM-execution face — 被测物第二行。prefrontal
# v9 serve :18082（--api-base deepseek）+ 端脑 lobe_cache 注册
# prefrontal-real（skills 含 task_execution）。任务经 端脑 gateway →
# prefrontal agent（process_with_tools 工具循环）→ deepseek → 回答。
# 与 deepseek-chat（openai 直连）同模型对照 = 被测物 A2A 栈 delta。
[[agent]]
adapter = "brain"
name = "brain-prefrontal-llm"
a2a_base_url = "http://127.0.0.1:8082"
skill = "task_execution"
timeout_secs = 120

# (e) rule-engine-zen — 确定性被测物：diencephalon 内嵌 zen-engine
# (与丘脑热路径同一后端)。rule-engine-smoke 套件专用；零网络零 LLM，
# 每题 ~10µs。答案只能是 notify/ignore —— 引擎语义回归即翻红。
[[agent]]
adapter = "rule-engine"
name = "rule-engine-zen"

# (f) deepseek-compress — deepseek-chat + hippocampus 压缩配置开启。
# long-context-smoke 专用: cumulative_tokens 过 1200 触发 LLM 摘要
# (TextSummarizer → OpenAiAgent 同一连接), 目标压到 400 token。
# 对照组 deepseek-chat (无压缩) 同 suite 同跑即可观察压缩对答案
# 质量的影响。
[[agent]]
adapter = "openai"
name = "deepseek-compress"
base_url = "https://api.deepseek.com/v1"
model = "deepseek-chat"
api_key_env = "SHADOW_BENCH_DEEPSEEK_KEY"
max_tokens = 8192
timeout_secs = 600
[agent.session]
compress_at_tokens = 200
target_tokens = 80
branch_at_tasks = 0
detect_drift = false
