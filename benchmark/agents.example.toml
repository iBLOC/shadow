# Benchmark participants — copy to agents.toml and adjust.
#
# adapter = "openai": any OpenAI-compatible chat endpoint. Shadow's
#   embedded neuron (Tauri shell) serves one at http://127.0.0.1:8085/v1.
# adapter = "cli": a local agent CLI spawned in the task sandbox.
#   `{prompt}` is replaced with the task instruction, `{workdir}` with
#   the sandbox path. Missing binaries are reported as "skip".
# adapter = "shadow-desktop": full app via wdio WebDriver (functional test).
# adapter = "encephalon": the encephalon standalone stack's OpenAI
#   surface. Use base_url = "http://127.0.0.1:8082/v1".

# Keys: api_key (inline, for tests) OR api_key_env (env var name,
# resolved at request time). Keys never enter the repo or the
# benchmark report.

# Per-lobe model assignment (encephalon only): ENCEPHALON_DEFAULT_MODEL
# sets the default for all four lobes; ENCEPHALON_LOBE_MODELS
# ("temporal=m1,occipital=m2,parietal=m3") overrides per lobe. The
# same can be done at runtime through POST /encephalon/model/default
# and POST /encephalon/lobes/{name}/model.

# Optional LLM judge for `llm-judge` scorers. Use a STRONG model —
# judging with the model under test defeats the comparison.
# [judge]
# base_url = "https://api.openai.com/v1"
# model = "gpt-4o"
# api_key = "sk-..."

# Encephalon — the complete agent: A2A server + lobe (叶区) routing +
# OpenAI-compatible surface + hippocampus memory + single neuron
# instance. Standalone: cargo run -p encephalon --example a2a_server
# (default :8082).
[[agent]]
adapter = "openai"
name = "iBLOC-encephalon"
base_url = "http://127.0.0.1:8082/v1"
model = "qwen3-0.6b"
max_tokens = 512
timeout_secs = 300

# The embedded neuron inside the shadow Tauri shell (engine-level
# baseline, no agent layer):
[[agent]]
adapter = "openai"
name = "shadow-neuron"
base_url = "http://127.0.0.1:8085/v1"
model = "qwen3-0.6b"
max_tokens = 512
timeout_secs = 300

# Standalone neuron (neuron_server example) instead of the Tauri shell:
# [[agent]]
# adapter = "openai"
# name = "shadow-neuron-standalone"
# base_url = "http://127.0.0.1:18088/v1"
# model = "qwen3-0.6b"

# The Shadow-Desktop APP itself (full-stack functional test through the
# wdio WebDriver surface): requires `pnpm tauri dev` running. The
# instruction flows through AppInitializer -> ConversationPage ->
# cortexClient bridge -> embedded neuron, and the reply is read back
# from the rendered DOM.
[[agent]]
adapter = "shadow-desktop"
name = "shadow-desktop"
webdriver_url = "http://127.0.0.1:4445"
app_url = "http://localhost:1420"
reply_timeout_secs = 600

# The Shadow-Mobile APP in Phone-as-Engine mode: OpenAIServer.kt serves
# an OpenAI-compatible endpoint on the phone (:8085). Put the phone's
# LAN IP here while the app runs.
# [[agent]]
# adapter = "openai"
# name = "shadow-mobile"
# base_url = "http://192.168.x.x:8085/v1"
# model = "local"

# DeepSeek API (model-only comparison — no harness):
# [[agent]]
# adapter = "openai"
# name = "deepseek-api"
# base_url = "https://api.deepseek.com/v1"
# model = "deepseek-chat"
# api_key = "sk-..."

# --- official-benchmark models (Terminal-Bench 2.0 / SWE-bench / tau2 官方同款) ---
# Keys are read from environment variables (api_key_env) — never inline
# them in this file. Export before running, e.g.:
#   export SHADOW_BENCH_ANTHROPIC_KEY=sk-ant-...
#
# MODEL-LEVEL comparison only: official leaderboard entries are
# model+harness combos; this harness drives the raw model via its
# OpenAI-compatible endpoint (Anthropic's OpenAI-compat layer accepts
# Bearer auth with your Anthropic key).

# Claude Opus 4.5 — OpenHands / OpenCode harness model (Terminal-Bench 2.0)
[[agent]]
adapter = "openai"
name = "claude-opus-4-5"
base_url = "https://api.anthropic.com/v1"
model = "claude-opus-4-5"
api_key_env = "SHADOW_BENCH_ANTHROPIC_KEY"
max_tokens = 512
timeout_secs = 400

# GPT (Codex harness model — Terminal-Bench top entry)
[[agent]]
adapter = "openai"
name = "gpt"
base_url = "https://api.openai.com/v1"
model = "gpt-5.1"
api_key_env = "SHADOW_BENCH_OPENAI_KEY"
max_tokens = 512
timeout_secs = 400

# GLM 5 — Terminus 2 harness model (Terminal-Bench 2.0, 52.4%)
[[agent]]
adapter = "openai"
name = "glm-5"
base_url = "https://open.bigmodel.cn/api/paas/v4"
model = "glm-5"
api_key_env = "SHADOW_BENCH_ZHIPU_KEY"
max_tokens = 512
timeout_secs = 400

# Qwen3 Max — SWE-bench Verified 72.5 / tau2-Verified 69.6 (DashScope
# OpenAI-compatible mode)
[[agent]]
adapter = "openai"
name = "qwen3-max"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
model = "qwen3-max"
api_key_env = "SHADOW_BENCH_DASHSCOPE_KEY"
max_tokens = 512
timeout_secs = 400

# DeepSeek V3 — open-weights reference
[[agent]]
adapter = "openai"
name = "deepseek-chat"
base_url = "https://api.deepseek.com/v1"
model = "deepseek-chat"
api_key_env = "SHADOW_BENCH_DEEPSEEK_KEY"
max_tokens = 512
timeout_secs = 400

# --- external open-source agents (CLI-driven) ---------------------------
# Install each tool, adjust the command to match its CLI, then rerun.

[[agent]]
adapter = "cli"
name = "openclaw"
# OpenClaw gateway/agent CLI — adjust to your install.
command = ["openclaw", "agent", "--prompt", "{prompt}"]
timeout_secs = 600

[[agent]]
adapter = "cli"
name = "pi"
# pi coding agent (npm pi-coding-agent): non-interactive print mode.
command = ["pi", "-p", "{prompt}"]
timeout_secs = 600

[[agent]]
adapter = "cli"
name = "deepseek-harness"
# DeepSeek Harness headless CLI runner (`dsh`).
command = ["dsh", "run", "--headless", "--prompt", "{prompt}"]
timeout_secs = 600
