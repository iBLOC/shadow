[package]
name = "shadow-benchmark"
version = "0.1.0"
edition = "2024"
# MSRV 统一地板：全 iBLOC Rust 项目钉在 1.94（lance 14 的 rust-version = 1.94.0）。
rust-version = "1.94"
license = "Apache-2.0"
description = "Shadow agent benchmark harness — suites, agent adapters (shadow-desktop / iBLOC-encephalon / shadow-neuron / openclaw / pi / dsh), scorers, pass^k runner and comparison reports"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "io-util"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# In-process zen rule engine for the rule-engine-smoke suite.
# Depends on the zen-engine crate DIRECTLY rather than pulling the
# whole diencephalon tree: diencephalon → synapse trips an a2a-lf
# version clash (0.3 vs 0.4, two `SendMessageRequest` types) under
# this feature combination, and the suite only needs the engine.
# The rule shapes (Decision::AnyOf of gt/lt comparisons → JDM
# switch graph) mirror diencephalon::rule_engine exactly; the
# semantic-parity contract lives in diencephalon's own tests.
zen-engine = "2.1.4"
# Content hashes for the SWE-bench instance/patch records (the import
# path pins the upstream task set by digest).
sha2 = "0.10"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"
