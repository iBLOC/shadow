<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pwa-icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0B" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />

    <!-- PWA: web app manifest -->
    <link rel="manifest" href="/manifest.web.json" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />

    <!-- iOS PWA: status bar style + Add to Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Shadow" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Shadow" />
    <meta name="format-detection" content="telephone=no" />

    <!-- iOS splash screens (light/dark) -->
    <link
      rel="apple-touch-startup-image"
      href="/pwa-512.png"
      media="(prefers-color-scheme: dark)"
    />

    <title>Shadow 影</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
