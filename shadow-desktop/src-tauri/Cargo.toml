[package]
name = "shadow-desktop"
version = "0.1.0"
description = "Shadow Desktop - AI Agent Executor"
authors = ["Shadow Team"]
edition = "2021"
# The hippocampus stack behind this app (hippocampus-server -> hippocampus-storage)
# now runs lance 14, whose rust-version is "1.94.0" => ⇒ anything lower is a promise
# this manifest cannot keep. Kept in step with hippocampus / telencephalon /
# encephalon, which all declare the same floor.
rust-version = "1.94"

[workspace]
members = ["."]

[lib]
name = "shadow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# ⚠️⚠️ Tauri 的 **Rust crate 与 npm 包必须同 major/minor** —— 而两个生态
#    的发版节奏**不同步** ⇒ ⇒ 「Rust 侧写 `2`、npm 侧写 `^2`」= 两边各取
#    各自的最新 ⇒ ⇒ ⇒ 结果 Rust 取到 2.12.5 而 npm 停在 2.11.0 ⇒ ⇒ ⇒
#    ⇒ ⇒ Tauri CLI **直接拒绝构建**：
#      "Found version mismatched Tauri packages … tauri (v2.12.5) :
#       @tauri-apps/api (v2.11.0)"
#    ⇒ ⇒ ⇒ 而 npm 那一侧是**钉死的**（pnpm-lock.yaml 入库 ＋
#    ⇒ ⇒ ⇒ `--frozen-lockfile`）⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ 所以
#    ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ Rust 侧必须**向 npm 侧对齐**，而不是反过来。
#    锚点（本机实测编过的那一组，从 target/debug/deps/*.d 里读出来的）：
#      tauri 2.11.2 ↔ @tauri-apps/api 2.11.0 ✔ 同 minor
#      tauri-plugin-opener 2.5.4 ↔ @tauri-apps/plugin-opener 2.5.4 ✔ 逐字相同
#      tauri-build 2.6.2
#    ⇒ ⇒ ⇒ 升 npm 侧要动 package.json ＋ pnpm-lock（TS 侧跟着变）⇒ ⇒ ⇒
#    ⇒ ⇒ ⇒ 降 Rust 侧只动这三行 ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ 所以走后者。
tauri-build = { version = "~2.6", features = [] }

[dependencies]
# default-features = false ONLY to drop "common-controls-v6": it makes
# muda statically import comctl32!TaskDialogIndirect, which exists only
# in the WinSxS comctl32 v6 assembly — tauri-build embeds the v6 manifest
# into the app binary, but `cargo test` exes have none and die at load
# with STATUS_ENTRYPOINT_NOT_FOUND (0xc0000139). The feature only gates
# muda's About-dialog helper, which we don't use. Everything else from
# the default list is re-added verbatim.
tauri = { version = "~2.11", default-features = false, features = [
    "wry",
    "compression",
    "dynamic-acl",
    "x11",
    "dbus",
    "tray-icon",
    "image-png",
    "unstable",
] }
tauri-plugin-opener = "~2.5"
# ⚠️⚠️ **Tauri 家族必须整族钉在同一条 minor 线上** —— 而 tauri 自己对这些
#    辅助 crate 用的是 **caret** 要求（`tauri-macros = "2.6.3"` 实际允许
#    2.7.x）⇒ ⇒ ⇒ cargo 会把它们**统一到 2.7 那一线**（那是配 tauri 2.12 的）
#    ⇒ ⇒ ⇒ ⇒ 而 `tauri` 自己停在 2.11 ⇒ ⇒ ⇒ ⇒ ⇒ 那条 proc-macro
#    （`tauri_macros::do_menu_item!`）会吐出一个 **2.12 才有的**错误变体
#    ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ 而 2.11 的 `tauri::error::Error` 里**没有**它 ⇒ ⇒ ⇒ ⇒
#    ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ **tauri 自己编不过**：
#      error[E0599]: no variant … named `UnexpectedMenuKind` found for enum
#      `error::Error`  →  could not compile `tauri` (lib)
#    ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒
#    ⇒ ⇒ ⇒ ⇒ ⇒ 这里把 `tauri-macros` **提成直接依赖** ⇒ ⇒ 只为**钉住那一族**
#    ⇒ ⇒ ⇒ （它本来就在依赖图里 ⇒ ⇒ 不增加任何编译量）。
tauri-macros = "~2.6"
tauri-plugin-single-instance = "2"
tauri-plugin-wdio-webdriver = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tokio = { version = "1", features = ["full"] }

# The endbrain (telencephalon) is no longer spawned as a sidecar binary.
# Shadow-Desktop is a thin client that talks to telencephalon via
# /shadow/v1/* and /api/telencephalon/* HTTP when needed.
# (DEPRECATED 2026-09-22: replaced by embedded `encephalon` crate.)

# WebSocket with TLS
tokio-tungstenite = { version = "0.26", features = ["native-tls", "tokio-native-tls"] }
tokio-native-tls = "0.3"
native-tls = "0.2"
futures-util = "0.3"
futures-channel = "0.3"
url = "2"
http = "1"

# Encryption
aes-gcm = "0.10"
password-hash = "0.5"
rand = "0.8"
md5 = "0.7"
dirs = "5"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Encephalon (大脑) — embedded top-level wrapper crate. Replaces the
# old sidecar pattern. Holds the ACP message bus + the diencephalon
# (data gateway) and (optionally) the telencephalon (agent runtime).
#
# ⚠️ 2026-11-05：**桌面端只依赖大脑** —— 端脑 / 间脑 / 海马体一律走
# `encephalon::…`（大脑 re-export 了它们）⇒ ⇒ 依赖图上「大脑 → 端脑」是
# **唯一**一条边 ⇒ ⇒ 端脑的 feature 集合**完全由大脑决定**。
# `default-features = false` 仍然要写：它关掉的是大脑的 `dm-rules`
# （桌面端不用 GoRules ⇒ grep 零命中）⇒ ⇒ 而 `hippocampus` 由下面
# **显式**要回来 ⇒ ⇒ 桌面端要的本地海马体一点没少。
# Two hippocampus instances pointing at the same Lance storage would
# contend for the same locks — so there is exactly one.
encephalon = { path = "../../../encephalon", default-features = false, features = [
    "telencephalon",
# 进程内海马体（2026-11-05 改成**向大脑显式要**）—— 桌面端挂海马体 HTTP 面
# 与存储根路径 ⇒ ⇒ 大脑的 `hippocampus` feature 会转发
# `telencephalon/hippocampus` + `dep:hippocampus-server` ⇒ ⇒ **同一个包实例**
# ⇒ ⇒ 不会出现「两个 hippocampus 争同一把 Lance 锁」。
"hippocampus",
    # 零信任面（OpenZiti dark service）—— 见 §encephalon::ziti§。
    # ⚠️ **编译进 ≠ 会开** —— 运行时还要配 §ZITI_IDENTITY§ ⇒ ⇒ 没配
    # ⇒ 桌面端行为与今天**一模一样**。
    "ziti",
] }

# ⚠️ 2026-11-05：**端脑不再被直连** —— 桌面端只依赖**大脑**（encephalon）。
# 端脑的 API 一律走 `encephalon::telencephalon::…`（大脑 re-export 了它）
# ⇒ ⇒ 依赖图上「大脑 → 端脑」是**唯一**一条边 ⇒ ⇒ 端脑的 feature 集合
# 完全由大脑决定 ⇒ ⇒ 桌面端不能再偷偷把端脑的 default feature 全打开。
# ⚠️ 别改回直连：同一个 path ⇒ ⇒ cargo 会 unify 成**一个** crate ⇒ ⇒
# 但两条边会让**谁决定 feature** 变模糊 ⇒ ⇒ 那是本轮要消灭的东西。

# ⚠️ 2026-11-05：海马体也不直连 —— 走 `encephalon::hippocampus_server::…`
# ⇒ ⇒ 「桌面端不再自己摸 hippocampus_server」这条注释里的方向，现在**真的**做到了。
axum = { version = "0.8", features = ["ws", "multipart"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Process management
portpicker = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
tauri-plugin-store = "2.4.4"
tauri-plugin-updater = "2.10.1"

# Local git for per-task result versioning (WS-01..WS-05 in
# shadow/docs/superpowers/scenarios/2026-09-23-external-agent-website-development-scenario.md)
git2 = "0.19"

# Feishu MCP — wraps the Feishu/Lark Open API to expose sheet / doc
# creation + sharing as MCP tools, used by DOC-01..DOC-05 in
# shadow/docs/superpowers/scenarios/2026-09-23-document-productization-scenario.md.
# `open-lark` is the enterprise-grade Rust SDK (Apache-2.0); shadow
# only uses a minimal slice (auth + sheets.v3 + drive.v1). App-level
# auth only for v1 — FEISHU_APP_ID + FEISHU_APP_SECRET env vars.
open-lark = "0.14"

# Async-trait support for the FeishuOps trait object (synapse_trait +
# axum handlers each hold an `Arc<dyn FeishuOps>`).
async-trait = "0.1"

# synapse (transitive via encephalon → telencephalon, but we use
# `synapse::mcp::*` types directly in feishu_mcp/mod.rs) — pull
# directly so the import resolves.
synapse = { path = "../../../synapse" }
# Embedded inference comes from the embedded encephalon
# (encephalon::Embedded::boot) — telencephalon owns the single neuron
# instance; shadow has no direct neuron dependency.

# Disable wasmtime's `profiling` feature: it pulls ittapi-sys, whose
# runtime needs libittnotify.dll next to the executable. The DLL isn't
# copied into target/debug/deps for `cargo test`, so the test binary
# exits with STATUS_ENTRYPOINT_NOT_FOUND (0xc0000139) at load. Profiling
# is VTune-only — nothing in the shadow stack uses it.
wasmtime = { version = "20", default-features = false, features = [
    "cranelift",
    "runtime",
    "wat",
] }

# ⚠️ 2026-11-05：间脑也不直连 —— 走 `encephalon::diencephalon::…`
# ⇒ ⇒ FeishuMcp 那个真实 Thalamus 照样拿得到（同一个包实例 ⇒ 类型一致）。

# Computer-use (RPA) — drives the host's mouse + keyboard so an agent
# can act on apps without an A2A endpoint. Guarded by
# SHADOW_COMPUTER_USE_ENABLED=1 at startup; no production path flips
# this on automatically. See src/computer_use.rs for the safety model.
enigo = { version = "0.6", default-features = false, features = ["serde"] }
xcap = "0.9"

# Windows UI Automation — element-based computer-use (find button by
# name, invoke it, read text, set value). Strongly preferred over
# coordinate-based mouse for Windows hosts because it survives window
# resize / DPI changes / position shifts. macOS / Linux continue to
# use the enigo coordinate path.
[target.'cfg(target_os = "windows")'.dependencies]
uiautomation = { version = "0.25", features = ["pattern"] }

# Global shortcut keys (keyboard chords + Mi Bluetooth remote buttons).
# Only the low-level keyboard hook surface is needed: Foundation
# (LRESULT/WPARAM), WindowsAndMessaging (SetWindowsHookExW family) and
# LibraryLoader (GetModuleHandleW). See src/global_keys.rs.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

# 2026-11-04: the `ziti-sdk` override was removed — that crate left the
# dependency graph when the transport became our own OpenZiti v2
# implementation (`synapse/src/transport/ziti/v2/`). Left in place, cargo
# records it as `[[patch.unused]]` in Cargo.lock.
[patch.crates-io]
# Vendored copy of tauri-plugin-wdio-webdriver 1.4.0 with
# tauri default-features = false — see vendor/*/Cargo.toml for why
# (cargo-test binaries died at load via muda's common-controls-v6
# static import). Delete this patch once upstream flips the flag.
tauri-plugin-wdio-webdriver = { path = "vendor/tauri-plugin-wdio-webdriver" }

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt", "time"] }
# `ServiceExt::oneshot` —— 路由挂载形状的单测用它直接打 router。
tower = { version = "0.5", features = ["util"] }
# `tests/embedded_stack.rs` 要用 neuron 的嵌入运行时（`neuron_lib` 是
# neuron 的 [lib] target 名）。**必须和 telencephalon 用同一个源**，
# 否则 cargo 会把 neuron 编成两份，类型对不上。
# ⚠️ 2026-11-04：那个「同一个源」现在是**本地路径依赖** `../../../neuron`
#    （端脑那份也刚切过来）⇒ ⇒ 钉 git rev 走不通：neuron HEAD 有嵌套的
#    path 依赖（synapse-privacy）⇒ ⇒ 从 cargo 的 git checkout 里解析必然失败。
neuron = { path = "../../../neuron", default-features = false }
