[package]
name = "shadow-desktop"
version = "0.1.0"
description = "Shadow Desktop - AI Agent Executor"
authors = ["Shadow Team"]
edition = "2021"

[workspace]
members = ["."]

[lib]
name = "shadow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-wdio-webdriver = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tokio = { version = "1", features = ["full"] }

# Cortex is spawned as a sidecar binary (see cortex_manager.rs)
# Shadow-Desktop is a thin client that talks to cortex via /shadow/v1/* HTTP
# (DEPRECATED 2026-09-22: replaced by embedded `encephalon` crate.)

# WebSocket with TLS
tokio-tungstenite = { version = "0.26", features = ["native-tls", "tokio-native-tls"] }
tokio-native-tls = "0.3"
native-tls = "0.2"
futures-util = "0.3"
futures-channel = "0.3"
url = "2"
http = "1"

# Encryption
aes-gcm = "0.10"
password-hash = "0.5"
rand = "0.8"
md5 = "0.7"
dirs = "5"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Encephalon (大脑) — embedded top-level wrapper crate. Replaces the
# old cortex sidecar pattern. Holds the ACP message bus + the diencephalon
# (data gateway) and (optionally) the telencephalon (agent runtime).
encephalon = { path = "../../../encephalon" }

# Process management
portpicker = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
tauri-plugin-store = "2.4.4"
tauri-plugin-updater = "2.10.1"

# Local git for per-task result versioning (WS-01..WS-05 in
# shadow/docs/superpowers/scenarios/2026-09-23-external-agent-website-development-scenario.md)
git2 = "0.19"

# Feishu MCP — wraps the Feishu/Lark Open API to expose sheet / doc
# creation + sharing as MCP tools, used by DOC-01..DOC-05 in
# shadow/docs/superpowers/scenarios/2026-09-23-document-productization-scenario.md.
# `open-lark` is the enterprise-grade Rust SDK (Apache-2.0); shadow
# only uses a minimal slice (auth + sheets.v3 + drive.v1). App-level
# auth only for v1 — FEISHU_APP_ID + FEISHU_APP_SECRET env vars.
open-lark = "0.14"

# Async-trait support for the FeishuOps trait object (synapse_trait +
# axum handlers each hold an `Arc<dyn FeishuOps>`).
async-trait = "0.1"

# synapse (transitive via encephalon → telencephalon, but we use
# `synapse::mcp::*` types directly in feishu_mcp/mod.rs) — pull
# directly so the import resolves.
synapse = { path = "../../../synapse" }

# Encephalon (top-level wrapper crate) embeds both telencephalon and
# diencephalon. shadow-desktop depends on it directly so we can
# construct FeishuMcp with a real diencephalon::Thalamus + open-lark
# backend at startup — same wiring as the unit tests in feishu_mcp/mod.rs.
diencephalon = { path = "../../../diencephalon" }

# Computer-use (RPA) — drives the host's mouse + keyboard so an agent
# can act on apps without an A2A endpoint. Guarded by
# SHADOW_COMPUTER_USE_ENABLED=1 at startup; no production path flips
# this on automatically. See src/computer_use.rs for the safety model.
enigo = { version = "0.6", default-features = false, features = ["serde"] }
xcap = "0.9"

# Windows UI Automation — element-based computer-use (find button by
# name, invoke it, read text, set value). Strongly preferred over
# coordinate-based mouse for Windows hosts because it survives window
# resize / DPI changes / position shifts. macOS / Linux continue to
# use the enigo coordinate path.
[target.'cfg(target_os = "windows")'.dependencies]
uiautomation = { version = "0.25", features = ["pattern"] }

# ziti-sdk override: pull the iBLOC fork instead of crates.io so
# the `webpki-roots` reqwest feature req is dropped (the fork
# substitutes `rustls` TLS roots). Without this patch, cargo can't
# resolve `reqwest` because the upstream ziti-sdk 0.3.0 requires a
# feature that doesn't exist in reqwest 0.13.x.
[patch.crates-io]
ziti-sdk = { git = "https://github.com/iBLOC/ziti-rust", branch = "master" }

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt", "time"] }
