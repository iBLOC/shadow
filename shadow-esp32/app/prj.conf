# SPDX-License-Identifier: Apache-2.0
#
# shadow-esp32 Zephyr application Kconfig.
#
# ADR-0002 v2 §4.2 — five independent Zephyr tasks (dialog /
# io / net / led / main). The settings below are the minimum
# needed to boot a real ESP32-S3-DevKitC board and reach the
# point where each task can be implemented in follow-up commits.

# ---- Logging ----
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=3

# ---- RTOS + threads ----
CONFIG_MULTITHREADING=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_CUSTOM_DATA=y
CONFIG_INIT_STACKS=y
CONFIG_SYSTEM_WORKQUEUE_PRIORITY=-1

# Per-task stack sizes — conservative defaults; the real values
# land in ADR-0002 v2 §4.2 (dialog_task needs ~16 KiB for Opus
# encoder + ICE state).
CONFIG_SHADOW_DIALOG_STACK_SIZE=16384
CONFIG_SHADOW_IO_STACK_SIZE=4096
CONFIG_SHADOW_NET_STACK_SIZE=4096
CONFIG_SHADOW_LED_STACK_SIZE=2048

# Per-task priorities — `dialog_task` is the highest priority
# (lowest numeric value in Zephyr convention) because audio DMA
# has hard real-time deadlines.
CONFIG_SHADOW_DIALOG_PRIORITY=5
CONFIG_SHADOW_IO_PRIORITY=7
CONFIG_SHADOW_NET_PRIORITY=6
CONFIG_SHADOW_LED_PRIORITY=9

# ---- Wi-Fi ----
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_WIFI=y
# ESP32 Wi-Fi driver is selected via board devicetree in Zephyr
# 4.4; no CONFIG_NET_L2_WIFI_USERSPACE shim required.

# ---- mDNS ----
CONFIG_MDNS=y
CONFIG_MDNS_RESPONDER=y
CONFIG_MDNS_SERVICE_NAME='"shadow-esp32"'

# ---- BSD sockets / DHCP / DNS client ----
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_POSIX_NAMES=y
CONFIG_NET_DHCPV4_OPTION_HOSTNAME=y

# ---- mbedTLS (DTLS handshake for WebRTC) ----
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_KEY_EXCHANGE_PSK_ENABLED=y
CONFIG_MBEDTLS_KEY_EXCHANGE_DHE_PSK_ENABLED=y
CONFIG_MBEDTLS_DESKTOP=y
# Lib required by mbedTLS heap. ESP32 partition has 8 MiB flash;
# we conservatively allocate a 64 KiB heap for TLS scratch.
CONFIG_MBEDTLS_HEAP_SIZE=65536

# ---- Application log level (overrides workspace default) ----
CONFIG_SHADOW_ESP32_LOG_LEVEL_DBG=y

# ---- Wi-Fi credentials (net_task) ----
# Set these in your user overlay or `prj.user.conf` before flashing.
# Default values are placeholders; the device will log a warning
# and stay offline until real credentials are provided.
# CONFIG_SHADOW_WIFI_SSID="your-ssid"
# CONFIG_SHADOW_WIFI_PSK="your-password"

# ---- Out-of-tree modules (ADR-0002 v2 §后续动作 #3-#5 follow-ups) ----
# libopus / libsrtp / webrtc-stack-stub will be pulled in by their
# respective follow-up commits. Listed here as comments so a
# future contributor can see what is expected to land where:
#   CONFIG_LIBOPUS=y              (commit adding Opus codec)
#   CONFIG_LIBSRTP=y              (commit adding SRTP)
#   CONFIG_WEBRTC_STACK_STUB=y    (commit adding DTLS PSK + ICE-lite)