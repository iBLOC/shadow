# SPDX-License-Identifier: Apache-2.0
#
# shadow-esp32 Zephyr application Kconfig.
#
# ADR-0002 v2 §4.2 — five independent Zephyr tasks (dialog /
# io / net / led / main). The settings below are the minimum
# needed to boot a real ESP32-S3-DevKitC board and reach the
# point where each task can be implemented in follow-up commits.

# ---- Logging ----
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=3

# ---- RTOS + threads ----
CONFIG_MULTITHREADING=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_CUSTOM_DATA=y
CONFIG_INIT_STACKS=y
CONFIG_SYSTEM_WORKQUEUE_PRIORITY=-1

# Per-task stack sizes — conservative defaults; the real values
# land in ADR-0002 v2 §4.2 (dialog_task needs ~16 KiB for Opus
# encoder + ICE state).
CONFIG_SHADOW_DIALOG_STACK_SIZE=16384
CONFIG_SHADOW_IO_STACK_SIZE=4096
CONFIG_SHADOW_NET_STACK_SIZE=4096
CONFIG_SHADOW_LED_STACK_SIZE=2048

# Per-task priorities — `dialog_task` is the highest priority
# (lowest numeric value in Zephyr convention) because audio DMA
# has hard real-time deadlines.
CONFIG_SHADOW_DIALOG_PRIORITY=5
CONFIG_SHADOW_IO_PRIORITY=7
CONFIG_SHADOW_NET_PRIORITY=6
CONFIG_SHADOW_LED_PRIORITY=9

# ---- Wi-Fi ----
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_WIFI=y
# ESP32 Wi-Fi driver is selected via board devicetree in Zephyr
# 4.4; no CONFIG_NET_L2_WIFI_USERSPACE shim required.

# ---- mDNS ----
CONFIG_MDNS=y
CONFIG_MDNS_RESPONDER=y
CONFIG_MDNS_SERVICE_NAME='"shadow-esp32"'

# ---- BSD sockets / DHCP / DNS client ----
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_POSIX_NAMES=y
CONFIG_NET_DHCPV4_OPTION_HOSTNAME=y

# ---- mbedTLS (DTLS handshake for WebRTC) ----
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_KEY_EXCHANGE_PSK_ENABLED=y
CONFIG_MBEDTLS_KEY_EXCHANGE_DHE_PSK_ENABLED=y
CONFIG_MBEDTLS_DESKTOP=y
# Lib required by mbedTLS heap. ESP32 partition has 8 MiB flash;
# we conservatively allocate a 64 KiB heap for TLS scratch.
CONFIG_MBEDTLS_HEAP_SIZE=65536

# ---- Application log level (overrides workspace default) ----
CONFIG_SHADOW_ESP32_LOG_LEVEL_DBG=y

# ---- Wi-Fi credentials (net_task) ----
# Set these in your user overlay or `prj.user.conf` before flashing.
# Default values are placeholders; the device will log a warning
# and stay offline until real credentials are provided.
# CONFIG_SHADOW_WIFI_SSID="your-ssid"
# CONFIG_SHADOW_WIFI_PSK="your-password"

# ---- 端脑信令端点（dialog_task）----
# Override per deployment. Defaults assume mDNS-resolved `telencephalon.local`.
# ⚠️ 端脑的 mDNS 名是「**实例名**.local」（见 telencephalon/src/config/bind.rs）
#    ⇒ 默认值只是常见部署的写法，别的实例名要在这里覆盖。
CONFIG_SHADOW_TELENCEPHALON_HOST="telencephalon.local"
CONFIG_SHADOW_TELENCEPHALON_PORT=60080
CONFIG_SHADOW_MODALITY="voice"

# ---- Out-of-tree modules (ADR-0002 v2 §后续动作 #3-#5 follow-ups) ----
# libopus / libsrtp / webrtc-stack-stub will be pulled in by their
# respective follow-up commits. Listed here as comments so a
# future contributor can see what is expected to land where:
#   CONFIG_LIBOPUS=y              (commit adding Opus codec)
#   CONFIG_LIBSRTP=y              (commit adding SRTP)
#   CONFIG_WEBRTC_STACK_STUB=y    (commit adding DTLS PSK + ICE-lite)

# ---- mbedTLS (DTLS for WebRTC, ADR-0002 v2 §后续动作 #4a.6) ----
# The DTLS client lives in `app/src/dtls.c` and uses
# CONFIG_MBEDTLS + the PSK key-exchange profile. The DTLS
# handshake produces the 30-byte master key + salt that the
# SRTP module consumes; v1 of dtls.c derives a deterministic
# placeholder, v1.1 wires the real mbedtls_ssl_export_keying
# material call.

# ---- DTLS PSK (ADR-0002 v2 §后续动作 #4a.6) ----
# The pre-shared key + identity used for the DTLS-PSK handshake.
# In production this is provisioned at manufacturing time; for
# the v1 smoke test we use a fixed string. Both endpoints
# (shadow-esp32 + temporal lobe) must agree byte-for-byte.
# CONFIG_SHADOW_DTLS_PSK="default-psk-please-rotate"
# CONFIG_SHADOW_DTLS_PSK_ID="shadow-esp32-v1"

# ---- End-to-end smoke (ADR-0002 v2 §后续动作 #8) ----
# The full pipeline (audio_pipeline → opus_encode → srtp_protect
# → srtp_unprotect → opus_decode) is exercised by the smoke
# test at the bottom of `dialog_task.c`. The CONFIG values
# below select which subsystems are exercised at boot:
#   CONFIG_SHADOW_SMOKE_AUDIO=y    — include audio pipeline
#                                     in the smoke chain
#   CONFIG_SHADOW_SMOKE_NETWORK=y  — include the Wi-Fi connect
#                                     step (default: skipped to
#                                     keep the smoke fast)
CONFIG_SHADOW_SMOKE_AUDIO=y

# ---- OTA (ADR-0002 v2 §后续动作 #10) ----
# Image upgrades over MCUBoot. The shadow-esp32 OTA pipeline
# uses MCUboot as the second-stage bootloader. The devicetree
# overlay under `app/boards/esp32s3_devkitc.overlay` declares
# the slot-0 / slot-1 / scratch partitions; the application
# image is signed with `tools/sign-ota.sh` and pushed via the
# `mcumgr` CLI over either the console or BLE.
#
# v2.3 enables mcumgr (UDP transport) so the smoke test in CI
# can also exercise the OTA path. BLE is left to a follow-up
# commit because it pulls in the NimBLE host stack (~50 KB
# extra flash).
CONFIG_MCUBOOT=y
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_UPDATEABLE_IMAGE_NUMBER=2
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UDP=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=2048

# ---- USB Audio Class 1.0 device (v2.4) ----
# v2.7 双向:OUT + IN (host→device playback + device→host microphone)
# 原 OUT-only 已改为 OUT+IN 双向
CONFIG_USB=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DRIVER_DWC2=y
CONFIG_USB_DEVICE_BOS=y
CONFIG_USB_AUDIO_CLASS=y
CONFIG_USB_AUDIO_CLASS_1_0=y
CONFIG_USB_AUDIO_UAC1_SINK=y
CONFIG_USB_AUDIO_UAC1_SOURCE=y
CONFIG_USB_AUDIO_SINK_FEEDBACK_EP=n
CONFIG_USB_AUDIO_SOURCE_FEEDBACK_EP=n
CONFIG_USB_AUDIO_SINK_MAX_FRAMES=4
CONFIG_USB_AUDIO_SOURCE_MAX_FRAMES=4
CONFIG_USB_REQUEST_STATUS=n

# ---- BLE GATT provisioning (v2.5) ----
# Android phone discovers the device as "shadow-esp32 setup"
# over BLE 5.0 and writes SSID + PSK to dedicated
# characteristics. ESP32-S3's built-in BLE controller is
# driven by Zephyr's HCI driver; NimBLE is the link-layer
# host stack. settings subsystem + NVS hold the creds across
# power cycles.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="shadow-esp32 setup"
CONFIG_BT_DEVICE_APPEARANCE=0x0000
CONFIG_BT_GATT_DYNAMIC=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_HCI=y
CONFIG_BT_HCI_ESP32=y
CONFIG_BT_NIMBLE=y
CONFIG_BT_NIMBLE_GAP=y
CONFIG_BT_NIMBLE_GATT=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y