#
# Top-level (workspace) Kconfig defaults. The application-specific
# settings live in `app/prj.conf`; this file exists so that
# `west build` can resolve a usable default config without the
# application having to be the workspace root.

# Use Zephyr's minimal libc (required for the application
# build to find a libc backend on newlib-less toolchains).
CONFIG_NEWLIB_LIBC=y

# Default log level for shadow-esp32 modules. Per-module overrides
# are available via `CONFIG_<MODULE>_LOG_LEVEL_DBG/INF/WARN/ERR`.
CONFIG_SHADOW_ESP32_LOG_LEVEL_DBG=y