name: shadow_mobile
description: "Shadow Mobile - Local LLM Application with MNN Engine"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI 组件库 —— Flutter ShadcnUI（nank1ro，MIT，2.4k stars）。
  # 桌面端是真 shadcn/ui（Radix + CVA），移动端用这个直系移植，
  # 两端共用仓根 design-tokens.json 的同一份设计数值。
  # 主题映射见 lib/theme/shad_scheme.g.dart（由 scripts/gen_tokens.mjs 生成）。
  shadcn_ui: ^0.57.3

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  intl: ^0.20.2
  go_router: ^14.8.1
  http: ^1.2.0
  web_socket_channel: ^3.0.0
  url_launcher: ^6.2.0
  path_provider: ^2.1.0
  connectivity_plus: ^6.0.0

  # v2.5 BLE provisioning of shadow-esp32
  flutter_blue_plus: ^1.31.0
  # v2.4 USB Audio device detection/routing
  usb_serial: ^0.5.0

  # Database
  sqflite: ^2.3.0
  path: ^1.8.0

  # Multimodal input
  record: ^6.0.0
  image_picker: ^1.1.0
  camera: ^0.11.0
  file_picker: ^8.0.0

  # Voice Activity Detection
  vad: ^0.0.5
  permission_handler: ^11.3.1

  # v2.9 — 后台常驻（Android 前台服务）。
  # 客户端要求「支持后台运行」：App 进程里嵌着端脑（libencephalon.so）
  # 与 MNN 引擎（NSD 广播），一切后台/息屏就被系统按后台进程掐。
  # 前台服务 + 常驻通知是 Android 的标准保活契约。
  # ⚠️ 插件要求 Kotlin 2.2.20+ / Gradle 8.11.1+ —— 本仓恰好都是
  # （android/settings.gradle.kts 的 kotlin 2.2.20 + wrapper 8.14）。
  flutter_foreground_task: ^11.0.3

  flutter_ai_toolkit: ^1.0.0
  crypto: ^3.0.3
  qr_flutter: ^4.1.0
  
  # GenUI - Agent2UI 框架
  genui: ^0.7.0
  genui_a2ui: ^0.7.0
  json_schema_builder: ^0.1.3
  logging: ^1.3.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  speech_to_text: ^7.0.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # ⚠️ 真机集成测试的**主机侧驱动**（`test_driver/`）要它
  # ⇒ ⇒ 它是 SDK 包、只在主机上跑 ⇒ ⇒ 不进发布产物 ⇒ ⇒ 放 dev 依赖。
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_localization_linter: ^1.0.2
  sqflite_common_ffi: ^2.3.0

  # ⚠️ 2026-11-09：**SQLite native asset 的提供者**（原本只是
  # sqflite_common_ffi 的传递依赖）⇒ ⇒ 现在**提为显式 dev 依赖并钉住下限**
  # ⇒ ⇒ 因为「按目标 OS 分岔 source」是 **sqlite3 ≥ 3.9.1** 才有的能力
  # （3.5.2 的 `source` 是全局的 ⇒ ⇒ 一旦全局设成 `system` 就会连带打断
  # Windows／Android）⇒ ⇒ **升级与下面 `hooks.user_defines` 那段必须同刀**。
  sqlite3: ^3.9.1

flutter:
  uses-material-design: true
  generate: true

# ⚠️ 2026-11-08：`assets/models/` ＋ `assets/config/`（本地 LiteRT/MNN 模型
# 清单与采样器配置）随本地推理退役出仓 ⇒ ⇒ **零 Dart 消费方** ⇒ ⇒
# assets 声明一并摘掉（声明了空目录会让构建报错）。

# ⚠️ 2026-11-09：**SQLite native asset 的来源按平台分岔** ⇒ ⇒ Linux 上的
# **移动端 CI 不再从 GitHub release 下载**预编译库 ⇒ ⇒ 也就不会被 GitHub 的
# **504 网关超时页**（92 字节）冒充成资产、撞哈希 ——
# 取证：上游 simolus3/sqlite3.dart#435／#436；CI 撞到的坏哈希
# `bef140a1…` ＝ 那张 504 页的 SHA-256（本地按字节复算，逐字一致）。
#
# · `linux: system` ⇒ Linux（**CI 的 `Mobile Test` job 正好在 Linux 上**）走
#   dlopen **系统那份 libsqlite3.so** ⇒ ⇒ CI 里 `Install SQLite runtime`
#   （`apt-get install -y libsqlite3-dev`）装的那份**从此是真正的提供者**
#   ⇒ ⇒ 这条路径**零网络** ⇒ ⇒ 上游 CDN 抖动再也伤不到移动端 CI。
# · `default: sqlite3` ⇒ 其余平台（Windows／Android／macOS）**仍用包自带的
#   预编译库** ⇒ ⇒ 本地开发与 APK 打包的行为**一个字没变**。
#
# ⚠️ per-OS 映射要 sqlite3 ≥ 3.9.1（见上面 dev_dependencies 那段）⇒ ⇒
# **升级与这段配置必须同刀** ⇒ ⇒ 别把它们拆成两笔。
hooks:
  user_defines:
    sqlite3:
      source:
        linux: system
        default: sqlite3
