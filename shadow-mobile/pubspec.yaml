name: shadow_mobile
description: "Shadow Mobile - Local LLM Application with MNN Engine"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI 组件库 —— Flutter ShadcnUI（nank1ro，MIT，2.4k stars）。
  # 桌面端是真 shadcn/ui（Radix + CVA），移动端用这个直系移植，
  # 两端共用仓根 design-tokens.json 的同一份设计数值。
  # 主题映射见 lib/theme/shad_scheme.g.dart（由 scripts/gen_tokens.mjs 生成）。
  shadcn_ui: ^0.57.3

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  intl: ^0.20.2
  go_router: ^14.8.1
  http: ^1.2.0
  web_socket_channel: ^3.0.0
  url_launcher: ^6.2.0
  path_provider: ^2.1.0
  connectivity_plus: ^6.0.0

  # v2.5 BLE provisioning of shadow-esp32
  flutter_blue_plus: ^1.31.0
  # v2.4 USB Audio device detection/routing
  usb_serial: ^0.5.0

  # Database
  sqflite: ^2.3.0
  path: ^1.8.0

  # Multimodal input
  record: ^6.0.0
  image_picker: ^1.1.0
  camera: ^0.11.0
  file_picker: ^8.0.0

  # Voice Activity Detection
  vad: ^0.0.5
  permission_handler: ^11.3.1

  flutter_ai_toolkit: ^1.0.0
  crypto: ^3.0.3
  qr_flutter: ^4.1.0
  
  # GenUI - Agent2UI 框架
  genui: ^0.7.0
  genui_a2ui: ^0.7.0
  json_schema_builder: ^0.1.3
  logging: ^1.3.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  speech_to_text: ^7.0.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_localization_linter: ^1.0.2
  sqflite_common_ffi: ^2.3.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/models/
    - assets/config/
