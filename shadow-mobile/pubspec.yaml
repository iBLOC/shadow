name: shadow_mobile
description: "Shadow Mobile - Local LLM Application with MNN Engine"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  intl: ^0.20.2
  go_router: ^14.8.1
  http: ^1.2.0
  path_provider: ^2.1.0

  # Multimodal input
  record: ^5.1.0
  image_picker: ^1.1.0
  camera: ^0.11.0
  file_picker: ^8.0.0
  
  # GenUI - Agent2UI 框架
  genui: ^0.7.0
  genui_a2ui: ^0.7.0
  json_schema_builder: ^0.1.3
  logging: ^1.3.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_localization_linter: ^1.0.2

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/models/
