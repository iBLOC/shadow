name: Release

# One repo, one download surface.
#
# Everything a user can install is published as an asset of a **GitHub
# Release** on this repository: the Tauri bundles (Windows / macOS / Linux),
# the Android APK, and the web build. Workflow *artifacts* are not a
# distribution channel — they expire (5 days by default) and need a
# signed-in account, so they cannot be the thing users download.
#
# ── Layout ────────────────────────────────────────────────────────────
# The iBLOC stack is a multi-repo local-path workspace: every crate
# resolves its siblings via `path = "../<repo>"`. Two consequences:
#
#   1. `actions/checkout` refuses any path *outside* GITHUB_WORKSPACE, so
#      the siblings must be checked out into workspace sub-directories.
#   2. The desktop app's own path deps are spelled `../../../<repo>`
#      (relative to `shadow-desktop/src-tauri/`). That only lands inside
#      the workspace if **this repo is itself nested** — hence
#      `path: shadow` below. With shadow at the workspace root, those
#      deps would point one level above the workspace and cargo would
#      fail to load the manifests.
#
# The closure this job needs (transitive `path` deps, comments stripped):
#   synapse, diencephalon, hippocampus, neuron, prefrontal,
#   telencephalon, encephalon, ziti-rust

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish under (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The dependency tree (lance + datafusion + candle) produces multi-GB
  # debug artifacts; the hosted runner runs out of disk before it can link
  # them ("No space left on device").
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_RELEASE_DEBUG: '0'
  CARGO_INCREMENTAL: '0'

jobs:
  # ---------------------------------------------------------------------
  # Desktop: Tauri bundles for the three desktop platforms.
  # ---------------------------------------------------------------------
  desktop:
    name: Tauri Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout shadow
        uses: actions/checkout@v7
        with:
          path: shadow

      - name: Require cross-repo token
        env:
          IBLOC_TOKEN: ${{ secrets.IBLOC_TOKEN }}
        # ⚠️ 必须显式指定 bash：windows-latest 的默认 shell 是 **PowerShell**，
        #    而下面这段是 POSIX 语法 ⇒ ⇒ 在 Windows 上会被 PowerShell 解析成
        #    别的命令 ⇒ ⇒ ⇒ **报一个跟 token 毫无关系的错**（实测：Windows
        #    那格就死在这一步，而 ubuntu / macOS 两格过了）。
        shell: bash
        run: |
          if [ -z "$IBLOC_TOKEN" ]; then
            echo "::error::secrets.IBLOC_TOKEN is not configured."
            echo "::error::The iBLOC stack is a local-path workspace. telencephalon,"
            echo "::error::prefrontal, hippocampus, diencephalon, neuron, synapse,"
            echo "::error::encephalon and ziti-rust are private siblings and cannot"
            echo "::error::be checked out with the default GITHUB_TOKEN, which is"
            echo "::error::scoped to iBLOC/shadow only."
            exit 1
          fi

      # ⚠️⚠️ 兄弟仓**钉死 commit**，不跟默认分支 ——
      #    默认分支是「别人正在改的东西」⇒ ⇒ 它的在飞改动会直接打掉你的
      #    发布 ⇒ ⇒ 而且同一个 tag 两次发布会得到**不同的二进制**。
      #    升级钉版是一件**有意的**事：改这一处的 SHA + 跑一次发布。
      #    （顺带把「发布产物不可复现」那一格也闭上了。）
      #    钉版清单（2026-11-05）：
      #      telencephalon ecc5f9e0 · encephalon 9027e3d · diencephalon 7d1f596
      #      synapse 28979f9 · prefrontal e62af06 · hippocampus ae6b73a
      #      neuron b6926ac · ziti-rust 2403c57
      - name: Checkout telencephalon
        uses: actions/checkout@v7
        with:
          repository: iBLOC/telencephalon
          path: telencephalon
          ref: ecc5f9e0276f45ff2170d3334623a61d4193c074
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: Checkout encephalon
        uses: actions/checkout@v7
        with:
          repository: iBLOC/encephalon
          path: encephalon
          ref: 9027e3dd17cb74643a476e3d31e1eb7b8507b976
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: Checkout diencephalon
        uses: actions/checkout@v7
        with:
          repository: iBLOC/diencephalon
          path: diencephalon
          ref: 7d1f596ce1495d21562c65236f300880e53a5d4c
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: Checkout synapse
        uses: actions/checkout@v7
        with:
          repository: iBLOC/synapse
          path: synapse
          ref: 28979f93368bfeb9c71fee05c6aeb03ede393954
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: Checkout prefrontal
        uses: actions/checkout@v7
        with:
          repository: iBLOC/prefrontal
          path: prefrontal
          ref: e62af06068173a0c6650bab7d0eb803300d332db
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: Checkout hippocampus
        uses: actions/checkout@v7
        with:
          repository: iBLOC/hippocampus
          path: hippocampus
          ref: ae6b73aa74506ec9c7e07d965df4c45960f58650
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: Checkout neuron
        uses: actions/checkout@v7
        with:
          repository: iBLOC/neuron
          path: neuron
          ref: b6926acfe2c51ab7d4c85f5021c4eeb7b8a59654
          token: ${{ secrets.IBLOC_TOKEN }}

      # ziti-rust holds synapse's `ziti-v2` crate. Cargo reads the manifest
      # of an **optional** path dependency too, so it must be in place for
      # the dependency graph to resolve at all.
      - name: Checkout ziti-rust
        uses: actions/checkout@v7
        with:
          repository: iBLOC/ziti-rust
          path: ziti-rust
          ref: 2403c576d2f154df9354470bb260e7e941f20733
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: shadow/shadow-desktop/pnpm-lock.yaml

      - name: Free disk space (Linux)
        if: matrix.os == 'ubuntu-latest'
        # ⚠️ 每一刀都要 `|| true`：GitHub 的 bash 是 `-e` 模式 ⇒ ⇒ 任何一条
        #    rm 失败（目录不存在 / swapfile 正在用 / 权限不够）⇒ ⇒ **整个
        #    step 就红了** —— 而这一步的**目的**只是「尽量腾出磁盘」，
        #    「腾不出来」不该阻断发布。
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeSC || true
          sudo rm -rf /usr/local/share/swift /usr/local/share/powershell || true
          sudo rm -f /swapfile || true
          df -h /home/runner

      - name: Setup Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            shadow/shadow-desktop/src-tauri

      # lance-encoding's build script compiles .proto files with prost —
      # it needs protoc, which the runner image does not guarantee.
      # ⚠️⚠️ **三个平台都要装**：只装 Linux ⇒ ⇒ macOS 那格会死在
      #    "failed to run custom build command for `lance-encoding v14.0.2`
      #    / Could not find `protoc`" —— 而那是在**编了半小时之后**才炸
      #    （lance 家族在依赖图里很深 ⇒ ⇒ 炸得晚 ⇒ ⇒ 看起来像「编不过」）。
      - name: Install protoc
        shell: bash
        run: |
          set -e
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq protobuf-compiler
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install protobuf
          else
            # ⚠️ 两个包名都试：Chocolatey 上 protoc 的包名在不同版本里
            #    叫 `protoc` / `google.Protobuf` ⇒ ⇒ 试错比赌一个强。
            choco install protoc -y --no-progress || choco install google.Protobuf -y --no-progress
          fi
          # 装没装上当场看得见 —— 这一步是「编了半小时之后才炸」的那类
          # 故障的正面解法：把缺的东西提前钉住。
          protoc --version

      # macOS runner 的空闲磁盘很小（~14 GB）⇒ ⇒ 整栈编译（lance +
      # datafusion + candle 的 target/ 轻松上 10 GB）⇒ ⇒ 编到一半就
      # "No space left on device"。模拟器 runtime 对 Tauri 构建毫无用处
      # ⇒ ⇒ 先拿掉。
      - name: Free disk space (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          sudo rm -rf /Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.simruntime || true
          sudo rm -rf /Applications/Xcode.app/Contents/Developer/Platforms/AppleTVOS.platform/Developer/SDKs/AppleTVOS.simruntime || true
          df -h /Users/runner

      - name: Setup Tauri dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # ⚠️ **不能同时装 `libappindicator3-dev` 与 `libayatana-appindicator3-dev`**：
          #    后者明确 Conflicts 前者 ⇒ ⇒ apt 直接报
          #    "Unable to satisfy dependencies. Reached two conflicting assignments"
          #    ⇒ ⇒ ⇒ 装 `libayatana-appindicator3-dev` 就够（它是替代品）。
          #
          # ⚠️⚠️ `libspa-0.2-dev` 也不能少：屏幕捕获那层是
          #    `xcap → pipewire → libspa → libspa-sys` ⇒ ⇒ 而 `libspa-sys`
          #    的 build script 要 **pkg-config 找 libspa-0.2** ⇒ ⇒ 少它就
          #    "failed to run custom build command for `libspa-sys v0.10.1`"
          #    ⇒ ⇒ ⇒ 而 macOS / Windows **不需要**它（走 CoreGraphics /
          #    Windows Graphics Capture）⇒ ⇒ ⇒ ⇒ 只有 Linux 这一格要。
          #    `libssl-dev`：app 用了 native-tls ⇒ ⇒ 一起装上省一轮。
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libgtk-3-dev libayatana-appindicator3-dev libspa-0.2-dev libssl-dev
        shell: bash

      - name: Setup Tauri dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install libomp
        shell: bash

      # The auto-updater needs the *public* key compiled into the binary and
      # the *private* key to sign the artifacts. The private key only ever
      # exists as a repository secret. When they are absent the release
      # still ships — it just ships without updater artifacts, and says so.
      - name: Configure updater signing
        id: updater
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || [ -z "$TAURI_UPDATER_PUBKEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No updater signing key configured — shipping without updater artifacts."
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          node -e '
            const fs = require("fs");
            const p = "shadow/shadow-desktop/src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            c.bundle.createUpdaterArtifacts = true;
            c.plugins.updater.pubkey = process.env.TAURI_UPDATER_PUBKEY;
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n");
          '
          echo "TAURI_SIGNING_PRIVATE_KEY=$TAURI_SIGNING_PRIVATE_KEY" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: shadow/shadow-desktop
        run: pnpm install --frozen-lockfile

      # ⚠️ 锁必须**先**被核一遍，而且要**在编之前**。
      #    没有这一道，锁过期这件事会在**编了 40 分钟之后**才炸（而且炸在
      #    某个第三方 crate 的编译错上，看起来像「上游坏了」）⇒ ⇒ 这一道
      #    把它提前到**几分钟**、并且指向**真正的原因**（锁与清单不一致）。
      - name: Check the desktop lock is up to date
        shell: bash
        run: |
          cargo metadata --locked --manifest-path shadow/shadow-desktop/src-tauri/Cargo.toml > /dev/null
          echo "::notice::Desktop lock verified — the build below will use exactly these versions."

      - name: Build Tauri
        working-directory: shadow/shadow-desktop
        run: pnpm tauri build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tauri-bundle-${{ matrix.os }}
          path: |
            shadow/shadow-desktop/src-tauri/target/release/bundle/**
          retention-days: 5

  # ---------------------------------------------------------------------
  # Web: the PWA build. Attached to the release as a zip, and deployed to
  # GitHub Pages when Pages is enabled for this repository.
  # ---------------------------------------------------------------------
  web:
    name: Web PWA
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Checkout shadow
        uses: actions/checkout@v7
        with:
          path: shadow

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: shadow/shadow-desktop/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: shadow/shadow-desktop
        run: pnpm install --frozen-lockfile

      - name: Build web
        working-directory: shadow/shadow-desktop
        run: pnpm build:web

      - name: Package web build
        run: |
          mkdir -p dist-pkg/shadow-web
          cp -r shadow/shadow-desktop/dist-web/. dist-pkg/shadow-web/
          (cd dist-pkg && zip -qr shadow-web.zip shadow-web)

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-pwa
          path: |
            dist-pkg/shadow-web.zip
          retention-days: 5

      # Pages is a convenience mirror, not the distribution channel. If it
      # is not enabled for this repository the deploy is skipped — the
      # release still carries the web build.
      - name: Detect Pages
        id: pages
        shell: bash
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled for this repository — skipping the Pages deploy."
          fi

      - name: Upload GitHub Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: shadow/shadow-desktop/dist-web

      - name: Deploy to GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v5

  # ---------------------------------------------------------------------
  # Mobile: the Android APK.
  # ---------------------------------------------------------------------
  mobile:
    name: Mobile APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout shadow
        uses: actions/checkout@v7
        with:
          path: shadow

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Flutter
        # ⚠️ 版本必须与 shadow-mobile 对齐（README 记的是 3.47.8）：旧的
        #    3.11 带的是 Dart 3.0.x，在 stable 通道上**既装不上**
        #    （"Unable to determine Flutter version for channel: stable"）
        #    也不满足 pubspec 对 shadcn_flutter 的要求。
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable

      - name: Cache Flutter pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('shadow/shadow-mobile/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-flutter-pub-

      - name: Flutter pub get
        working-directory: shadow/shadow-mobile
        run: flutter pub get

      # 两件前置，缺一不可：
      # ① **许可证**：不接受 ⇒ ⇒ Gradle 直接报
      #    "LicenceNotAcceptedException: Failed to install the following
      #    Android SDK packages as some licences have not been accepted"。
      # ② **NDK**：app 的 build.gradle 钉死了 `ndkVersion = "30.0.14904198"`
      #    ⇒ ⇒ runner 镜像里没有这个版本 ⇒ ⇒ 得自己装（否则 Gradle 去下载
      #    那个版本，而下载也要先有许可证）。
      - name: Accept Android SDK licenses and install the pinned NDK
        shell: bash
        run: |
          set -e
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$PATH"
          yes | timeout 180 sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "ndk;30.0.14904198" "platform-tools" > /dev/null
          sdkmanager --list_installed 2>/dev/null | grep -E "ndk;|platform-tools" || true

      - name: Build APK
        working-directory: shadow/shadow-mobile
        # ⚠️ **不能**加 `--split-per-abi`：AGP 里「ndk abiFilters」与
        #    「splits abi filters」**互斥** —— 同时给会报
        #    "Conflicting configuration : 'arm64-v8a,x86_64' in ndk abiFilters
        #    cannot be present when splits abi filters are set"。
        #    而本 app 的 Gradle **自己**钉了 abiFilters（arm64-v8a / x86_64，
        #    排掉 armeabi-v7a）⇒ ⇒ 不拆包反而**正是它的本意**：
        #    出一个含那两种 ABI 的通用 APK。
        run: flutter build apk --release

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mobile-apk
          path: |
            shadow/shadow-mobile/build/app/outputs/flutter-apk/**
          retention-days: 5

  # ---------------------------------------------------------------------
  # Publish: everything above becomes one GitHub Release — the single
  # download surface for users.
  # ---------------------------------------------------------------------
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [desktop, web, mobile]
    steps:
      - name: Checkout shadow
        uses: actions/checkout@v7
        with:
          path: shadow

      - name: Resolve tag
        id: tag
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$DISPATCH_TAG" ]; then
            tag="$DISPATCH_TAG"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      # A release whose installer says 0.2.0 while the tag says v0.1.0 is
      # the kind of thing that is only discovered by a user. Fail here.
      - name: Check tag matches the bundled version
        shell: bash
        run: |
          set -euo pipefail
          want="$(node -p "require('./shadow/shadow-desktop/src-tauri/tauri.conf.json').version")"
          got="${RELEASE_TAG#v}"
          if [ "$want" != "$got" ]; then
            echo "::error::Tag $RELEASE_TAG does not match tauri.conf.json version $want"
            exit 1
          fi
          echo "Tag $RELEASE_TAG matches tauri.conf.json version $want"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find dist -type f | while read -r f; do
            base="$(basename "$f")"
            # Bundlers emit several files with the same basename across
            # platforms (e.g. `latest.json`); keep them apart.
            case "$base" in
              *.msi|*.exe|*.dmg|*.deb|*.AppImage|*.rpm|*.app.tar.gz|*.apk|*.aab|*.zip|*.sig|latest.json)
                target="release-assets/$base"
                n=1
                while [ -e "$target" ]; do
                  target="release-assets/${base%.*}-$n.${base##*.}"
                  n=$((n+1))
                done
                cp "$f" "$target"
                ;;
            esac
          done
          echo "--- assets ---"
          ls -la release-assets/
          # An empty release is worse than a failed one: the tag exists, the
          # page looks fine, and there is nothing to download.
          if [ -z "$(ls -A release-assets)" ]; then
            echo "::error::No release assets were collected — refusing to publish an empty release."
            exit 1
          fi

      - name: Write release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          ## 下载

          | 平台 | 文件 |
          |---|---|
          | Windows | `*.msi`（安装包）／ `*.exe`（便携版） |
          | macOS | `*.dmg` ／ `*.app.tar.gz` |
          | Linux | `*.deb` ／ `*.AppImage` ／ `*.rpm` |
          | Android | `*.apk`（按 ABI 分包） |
          | 浏览器 | `shadow-web.zip`（免安装） |

          桌面端内置自动更新：它从本仓的 Releases 页面取 `latest.json`。
          EOF
          # Auto-generated notes say what changed; the table above says how
          # to install. Keep both — but never let one silently replace the
          # other, so the generated part is fetched explicitly.
          auto="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" --jq .body 2>/dev/null || true)"
          if [ -n "$auto" ]; then
            { cat notes.md; printf '\n---\n\n%s\n' "$auto"; } > notes-final.md
          else
            cp notes.md notes-final.md
          fi

      - name: Create or update the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --title "Shadow $RELEASE_TAG" --notes-file notes-final.md
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --title "Shadow $RELEASE_TAG" \
              --notes-file notes-final.md
          fi
