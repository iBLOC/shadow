name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop-tauri:
    name: Tauri Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Setup Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./shadow-desktop/src-tauri

      - name: Setup Tauri dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libayatana-appindicator3-dev
        shell: bash

      - name: Install dependencies
        working-directory: shadow-desktop
        run: pnpm install --frozen-lockfile

      - name: Build Tauri
        working-directory: shadow-desktop
        run: pnpm tauri build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-bundle-${{ matrix.os }}
          path: |
            shadow-desktop/src-tauri/target/release/bundle/**
          retention-days: 5

  web-pwa:
    name: Web PWA
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        working-directory: shadow-desktop
        run: pnpm install --frozen-lockfile

      - name: Build web
        working-directory: shadow-desktop
        run: pnpm build:web

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: shadow-desktop/dist-web

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

  mobile-apk:
    name: Mobile APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.11'
          channel: stable

      - name: Cache Flutter pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('shadow-mobile/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-flutter-pub-

      - name: Flutter pub get
        working-directory: shadow-mobile
        run: flutter pub get

      - name: Build APK
        working-directory: shadow-mobile
        run: flutter build apk --release --split-per-abi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-apk
          path: |
            shadow-mobile/build/app/outputs/flutter-apk/**
          retention-days: 5