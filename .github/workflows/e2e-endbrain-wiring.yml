name: E2E Endbrain Wiring

# ⚠️ **它守的是什么** —— 2026-11-11 刀 Q 的实测（iBLOC/shadow）：
#   Desktop E2E 那条 job 里，端脑地址**从来没在 workflow 里出现过** ⇒ ⇒
#   于是两边各拿各的默认值：
#     · 前端 bundle —— web 形态没有 sidecar ⇒ ⇒ 靠**构建期**地址
#       （VITE_PREFRONTAL_URL）⇒ ⇒ CI 不传 ⇒ ⇒ 落回产品里**硬编码**的
#       http://127.0.0.1:60080；
#     · 端脑 child —— global-setup 从 SHADOW_TELENCEPHALON_URL 取端口
#       ⇒ ⇒ 没配 ⇒ ⇒ 落回**另一个**默认（同一个文件里的 '60080'）。
#   ⇒ ⇒ 「能跑通」靠的是**两个各自独立的默认值恰好相等** ⇒ ⇒ **是巧合，
#   不是接线** ⇒ ⇒ 一旦其中一边改了 ⇒ ⇒ E2E 连不上，而**红在 spec 里**
#   （离原因很远）⇒ ⇒ 「跑过了」在接线漂了之后依然成立。
#   ⇒ ⇒ 这一闸把「接线形状」变成可数的读数：**一个真源、两处引用、
#   构建后当场核对**。
#
# ⚠️ **为什么单独成文件**（与 commit-revert.yml 同理）：
#   ci.yml 是**共享文件**（并行会话在飞）⇒ ⇒ 共享文件上的接线是本仓最容易出
#   两类事故的地方 ⇒ ⇒ 独立成文件 ⇒ ⇒ 接线面**零共享** ⇒ ⇒ 竞态根本不存在。

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e-endbrain-wiring:
    name: E2E Endbrain Wiring
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # ⚠️ 判读落盘路径（**仓外**）—— 分母要覆盖**这一盏灯里所有**真跑的闸 ⇒ ⇒ 每道闸的结论都得落到同一份记录里 ⇒ ⇒ 收尾一步汇总成带分母的读数。
      # ⚠️ 落在仓根会污染被测面（顶层对账闸会当场判红）⇒ ⇒ 用 RUNNER_TEMP。
      # ⚠️ 落盘路径**不能**用表达式上下文（job 级 env 里不可用 ⇒ ⇒ 整个 workflow 文件会被拒绝加载 ⇒ ⇒ run 零 job 失败）。
      - name: 准备判读落盘路径（仓外）
        run: echo "GATE_RESULT_FILE=$RUNNER_TEMP/gate-results.ndjson" >> "$GITHUB_ENV"
      - name: Checkout shadow
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # ⚠️ **两步都要跑** —— 判定 ＋ 判据自检（自检证明这道闸**真的会红**）。
      - name: E2E 端脑地址接线检查
        run: node scripts/run-gate-once.mjs --strict scripts/check-e2e-endbrain-wiring.mjs

      - name: E2E 端脑地址接线检查（自检）
        run: node scripts/check-e2e-endbrain-wiring.mjs --self-test
      # ⚠️ 收尾：把这一盏灯「绿得有多真」写出来 —— 这一盏灯里**所有**真跑的闸
      #    都落了判读 ⇒ ⇒ 这里汇总成**带分母的读数**（真判 N ｜ 判不了 K ｜ 红 M）
      #    ⇒ ⇒ 「判不了」不当红（它不是「有问题」）⇒ ⇒ 但也不当绿（它不是「没问题」）。
      # ⚠️ if: always() ⇒ ⇒ **闸红的时候分母照样在** ⇒ ⇒ 不然「红」的那一格
      #    恰好是**唯一没有分母**的那一格 ⇒ ⇒ 红灯也读不出「到底跑了哪几道」。
      - name: 判读汇总（带分母的绿灯）
        if: always()
        run: node scripts/lib/gate-tally.mjs --report
