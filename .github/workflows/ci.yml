name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  prefrontal-rust:
    name: Prefrontal Rust
    runs-on: ubuntu-latest
    # 整栈编译 + 链接很慢，给足时间；但别让它无限跑下去 —— 磁盘/内存
    # 打满时 runner 会被直接掐掉，日志都传不回来（比超时更难查）。
    timeout-minutes: 60
    env:
      # 关掉调试信息：debug info 占 target/ 的大头，去掉后体积能降一大截，
      # 直接缓解 runner 磁盘写满的问题。
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout shadow
        uses: actions/checkout@v7

      - name: Require cross-repo token
        env:
          IBLOC_TOKEN: ${{ secrets.IBLOC_TOKEN }}
        run: |
          if [ -z "$IBLOC_TOKEN" ]; then
            echo "::error::secrets.IBLOC_TOKEN is not configured."
            echo "::error::The iBLOC stack is a local-path workspace. prefrontal,"
            echo "::error::hippocampus and neuron are private siblings and cannot be"
            echo "::error::checked out with the default GITHUB_TOKEN, which is scoped"
            echo "::error::to iBLOC/shadow only. Add a PAT with read access to those"
            echo "::error::repos as the IBLOC_TOKEN repository secret."
            exit 1
          fi

      # The iBLOC stack is a multi-repo local-path workspace: every crate
      # resolves siblings via `path = "../<repo>"`. `actions/checkout`
      # refuses any path outside GITHUB_WORKSPACE, so siblings MUST be
      # checked out into workspace sub-directories (not `../<repo>`).
      #
      # Closure for prefrontal (transitive `path` deps, comments stripped):
      #   synapse            -> (leaf)
      #   neuron             -> (leaf)
      #   hippocampus/hippocampus-core -> neuron, synapse
      #   prefrontal         -> synapse, hippocampus/hippocampus-core
      - name: Checkout prefrontal
        uses: actions/checkout@v7
        with:
          repository: iBLOC/prefrontal
          path: prefrontal
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: Checkout synapse
        uses: actions/checkout@v7
        with:
          repository: iBLOC/synapse
          path: synapse
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: Checkout hippocampus
        uses: actions/checkout@v7
        with:
          repository: iBLOC/hippocampus
          path: hippocampus
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: Checkout neuron
        uses: actions/checkout@v7
        with:
          repository: iBLOC/neuron
          path: neuron
          token: ${{ secrets.IBLOC_TOKEN }}

      # cargo 自己 clone **私有 git 依赖**时也要凭据 ——
      # synapse 的 ziti feature 指向私有的 iBLOC/ziti-rust。actions/checkout
      # 的 token 只作用于 checkout 步骤，cargo 自己的 git fetch 拿不到 →
      # "failed to authenticate when downloading repository"。
      #
      # 关键：cargo 默认用 libgit2 拉依赖，而 **libgit2 不认
      # url.<base>.insteadOf** —— 必须让 cargo 改用 git CLI
      # （net.git-fetch-with-cli），改写才生效。
      #
      # 顺带装 protoc：lance-encoding 的 build script 要它（prost_build 编译
      # .proto），runner 镜像不保证带 protobuf 编译器。
      - name: Prepare Rust dependencies
        env:
          IBLOC_TOKEN: ${{ secrets.IBLOC_TOKEN }}
        run: |
          set -eu
          echo "::add-mask::$IBLOC_TOKEN"
          # secret 里可能带尾部换行（用 `gh secret set` 从 stdin 灌进去时不会
          # 自动 trim）—— 直接嵌进 URL 会让凭据失效，报
          # "Authentication failed"。这里先剥掉所有 CR/LF。
          TOKEN="$(printf '%s' "$IBLOC_TOKEN" | tr -d '\r\n')"
          mkdir -p "$HOME/.cargo"
          printf '[net]\ngit-fetch-with-cli = true\n' >> "$HOME/.cargo/config.toml"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler

      # runner 磁盘：GitHub 托管的 ubuntu-latest 预装了 dotnet/ghc/boost/
      # android ndk 等一堆用不上的工具（合计 ~10GB），而本 job 要编整个
      # iBLOC 栈（datafusion / burn / aws-sdk 全家），target/ 轻松上 10GB。
      # 2026-10-29 实测就是磁盘写满把 runner 打死：
      #   "No space left on device" → ld 报 "Bus error, core dumped"
      # → 整个 job 失败且日志都传不上来。先把没用的预装工具删掉。
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeSC
          sudo rm -rf /usr/share/swift /usr/local/share/powershell
          sudo rm -f /swapfile
          df -h /home/runner

      # rust-cache 的 workspaces 是**逐行**列表，用逗号分隔会被当成一个
      # 路径 —— 缓存直接失效（"The cwd: .../a,b,c does not exist!"），
      # 于是每次都从零重编整栈，又慢又撑爆磁盘。
      - name: Setup Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            prefrontal
            synapse
            hippocampus
            neuron

      - name: Cargo check
        working-directory: prefrontal
        run: cargo check --manifest-path Cargo.toml

      - name: Cargo test
        working-directory: prefrontal
        run: cargo test --manifest-path Cargo.toml

      - name: Cargo clippy
        working-directory: prefrontal
        run: cargo clippy --manifest-path Cargo.toml -- -D warnings

      # ⚠️⚠️ **neuron 必须保持「candle-free 可编译」** ⇒ ⇒ 端脑
      #    (telencephalon) 与桌面端都用 `default-features = false` 消费它
      #    ⇒ ⇒ 那是 router-only 的构建 ⇒ ⇒ neuron 的 candle 一旦漏成
      #    「假可选」，这两个消费者就编不过（2026-11-04 实测：92 个编译
      #    错误，其中 71 个集中在 `src/mage_vl/`）。
      # ⇒ ⇒ 这条把那个不变量钉在 CI 上：谁把 candle 依赖漏回非可选，
      # ⇒ ⇒ 这里当场红，而不是等到端脑/桌面端编不过才发现。
      - name: Neuron candle-free check (router-only consumers)
        working-directory: neuron
        run: cargo check --manifest-path Cargo.toml --no-default-features --all-targets

  desktop-test:
    name: Desktop Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.31.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: shadow-desktop/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: shadow-desktop
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: shadow-desktop
        run: pnpm exec vitest run

  desktop-e2e:
    name: Desktop E2E (Playwright + 端脑)
    # Promotes the soft-skip Playwright specs (e2e-conversation-flow,
    # e2e-task-scheduling, business-flow-ui) to a real CI run against the
    # 端脑 server binary built alongside this job (`encephalon-server`).
    #
    # NOTE (P0-D, 2026-09-27): Real-green depends on the telencephalon
    # neuron_handle.shutdown hang bug being fixed
    # (audit addendum 2026-09-26 L298-310). Until then this job may fail
    # at boot when no in-process neuron is available.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout shadow
        uses: actions/checkout@v7

      - name: Require cross-repo token
        env:
          IBLOC_TOKEN: ${{ secrets.IBLOC_TOKEN }}
        run: |
          if [ -z "$IBLOC_TOKEN" ]; then
            echo "::error::secrets.IBLOC_TOKEN is not configured."
            echo "::error::The iBLOC stack is a local-path workspace. telencephalon,"
            echo "::error::prefrontal, hippocampus, diencephalon, temporal and"
            echo "::error::occipital are private siblings and cannot be checked out"
            echo "::error::with the default GITHUB_TOKEN, which is scoped to"
            echo "::error::iBLOC/shadow only. Add a PAT with read access to those"
            echo "::error::repos as the IBLOC_TOKEN repository secret."
            exit 1
          fi

      # telencephalon's transitive `path` dep closure (comments stripped):
      #   synapse                              -> (leaf)
      #   neuron                               -> (leaf)
      #   hippocampus/{core,storage,server}    -> neuron, synapse
      #   diencephalon                         -> synapse
      #   temporal                             -> synapse, hippocampus-core
      #   occipital                            -> synapse, hippocampus-core
      #   prefrontal                          -> synapse, hippocampus-core
      #   telencephalon                        -> all of the above
      - name: Checkout telencephalon
        uses: actions/checkout@v7
        with:
          repository: iBLOC/telencephalon
          path: telencephalon
          token: ${{ secrets.IBLOC_TOKEN }}
      # 「外部工具的模型配置」接线闸 —— 桌面端 ⇄ 端脑 ⇄ 界面 三处对齐。
      # ⚠️ 它盯的不只是「有没有接上」，而是**材料纪律**：明文密钥会不会
      #    漏到界面 / 漏进错误串（进而进日志）/ 被写进 OAuth 令牌槽。
      # ⚠️⚠️ **必须放在这个 job** ⇒ ⇒ 它要读**兄弟仓**（端脑的 providers
      #    源码）⇒ ⇒ desktop-build 那个 job 只 checkout 本仓 ⇒ ⇒ 放那儿
      #    ⇒ ⇒ 源读不到 ⇒ ⇒ 闸按「退出码 2」阻断 ⇒ ⇒ 而 desktop-e2e 把
      #    兄弟仓检出在**工作区根之内** ⇒ ⇒ 闸认本地/CI 那两种布局。
      # ⚠️ 2026-11-05：synapse 的 OpenZiti **v2** 线路层抽到了
      # iBLOC/ziti-rust 的**第二个 crate**（ziti-v2）⇒ ⇒ 而 telencephalon 的
      # synapse 依赖**无条件**开着 ziti ⇒ ⇒ ⇒ 任何**解析依赖图**的动作
      # （cargo fmt / check / test / clippy / doc）⇒ ⇒ ⇒ 都需要这个兄弟仓在位
      # （path 依赖 ../ziti-rust/crates/ziti-v2）。
      - name: Checkout ziti-rust
        uses: actions/checkout@v7
        with:
          repository: iBLOC/ziti-rust
          path: ziti-rust
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: External tools wiring check
        run: node scripts/check-external-tools.mjs

      - name: External tools wiring check (self-test)
        run: node scripts/check-external-tools.mjs --self-test

      # The standalone 端脑 server binary lives in `encephalon`
      # (`encephalon-server`); `telencephalon` itself is a pure library
      # since the 2026-10 merge, so there is no `telencephalon` binary to
      # build any more. `encephalon`'s path deps point at the siblings
      # checked out below, so one more checkout completes the closure.
      - name: Checkout encephalon
        uses: actions/checkout@v7
        with:
          repository: iBLOC/encephalon
          path: encephalon
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: Checkout synapse
        uses: actions/checkout@v7
        with:
          repository: iBLOC/synapse
          path: synapse
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: Checkout prefrontal
        uses: actions/checkout@v7
        with:
          repository: iBLOC/prefrontal
          path: prefrontal
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: Checkout hippocampus
        uses: actions/checkout@v7
        with:
          repository: iBLOC/hippocampus
          path: hippocampus
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: Checkout neuron
        uses: actions/checkout@v7
        with:
          repository: iBLOC/neuron
          path: neuron
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: Checkout diencephalon
        uses: actions/checkout@v7
        with:
          repository: iBLOC/diencephalon
          path: diencephalon
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: Checkout temporal
        uses: actions/checkout@v7
        with:
          repository: iBLOC/temporal
          path: temporal
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: Checkout occipital
        uses: actions/checkout@v7
        with:
          repository: iBLOC/occipital
          path: occipital
          token: ${{ secrets.IBLOC_TOKEN }}

      # 见上面 prefrontal-rust job 的同名步骤 —— 端脑 server 的构建链同样要
      # 私有 git 依赖的凭据（ziti-sdk）与 protoc（lance-encoding）。
      - name: Prepare Rust dependencies
        env:
          IBLOC_TOKEN: ${{ secrets.IBLOC_TOKEN }}
        run: |
          set -eu
          echo "::add-mask::$IBLOC_TOKEN"
          # secret 里可能带尾部换行（用 `gh secret set` 从 stdin 灌进去时不会
          # 自动 trim）—— 直接嵌进 URL 会让凭据失效，报
          # "Authentication failed"。这里先剥掉所有 CR/LF。
          TOKEN="$(printf '%s' "$IBLOC_TOKEN" | tr -d '\r\n')"
          mkdir -p "$HOME/.cargo"
          printf '[net]\ngit-fetch-with-cli = true\n' >> "$HOME/.cargo/config.toml"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.31.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: shadow-desktop/pnpm-lock.yaml

      # runner 磁盘 —— 见 prefrontal-rust job 的同名步骤：预装工具先删掉。
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeSC
          sudo rm -rf /usr/share/swift /usr/local/share/powershell
          sudo rm -f /swapfile
          df -h /home/runner

      # workspaces 必须逐行写，逗号分隔会让 rust-cache 缓存彻底失效。
      - name: Setup Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            telencephalon
            encephalon
            synapse
            prefrontal
            hippocampus
            neuron
            diencephalon
            temporal
            occipital

      # neuron's 归属：「全局唯一 neuron，由大脑直接管理」——
      # ⚠️ 这道闸**跨兄弟仓**（端脑 / 大脑 / 前额叶 / 海马体 / neuron / 叶区…）
      #    ⇒ ⇒ 它只有在这个 job 里有意义（这里 checkout 了全套仓）
      #    ⇒ ⇒ 放在只 checkout 了 shadow 自己那份的 job 里 ⇒ ⇒ 跨仓判据
      #    **全都没覆盖** ⇒ ⇒ 那是一盏「绿灯但什么都没查」的灯。
      # 判据分三层：源码层（谁在自己体内实例化运行时）／feature 图层
      # （谁在脑侧那条链上开了 local-models 或 candle）／产物层
      # （编译出来的二进制里到底装了几套运行时）。
      - name: Neuron ownership check
        run: node scripts/check-neuron-ownership.mjs

      # One process, one port: neuron's OpenAI face at the root, the 端脑
      # face (/shadow/v1/*, /api/telencephalon/*), 海马体 at /hippocampus.
      - name: Build the 端脑 server
        working-directory: encephalon
        run: cargo build --manifest-path Cargo.toml --bin encephalon-server

      - name: Install dependencies
        working-directory: shadow-desktop
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: shadow-desktop
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E against the 端脑 server
        working-directory: shadow-desktop
        env:
          SHADOW_CORTEX_BIN: ${{ github.workspace }}/encephalon/target/debug/encephalon-server
          SHADOW_CORTEX_CWD: ${{ github.workspace }}/encephalon
          SHADOW_FULL_STACK: '1'
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
            pnpm exec playwright test --reporter=github \
              e2e-conversation-flow e2e-task-scheduling business-flow-ui \
              telencephalon-endpoints

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: shadow-desktop/playwright-report
          retention-days: 7

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: shadow-desktop/test-results
          retention-days: 7

  desktop-build:
    name: Desktop Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.31.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: shadow-desktop/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: shadow-desktop
        run: pnpm install --frozen-lockfile

      # 桌面端与移动端是同一个 agent 的两个终端。design-tokens.json 与
      # agent-surface.json 是两端共享的唯一真相源；这一步守住它们不被
      # 两端各自改漂（清单里的路由不存在 / 两端偷偷多出或少了路由 /
      # 生成物与 token 源不同步 / 两端手写色值 / 玻璃语义不对等）。
      - name: Cross-client consistency check
        run: node scripts/check-agent-surface.mjs

      # 移动端无障碍通道的契约闸 —— Dart ↔ Kotlin 两端必须逐字对齐。
      # ⚠️ 这条通道**跨两种语言**（Dart 调方法通道 / Kotlin 处理）⇒ ⇒
      # 没有编译器会告诉你对不上 ⇒ ⇒ 而对不上的后果是**静悄悄**的：
      # 方法名对不上 ⇒ notImplemented；参数名对不上 ⇒ 坐标读成 0 ⇒ ⇒
      # **点到了屏幕左上角**；取值对不上 ⇒ 「最近任务」变成「返回」。
      # ⇒ ⇒ 本仓真的发生过（㌇ 条 ⑧）⇒ ⇒ 所以要有闸。
      - name: Mobile a11y contract check
        run: node scripts/check-mobile-a11y-contract.mjs

      # 两端供应商面**逐项对齐**闸 —— 「供应商都是大脑提供的」这句话的守门人。
      # ⚠️ 桌面端与移动端打的是**同一张端脑表** ⇒ ⇒ 两端必须发**同一组字段**、
      # 打**同一组端点** ⇒ ⇒ 而「少发一个字段」的后果是**静默降级**：大脑对
      # 「没给接口标准」的兜底是 OpenAI ⇒ ⇒ 手机上加的自定义供应商一律 openai
      # ⇒ ⇒ 加 Claude 协议的端点必坏、而界面看不出异常（失败长得像成功）。
      # ⇒ ⇒ 判据**逐个函数体**看（不是「文件里出现过就算」）⇒ ⇒ 反向验证
      # ⇒ ⇒ 把 add 那条路弄坏、update 那条路留着 ⇒ ⇒ 闸照样红。
      - name: Provider parity check
        run: node scripts/check-provider-parity.mjs

      - name: Provider parity check (self-test)
        run: node scripts/check-provider-parity.mjs --self-test

      # Cortex 残留闸 —— 「Cortex 是过时概念应该删除」这条线的守门人。
      # ⚠️ 旧的两道 .sh 闸有三个洞：只看**标识符**（界面那句「启动 Cortex」
      #    根本不在判据里）／**没进 CI**（绿不绿没人知道）／**Windows 上跑不了**
      #    （本机 WSL 无发行版 ⇒「有闸」只能靠人记着）。⇒ 重写成 Node。
      # ⚠️ 判据：活代码里出现 cortex = 残留（红）；兼容契约（路由路径 /
      #    cortex-status、4 个旧环境变量别名、真实 PG 表名、mDNS 旧键、
      #    A2A 信封字段、兼容 shim 模块名…）必须逐条登记在豁免表里。
      - name: Cortex residue check
        run: node scripts/check-cortex-residue.mjs

      # JNI 面：Kotlin ↔ 宿主直测的 Java 替身 + jniLibs 里那份 .so 的符号。
      # ⚠️ 装错 .so ⇒ Kotlin 把 UnsatisfiedLinkError catch 掉 ⇒
      # 「端脑面上锁」**静默失效**（同设备任意 App 能换掉「这台机器是谁」）。
      # 干净 checkout 没有 .so（它被 gitignore）⇒ 只报提示、不阻断。
      - name: JNI surface check
        run: node scripts/check-jni-surface.mjs

      # APK 产物级：查**真正装进手机**的那份 —— 入口是不是正牌 App
      # （不是集成测试壳）+ 里面那份 .so 的符号 / 运行时依赖 / 与 jniLibs
      # 是否同一份。⚠️ jniLibs 对了但 **APK 是旧的** ⇒ 一样是坑。
      # 干净 checkout 没有 APK ⇒ 只报提示、不阻断。
      - name: APK surface check
        run: node scripts/check-apk-surface.mjs

      # 通信链路：所有通信都要走 大脑 → 端脑 → 叶区。客户端直连推理
      # （neuron_infer / /v1/chat/completions）或本地直连编排器 = 意图
      # 路由、工具、flow、人格注入全都不在链路上 —— 桌面端真实发生过
      # （isTauri() 分支让对话直连 neuron，于是永远收不到 tool_call）。
      - name: Brain chain check
        run: node scripts/check-brain-chain.mjs

      # neuron's 归属：「全局唯一 neuron，由大脑直接管理」—— 消费者自己
      # 实例化一个（run_embedded / CandleLlmRuntime / create_router）⇒ ⇒
      # 就是第二个 neuron ⇒ ⇒ 同一批模型被**重复占用**（实测：本机一个游离
      # neuron_server 与脑面内嵌的那个登记同一批 38 个模型）。
      # ⚠️ 这道闸扫**兄弟仓**（存在才扫）⇒ ⇒ 本 job 已 checkout 全部相关仓。
      - name: Neuron ownership check
        run: node scripts/check-neuron-ownership.mjs

      # 闸自己的自检（27 条用例，含真实事故夹具 ＋ 孪生用例）——
      # 它只吃合成夹具 ⇒ ⇒ 不需要兄弟仓 ⇒ ⇒ 放这儿当**快速护栏**。
      # ⚠️ 跨仓那一层要 desktop-e2e 那个 job（那里 checkout 了全套仓）。
      - name: Neuron ownership check (self-test)
        run: node scripts/check-neuron-ownership.mjs --self-test

      # 生成物是从属的：改 design-tokens.json 后必须重跑生成器。
      # 这条单独拎出来，让漂移的报错一眼能定位。
      - name: Design token drift check
        run: node scripts/gen_tokens.mjs --check

      # 导航结构同样只有一份定义（agent-surface.json 的 navigation 段），
      # 两端导航都是生成物 —— 改了清单忘了重跑生成器 = 两端导航悄悄分叉。
      - name: Navigation drift check
        run: node scripts/gen_nav.mjs --check

      # 「状态面治理」闸 —— **持久状态的生命周期治理**（arXiv:2606.30306）。
      # ⚠️ 本仓最强的另一半（上面 30 道 check-*）**全建在源码上**，
      #    而**状态面**（账本 / 记忆 / 用户偏好）**一条闸都没有**。
      # ⇒ ⇒ 这道闸盯的是：新条目**有没有信封**（授权 epoch / 来源 /
      #    取代链 ⇒ ⇒ 论文那个 required ablation 的最小落法）、
      #    来源指针**能不能解析**、取代链**断没断**、存量债务**有没有变多**、
      #    以及仓里**有没有未登记的状态面**。
      # ⚠️ 只读仓内的面 ⇒ ⇒ CI 里可跑（本地记忆面在 CI 不存在 ⇒ ⇒ 明确报「未覆盖」）。
      - name: State surface governance check
        run: node scripts/check-state-surface.mjs

      - name: State surface governance check (self-test)
        run: node scripts/check-state-surface.mjs --self-test

      # 「用户偏好撤销通道」闸 —— **authority lapse 的机械形态**
      # （arXiv:2606.30306 §2.5：用户撤回了偏好，agent 仍照做）。
      # ⇒ ⇒ 它盯的是：撤了**有没有真的生效**（V4）、生效了**有没有来源**
      #    （V5）、派生副本**有没有传播**（V6）、**谁授权的**（V2）。
      # ⚠️ CI 里没有用户记忆面 ⇒ ⇒ V3/V4/V5/V6 那几条**明确报「本轮未覆盖」**
      #    （不假装绿）⇒ ⇒ CI 守的是**账本自身**（V1/V2/V7）＋ 自检里的
      #    **完整生命周期演练**（每一步该红的地方都红）。
      - name: Preference revocation check
        run: node scripts/check-preference-revocation.mjs

      - name: Preference revocation check (self-test)
        run: node scripts/check-preference-revocation.mjs --self-test

      # logo 几何同理：真相源在 brand/geom.mjs，两端图标与应用内标记都是
      # 生成物。改了几何忘了重跑 = 应用图标与应用内 logo 悄悄对不上。
      - name: Brand asset drift check
        run: node brand/gen-icons.mjs --check

      - name: TypeScript check
        working-directory: shadow-desktop
        run: pnpm exec tsc --noEmit

      - name: Build Tauri
        working-directory: shadow-desktop
        run: pnpm build

      - name: Build web
        working-directory: shadow-desktop
        run: pnpm build:web

  mobile-analyze:
    name: Mobile Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      # Flutter 3.47.8 ships Dart SDK 3.13.7, which satisfies the
      # `environment: sdk: ^3.11.1` constraint in shadow-mobile/pubspec.yaml.
      #
      # 升级到 3.47 是为了引入 shadcn_flutter 0.0.55（它要求
      # Flutter >=3.47.0 / Dart >=3.13.0）。旧版 3.11 的 `flutter-version`
      # 带的是 Dart 3.0.x，在 stable 通道上既装不上也不满足 pubspec。
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable

      - name: Cache Flutter pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('shadow-mobile/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-flutter-pub-

      - name: Flutter pub get
        working-directory: shadow-mobile
        run: flutter pub get

      - name: Flutter analyze
        working-directory: shadow-mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  mobile-test:
    name: Mobile Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # sqflite_common_ffi reaches SQLite through dart:ffi and looks for a
      # plain "libsqlite3.so". ubuntu-latest ships libsqlite3.so.0 but not
      # always the -dev symlink, so install it explicitly.
      - name: Install SQLite runtime
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable

      - name: Cache Flutter pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('shadow-mobile/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-flutter-pub-

      - name: Flutter pub get
        working-directory: shadow-mobile
        run: flutter pub get

      # The suite was never wired into CI before, so it had rotted: 28 of
      # 201 cases failed (stale copy assertions, missing localization
      # delegates, two infinite-animation pumpAndSettle timeouts). Keep this
      # job so the same drift cannot come back unnoticed.
      - name: Flutter test
        working-directory: shadow-mobile
        run: flutter test

      # Android 模块的 **JVM 单测**（2026-11-03 建）—— Kotlin 侧的纯逻辑
      # 在这里跑。此前 Android 模块**一个单测都没有** ⇒ ⇒ Kotlin 的纯逻辑
      # 只靠「编译通过」担保 ⇒ ⇒ 而「编译通过」证明不了**边界值**。
      #
      # ⚠️ `local.properties` 是 **gitignore** 的（本地绝对路径，不能进仓）
      #    ⇒ ⇒ CI 上要自己生成：`flutter.sdk` 从 `FLUTTER_ROOT` 取（没有就
      #    从 `which flutter` 反推两级），`sdk.dir` 从 `ANDROID_HOME` 取。
      # ⚠️ 这一步会拉 `androidx.test:runner`（`integration_test` 的传递依赖，
      #    而且是**动态版本** `1.2+`）⇒ ⇒ 必须**联网** ⇒ ⇒ 不能加 --offline。
      - name: Android unit test
        working-directory: shadow-mobile/android
        run: |
          FLUTTER_SDK="${FLUTTER_ROOT:-$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")}"
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_SDK" > local.properties
          ./gradlew :app:testDebugUnitTest

  ps1-portability:
    name: PS1 Portability (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 本仓的 `.ps1` 都带中文注释 ⇒ ⇒ 必须是 **UTF-8 with BOM**。
      # 否则 Windows PowerShell 5.1（Windows 的**默认** shell）按 ANSI 读
      # ⇒ ⇒ 双字节解码把 0x0A 当尾字节吃掉 ⇒ ⇒ **换行消失**
      # ⇒ ⇒ 注释行与下一行合并 ⇒ ⇒ `#` 把真正的代码吞掉
      # ⇒ ⇒ **解析期就报错** ⇒ ⇒ 脚本连跑都跑不起来（报错是乱码，
      # 看着像「脚本自己写错了」）。
      #
      # ⚠️ 判据只能用 **5.1 的解析器** ⇒ Linux runner 上判不了
      # ⇒ ⇒ 单独一个 windows job，而不是挂在 ubuntu 的 desktop-build 里。
      - name: Gate self-test
        run: node scripts/check-ps1-portability.mjs --self-test

      - name: PS1 portability check
        run: node scripts/check-ps1-portability.mjs

  # ── YAML 合法性闸 ──────────────────────────────────────────────────
  # ⚠️ 2026-11-05：兄弟仓 telencephalon 的 workflow 曾因为 step 名里带冒号
  # （「Cargo check (router-only: …)」却**没加引号**）⇒ ⇒ YAML 解析直接报错
  # ⇒ ⇒ **整个 workflow 起不来**（GitHub 连 job 都进不去）⇒ ⇒ 而 CI 因账号
  # 额度本来就红 ⇒ ⇒ 没人看见 ⇒ ⇒ 病根不是「那行写错了」，是「CI 的 YAML
  # 从来没有被任何东西解析过」⇒ ⇒ 于是它被收成一道闸。
  yaml-validity:
    name: YAML validity (workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout shadow
        uses: actions/checkout@v7

      # ⚠️ 真解析器（PyYAML）只用于**差分交叉验证**（扫描器与它结论不一致
      #    ⇒ ⇒ 红）⇒ ⇒ 装不上也不影响闸本身跑（扫描器是零依赖的）
      #    ⇒ ⇒ 装了就多一路证据 ⇒ ⇒ 所以这一步允许失败。
      - name: Install YAML parser for cross-check
        continue-on-error: true
        run: |
          python3 -m pip install --quiet --disable-pip-version-check --user pyyaml             || pip3 install --quiet --disable-pip-version-check --user pyyaml             || echo 'no PyYAML ⇒ 只跑扫描器（不做差分交叉验证）'

      - name: Gate self-test
        run: node scripts/check-yaml-valid.mjs --self-test

      - name: Workflow YAML check
        run: node scripts/check-yaml-valid.mjs

  # ── 跨仓 Cortex 残留闸 ─────────────────────────────────────────────
  # ⚠️ iBLOC 这套栈是**十几个独立 git 仓** ⇒ 闸只住在 shadow 仓的话，
  #    **另外那些仓没人盯**（2026-11 实测：prefrontal 的 tool 描述里还写着
  #    「Execute a registered workflow in Cortex」—— **LLM 读得到的那一行**）。
  # ⇒ 这个 job checkout 所有受管仓 ⇒ 跑 `scripts/check-cortex-residue-all.mjs`。
  #
  # ⚠️ 判据（算法）只有一份（scripts/lib/cortex-residue.mjs）⇒ 各仓只提供
  #    **数据**（扫哪些目录 + 哪些 token 是真契约）⇒ 不会「一份实现两处写」。
  # ⚠️ 仓清单是**自动发现**的（扫工作区根下带 .git 的目录）⇒ 新仓自动纳入。
  # ⚠️ 未登记的仓 ⇒ **阻断**（「有闸但漏了仓」比「没有闸」更危险）。
  cortex-residue-stack:
    name: Cortex residue (cross-repo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 所有兄弟仓都是**私有**仓 ⇒ 默认 GITHUB_TOKEN 拿不到 ⇒ 必须用 PAT。
      IBLOC_TOKEN: ${{ secrets.IBLOC_TOKEN }}
    steps:
      - name: Require cross-repo token
        run: |
          if [ -z "$IBLOC_TOKEN" ]; then
            echo "::error::secrets.IBLOC_TOKEN is not configured."
            echo "::error::The cross-repo Cortex gate checks out every sibling"
            echo "::error::repo (they are private). Add a PAT with read access"
            echo "::error::to those repos as the IBLOC_TOKEN repository secret."
            exit 1
          fi

      # ⚠️ 各兄弟仓 checkout 到**子目录**（不是 ../<repo>）⇒
      #    因为 actions/checkout 拒绝 GITHUB_WORKSPACE 之外的路径。
      #    ⇒ 工作区根下就会有多份 .git ⇒ 闸的自动发现正好认它们。
      - name: Checkout shadow
        uses: actions/checkout@v7

      # ⚠️ 这份清单**必须与 scripts/lib/cortex-registry.mjs 算出来的 CI_CHECKOUT 一致**
      #    ⇒ 由 `node scripts/check-cortex-residue-all.mjs` 的「CI 清单对账」自动核对
      #    ⇒ YAML 少检一个仓 ⇒ **闸自己报红**（而不是 CI 悄悄少扫一半 ⇒ 假绿）。
      #
      # ⚠️ 为什么不能用「照注册表机械补全」：三个仓**根本检不出来**（2026-11-04 用
      #    **已认证**的 gh api repos/iBLOC/<name> 逐个查过）：
      #      · ibloc-hr-agent      —— 没有 origin（纯本地仓）；
      #      · ibloc-hr-tools      —— origin 指向 gitee.com；
      #      · telencephalon-verify —— origin 指向 iBLOC/telencephalon（它是端脑的 clone）。
      #    ⇒ 无 token 时的 404 **不能当判据**（私有仓也是 404）⇒ 必须认证后查。
      #
      # ⚠️ telencephalon / encephalon **不在这里**：它们各自仓里有自己的 cortex-residue
      #    job（telencephalon/.github/workflows/ci.yml、encephalon/.github/workflows/ci.yml）
      #    ⇒ 不重复检出（encephalon 的闸还要 import 端脑仓里的引擎副本）。
      - name: Checkout agent-memory-benchmark
        uses: actions/checkout@v7
        with:
          repository: iBLOC/agent-memory-benchmark
          path: agent-memory-benchmark
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: Checkout amygdala
        uses: actions/checkout@v7
        with:
          repository: iBLOC/amygdala
          path: amygdala
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: Checkout diencephalon
        uses: actions/checkout@v7
        with:
          repository: iBLOC/diencephalon
          path: diencephalon
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: Checkout hengjian
        uses: actions/checkout@v7
        with:
          repository: iBLOC/hengjian
          path: hengjian
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: Checkout hippocampus
        uses: actions/checkout@v7
        with:
          repository: iBLOC/hippocampus
          path: hippocampus
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: Checkout lance-graph
        uses: actions/checkout@v7
        with:
          repository: iBLOC/lance-graph
          path: lance-graph
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: Checkout neuron
        uses: actions/checkout@v7
        with:
          repository: iBLOC/neuron
          path: neuron
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: Checkout occipital
        uses: actions/checkout@v7
        with:
          repository: iBLOC/occipital
          path: occipital
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: Checkout parietal
        uses: actions/checkout@v7
        with:
          repository: iBLOC/parietal
          path: parietal
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: Checkout prefrontal
        uses: actions/checkout@v7
        with:
          repository: iBLOC/prefrontal
          path: prefrontal
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: Checkout resonance
        uses: actions/checkout@v7
        with:
          repository: iBLOC/resonance
          path: resonance
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: Checkout synapse
        uses: actions/checkout@v7
        with:
          repository: iBLOC/synapse
          path: synapse
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: Checkout temporal
        uses: actions/checkout@v7
        with:
          repository: iBLOC/temporal
          path: temporal
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Cross-repo Cortex residue check
        run: node scripts/check-cortex-residue-all.mjs

      - name: Cross-repo Cortex residue check (self-test)
        run: node scripts/check-cortex-residue-all.mjs --self-test

      # ⚠️ 2026-11-05：workflow 的 YAML 也得有人管 ⇒ ⇒ 这个 job 正好把所有
      #    兄弟仓都检出到工作区子目录 ⇒ ⇒ 顺手把它们的 workflow 也过一遍
      #    ⇒ ⇒ 实测第一天就抓到兄弟仓一条真缺陷（重复键 ⇒ GitHub 拒绝整个
      #    workflow）⇒ ⇒ 而 YAML 解析器对重复键是**静默放过**的 ⇒ ⇒ 所以
      #    光「拿解析器过一遍」不够。
      - name: Cross-repo workflow YAML check
        run: node scripts/check-yaml-valid.mjs --root=.

      - name: Cross-repo workflow YAML check (self-test)
        run: node scripts/check-yaml-valid.mjs --self-test
