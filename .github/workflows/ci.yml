name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  prefrontal-rust:
    name: Prefrontal Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout shadow
        uses: actions/checkout@v4

      - name: Checkout prefrontal
        uses: actions/checkout@v4
        with:
          path: ../prefrontal
          sparse-checkout: |
            Cargo.toml
            src
            tests
            benches

      - name: Setup Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ../prefrontal

      - name: Cargo check
        working-directory: ../prefrontal
        run: cargo check --manifest-path Cargo.toml

      - name: Cargo test
        working-directory: ../prefrontal
        run: cargo test --manifest-path Cargo.toml

      - name: Cargo clippy
        working-directory: ../prefrontal
        run: cargo clippy --manifest-path Cargo.toml -- -D warnings

  desktop-test:
    name: Desktop Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: shadow-desktop/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: shadow-desktop
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: shadow-desktop
        run: pnpm exec vitest run

  desktop-e2e:
    name: Desktop E2E (Playwright + Telencephalon)
    # Promotes the soft-skip Playwright specs (e2e-conversation-flow,
    # e2e-task-scheduling, business-flow-ui) to a real CI run against a
    # telencephalon binary built alongside this job.
    #
    # NOTE (P0-D, 2026-09-27): Real-green depends on the telencephalon
    # neuron_handle.shutdown hang bug being fixed
    # (audit addendum 2026-09-26 L298-310). Until then this job may fail
    # at boot when no in-process neuron is available.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout shadow
        uses: actions/checkout@v4

      - name: Checkout telencephalon
        uses: actions/checkout@v4
        with:
          path: ../telencephalon
          sparse-checkout: |
            Cargo.toml
            src
            tests
            migrations

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: shadow-desktop/pnpm-lock.yaml

      - name: Setup Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ../telencephalon

      - name: Build telencephalon
        working-directory: ../telencephalon
        run: cargo build --manifest-path Cargo.toml

      - name: Install dependencies
        working-directory: shadow-desktop
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: shadow-desktop
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E against telencephalon
        working-directory: shadow-desktop
        env:
          SHADOW_CORTEX_BIN: ${{ github.workspace }}/../telencephalon/target/debug/telencephalon
          SHADOW_CORTEX_CWD: ${{ github.workspace }}/../telencephalon
          SHADOW_FULL_STACK: '1'
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
            pnpm exec playwright test --reporter=github \
              e2e-conversation-flow e2e-task-scheduling business-flow-ui \
              telencephalon-endpoints

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: shadow-desktop/playwright-report
          retention-days: 7

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: shadow-desktop/test-results
          retention-days: 7

  desktop-build:
    name: Desktop Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: shadow-desktop/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: shadow-desktop
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        working-directory: shadow-desktop
        run: pnpm exec tsc --noEmit

      - name: Build Tauri
        working-directory: shadow-desktop
        run: pnpm build

      - name: Build web
        working-directory: shadow-desktop
        run: pnpm build:web

  mobile-analyze:
    name: Mobile Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.11'
          channel: stable

      - name: Cache Flutter pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('shadow-mobile/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-flutter-pub-

      - name: Flutter pub get
        working-directory: shadow-mobile
        run: flutter pub get

      - name: Flutter analyze
        working-directory: shadow-mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings