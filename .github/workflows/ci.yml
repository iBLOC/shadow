name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  prefrontal-rust:
    name: Prefrontal Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout shadow
        uses: actions/checkout@v7

      - name: Require cross-repo token
        env:
          IBLOC_TOKEN: ${{ secrets.IBLOC_TOKEN }}
        run: |
          if [ -z "$IBLOC_TOKEN" ]; then
            echo "::error::secrets.IBLOC_TOKEN is not configured."
            echo "::error::The iBLOC stack is a local-path workspace. prefrontal,"
            echo "::error::hippocampus and neuron are private siblings and cannot be"
            echo "::error::checked out with the default GITHUB_TOKEN, which is scoped"
            echo "::error::to iBLOC/shadow only. Add a PAT with read access to those"
            echo "::error::repos as the IBLOC_TOKEN repository secret."
            exit 1
          fi

      # The iBLOC stack is a multi-repo local-path workspace: every crate
      # resolves siblings via `path = "../<repo>"`. `actions/checkout`
      # refuses any path outside GITHUB_WORKSPACE, so siblings MUST be
      # checked out into workspace sub-directories (not `../<repo>`).
      #
      # Closure for prefrontal (transitive `path` deps, comments stripped):
      #   synapse            -> (leaf)
      #   neuron             -> (leaf)
      #   hippocampus/hippocampus-core -> neuron, synapse
      #   prefrontal         -> synapse, hippocampus/hippocampus-core
      - name: Checkout prefrontal
        uses: actions/checkout@v7
        with:
          repository: iBLOC/prefrontal
          path: prefrontal
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: Checkout synapse
        uses: actions/checkout@v7
        with:
          repository: iBLOC/synapse
          path: synapse
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: Checkout hippocampus
        uses: actions/checkout@v7
        with:
          repository: iBLOC/hippocampus
          path: hippocampus
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: Checkout neuron
        uses: actions/checkout@v7
        with:
          repository: iBLOC/neuron
          path: neuron
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: Setup Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: prefrontal,synapse,hippocampus,neuron

      - name: Cargo check
        working-directory: prefrontal
        run: cargo check --manifest-path Cargo.toml

      - name: Cargo test
        working-directory: prefrontal
        run: cargo test --manifest-path Cargo.toml

      - name: Cargo clippy
        working-directory: prefrontal
        run: cargo clippy --manifest-path Cargo.toml -- -D warnings

  desktop-test:
    name: Desktop Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.31.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: shadow-desktop/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: shadow-desktop
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: shadow-desktop
        run: pnpm exec vitest run

  desktop-e2e:
    name: Desktop E2E (Playwright + Telencephalon)
    # Promotes the soft-skip Playwright specs (e2e-conversation-flow,
    # e2e-task-scheduling, business-flow-ui) to a real CI run against a
    # telencephalon binary built alongside this job.
    #
    # NOTE (P0-D, 2026-09-27): Real-green depends on the telencephalon
    # neuron_handle.shutdown hang bug being fixed
    # (audit addendum 2026-09-26 L298-310). Until then this job may fail
    # at boot when no in-process neuron is available.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout shadow
        uses: actions/checkout@v7

      - name: Require cross-repo token
        env:
          IBLOC_TOKEN: ${{ secrets.IBLOC_TOKEN }}
        run: |
          if [ -z "$IBLOC_TOKEN" ]; then
            echo "::error::secrets.IBLOC_TOKEN is not configured."
            echo "::error::The iBLOC stack is a local-path workspace. telencephalon,"
            echo "::error::prefrontal, hippocampus, diencephalon, temporal and"
            echo "::error::occipital are private siblings and cannot be checked out"
            echo "::error::with the default GITHUB_TOKEN, which is scoped to"
            echo "::error::iBLOC/shadow only. Add a PAT with read access to those"
            echo "::error::repos as the IBLOC_TOKEN repository secret."
            exit 1
          fi

      # telencephalon's transitive `path` dep closure (comments stripped):
      #   synapse                              -> (leaf)
      #   neuron                               -> (leaf)
      #   hippocampus/{core,storage,server}    -> neuron, synapse
      #   diencephalon                         -> synapse
      #   temporal                             -> synapse, hippocampus-core
      #   occipital                            -> synapse, hippocampus-core
      #   prefrontal                          -> synapse, hippocampus-core
      #   telencephalon                        -> all of the above
      - name: Checkout telencephalon
        uses: actions/checkout@v7
        with:
          repository: iBLOC/telencephalon
          path: telencephalon
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: Checkout synapse
        uses: actions/checkout@v7
        with:
          repository: iBLOC/synapse
          path: synapse
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: Checkout prefrontal
        uses: actions/checkout@v7
        with:
          repository: iBLOC/prefrontal
          path: prefrontal
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: Checkout hippocampus
        uses: actions/checkout@v7
        with:
          repository: iBLOC/hippocampus
          path: hippocampus
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: Checkout neuron
        uses: actions/checkout@v7
        with:
          repository: iBLOC/neuron
          path: neuron
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: Checkout diencephalon
        uses: actions/checkout@v7
        with:
          repository: iBLOC/diencephalon
          path: diencephalon
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: Checkout temporal
        uses: actions/checkout@v7
        with:
          repository: iBLOC/temporal
          path: temporal
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: Checkout occipital
        uses: actions/checkout@v7
        with:
          repository: iBLOC/occipital
          path: occipital
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.31.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: shadow-desktop/pnpm-lock.yaml

      - name: Setup Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: telencephalon,synapse,prefrontal,hippocampus,neuron,diencephalon,temporal,occipital

      - name: Build telencephalon
        working-directory: telencephalon
        run: cargo build --manifest-path Cargo.toml

      - name: Install dependencies
        working-directory: shadow-desktop
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: shadow-desktop
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E against telencephalon
        working-directory: shadow-desktop
        env:
          SHADOW_CORTEX_BIN: ${{ github.workspace }}/telencephalon/target/debug/telencephalon
          SHADOW_CORTEX_CWD: ${{ github.workspace }}/telencephalon
          SHADOW_FULL_STACK: '1'
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
            pnpm exec playwright test --reporter=github \
              e2e-conversation-flow e2e-task-scheduling business-flow-ui \
              telencephalon-endpoints

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: shadow-desktop/playwright-report
          retention-days: 7

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: shadow-desktop/test-results
          retention-days: 7

  desktop-build:
    name: Desktop Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.31.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: shadow-desktop/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: shadow-desktop
        run: pnpm install --frozen-lockfile

      # 桌面端与移动端是同一个 agent 的两个终端。design-tokens.json 与
      # agent-surface.json 是两端共享的唯一真相源；这一步守住它们不被
      # 两端各自改漂（清单里的路由不存在 / 两端偷偷多出或少了路由 /
      # 移动端颜色与 token 对不上）。
      - name: Cross-client consistency check
        run: node scripts/check-agent-surface.mjs

      - name: TypeScript check
        working-directory: shadow-desktop
        run: pnpm exec tsc --noEmit

      - name: Build Tauri
        working-directory: shadow-desktop
        run: pnpm build

      - name: Build web
        working-directory: shadow-desktop
        run: pnpm build:web

  mobile-analyze:
    name: Mobile Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      # Flutter 3.41.4 ships Dart SDK 3.11.1, which is exactly the
      # `environment: sdk: ^3.11.1` constraint in shadow-mobile/pubspec.yaml.
      # Older `flutter-version: 3.11` shipped Dart 3.0.x and is both
      # unresolvable on the stable channel and incompatible with pubspec.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable

      - name: Cache Flutter pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('shadow-mobile/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-flutter-pub-

      - name: Flutter pub get
        working-directory: shadow-mobile
        run: flutter pub get

      - name: Flutter analyze
        working-directory: shadow-mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  mobile-test:
    name: Mobile Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # sqflite_common_ffi reaches SQLite through dart:ffi and looks for a
      # plain "libsqlite3.so". ubuntu-latest ships libsqlite3.so.0 but not
      # always the -dev symlink, so install it explicitly.
      - name: Install SQLite runtime
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable

      - name: Cache Flutter pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('shadow-mobile/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-flutter-pub-

      - name: Flutter pub get
        working-directory: shadow-mobile
        run: flutter pub get

      # The suite was never wired into CI before, so it had rotted: 28 of
      # 201 cases failed (stale copy assertions, missing localization
      # delegates, two infinite-animation pumpAndSettle timeouts). Keep this
      # job so the same drift cannot come back unnoticed.
      - name: Flutter test
        working-directory: shadow-mobile
        run: flutter test
