name: E2E Typecheck

# ⚠️ **为什么单独成文件**（2026-11-09 新增）：
#   · **根 tsconfig 的 include 只有 ["src"]** ⇒ ⇒ shadow-desktop/tests/e2e-ui/**
#     与 shadow-desktop/tests/lib/** ⇒ ⇒ **至今没有任何类型/语法闸**；
#   ⇒ ⇒ 而这一族只有 Playwright（**夜间/手动**）或 vitest（**重**）才真跑
#   ⇒ ⇒ ⇒ 一个 spec 里的语法错/类型错 ⇒ ⇒ 要等到那一格才暴露
#   ⇒ ⇒ ⇒ 「判据自己坏了」会被当成「产品回归」⇒ ⇒ 反馈太晚。
#   ⇒ ⇒ （实证：我在这一族里写了个**嵌套反引号**的语法错 ⇒ ⇒ 根 tsc **一声不吭**
#     ⇒ ⇒ 是 Playwright 当场抓到的 ⇒ ⇒ 「类型闸绿」≠「我改的文件被看过」。）
#   · 为什么不在 ci.yml 里加一步 ⇒ ⇒ **ci.yml 是共享文件**（并行会话在飞）
#     ⇒ ⇒ 共享文件上的接线是本仓最容易出两类事故的地方
#     ⇒ ⇒ （把别人的在飞件卷进我的提交／我的暂存被别人一次 plain commit 抢走署名）
#     ⇒ ⇒ ⇒ 独立成文件 ⇒ ⇒ 接线面**零共享** ⇒ ⇒ 竞态根本不存在。
# ⚠️⚠️ **2026-11-09 同日扩面**（覆盖面从 e2e-ui 扩到 **.ts 全族**）：
#   · 扩面前先量过：把 tests/** 全族拉进闸 ⇒ ⇒ **32 处既有类型错**当场暴露
#     （14 个文件）⇒ ⇒ 它们**从来没有被任何闸看过** ⇒ ⇒ 现在全修掉了。
#   · 那 32 处里有**真债**，不是空转：
#     – AgentCategory 只有 'built-in' | 'external' ⇒ ⇒ 而测试在用 'custom'
#       ⇒ ⇒ 产品**从不产生**那种分类 ⇒ ⇒ 断言落空（假覆盖）；
#     – AgentTask 没有 message 字段 ⇒ ⇒ 而测试断言 tasks[0].message
#       ⇒ ⇒ 断言一个**产品不产生的键**；
#     – getA2ATask 的服务端回包是 {id,status:{…}} ⇒ ⇒ 而测试 mock 的是
#       {task_id,state,result} ⇒ ⇒ **服务端从不返回的形状**；
#     – cancelA2ATask 服务端回 **null** ⇒ ⇒ 而测试断言 result.success；
#     – Storage.length 是只读 ⇒ ⇒ 替身里直接赋值 ⇒ ⇒ TS2540。
#   ⇒ ⇒ **结论**：判据「绿」不等于「测的东西是真的」⇒ ⇒ 类型闸能把
#     「测试与产品形状脱节」这类**假覆盖**照出来 ⇒ ⇒ 这是它最值钱的地方。
#   · ⚠️ **未覆盖项必须与「已判无问题」分开报**（见下面 notice）：
#     **.tsx 组件测试家族（57 处既有类型错，欠项）** ＋ wdio/tauri-e2e
#     ＋ stores/appearanceMemory.test.ts（并行会话在飞）。

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-typecheck:
    name: E2E Typecheck (桌面端 tests/ 家族 · .ts 全族)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout shadow
        uses: actions/checkout@v7
        with:
          path: shadow

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.31.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: shadow/shadow-desktop/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: shadow/shadow-desktop
        run: pnpm install --frozen-lockfile

      # ⚠️ **判据本身也要有读数** —— 不是「跑一下就算」⇒ ⇒ 把**覆盖面**打印出来
      #    ⇒ ⇒ 哪天 include 被改窄了 ⇒ ⇒ 这一行会变 ⇒ ⇒ 看得见。
      - name: E2E type check (tests/tsconfig.json)
        working-directory: shadow/shadow-desktop
        run: |
          set +e
          set -uo pipefail
          OUT="$RUNNER_TEMP/e2e-typecheck.txt"
          pnpm exec tsc --noEmit -p tests/tsconfig.json > "$OUT" 2>&1
          TSTATUS=$?
          # ⚠️ **先打印输出、再判退出码** ⇒ ⇒ 红的时候原因就在眼前。
          cat "$OUT"
          if [ "$TSTATUS" != "0" ]; then
            echo "::error::E2E 家族的类型闸红了（退出码 $TSTATUS）—— 上面就是逐条读数"
            exit "$TSTATUS"
          fi
          echo "::notice::E2E 类型闸：绿（覆盖面＝tests/**.ts 全族 ＋ playwright.config.ts）"
          echo "::notice::E2E 类型闸**未覆盖**（是欠项，**不是**「已判无问题」）："
          echo "::notice::  · .tsx 组件测试家族（2026-11-09 实测 57 处既有类型错）"
          echo "::notice::  · tests/wdio/** ＋ tests/tauri-e2e/**（需要 @wdio/globals 运行时）"
          echo "::notice::  · tests/stores/appearanceMemory.test.ts（并行会话在飞：Appearance 新增 chatBackground 未提交）"
