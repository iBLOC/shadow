name: Replacement Characters (替换字符扫描：坏字符不许进仓)

# ⚠️ **它守的是什么** —— U+FFFD（替换字符）是「UTF-8 解码失败时被替换上去的占位符」
#   ⇒ ⇒ 它出现 ⇒ ⇒ **原字符已经丢了**（不可还原）⇒ ⇒ 而它落在注释 / 文案 / 契约里
#   ⇒ ⇒ 人读得到、机器读不懂 ⇒ ⇒ 典型形状：「失败长得像成功」。
#   ⚠️ 本次实测：提交树面 **12 处 / 共 29 个**；工作树面 **13 处 / 共 32 个**。
#
# ⚠️ **为什么单独成文件**（与 gate-drills.yml 同理）：
#   `ci.yml` 是**共享文件**（并行会话在飞）⇒ ⇒ 独立成文件 ⇒ ⇒ 接线面**零共享**。
#
# ⚠️ **判据读的是「提交树面」** ⇒ ⇒ 与 CI clone 到的那一面一致 ⇒ ⇒ 不受工作树分叉影响；
#   工作树面的差异由**报告腿**点名（**不判红** —— 那是别人的在飞面，不是我能判的）。

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  replacement-chars:
    name: Replacement Characters
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # ⚠️ 判读落盘路径（**仓外**）—— 分母要覆盖**这一盏灯里所有**真跑的闸 ⇒ ⇒ 每道闸的结论都得落到同一份记录里。
      # ⚠️ 落在仓根会污染被测面 ⇒ ⇒ 用 RUNNER_TEMP。
      - name: 准备判读落盘路径（仓外）
        run: echo "GATE_RESULT_FILE=$RUNNER_TEMP/gate-results.ndjson" >> "$GITHUB_ENV"

      - name: Checkout shadow
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: "Self-test: replacement chars (判据自检)"
        if: always()
        run: node scripts/check-replacement-chars.mjs --self-test

      # ⚠️ **必须走判读通道**（run-gate-once）—— 否则这一盏灯的闸步「没登记」⇒ ⇒
      #   「Gate Tally Coverage」那盏灯会当场判红（unregistered-gap：gate-step-not-tallied）。
      #   ⇒ ⇒ 本刀第一版漏了这一步 ⇒ ⇒ 那盏灯真的红了（run 42885271250 ／ 42885389454）⇒ ⇒ ⇒ 修法照抄已通过那盏灯的形状。
      - name: "Check: replacement chars (提交树面)"
        if: always()
        run: node scripts/run-gate-once.mjs --strict scripts/check-replacement-chars.mjs

      # ⚠️ 收尾：把这一盏灯「绿得有多真」写出来 —— **job 必须有分母**，否则同一个 unregistered-gap 的另一半
      #   （job-without-denominator）也会红 ⇒ ⇒ 两格缺口，一格都不能留。
      - name: 判读汇总（带分母的绿灯）
        if: always()
        run: node scripts/lib/gate-tally.mjs --report