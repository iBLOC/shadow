name: Desktop Rust

# ⚠️⚠️ **这个 workflow 单独成文件，是因为它编整栈** —— 桌面 crate（`shadow-desktop/src-tauri`）
#   的依赖面是 **tauri + wasmtime + lance + datafusion + 整条 iBLOC 栈**（encephalon →
#   telencephalon → neuron → synapse → hippocampus）⇒ ⇒ 冷编是**几十分钟**量级
#   ⇒ ⇒ 而 CI 主 workflow 的 concurrency 是 `cancel-in-progress: true` ⇒ ⇒ 放进 push
#   流水线 ⇒ ⇒ **每次 push 都会把它砍掉** ⇒ ⇒ 「跑了但没跑完」＝「没有防线」
#   ⇒ ⇒ 修法与 desktop-e2e.yml 同一条纪律：**长任务不进 push 流水线** ⇒ 它有自己的
#   workflow、自己的并发组（`cancel-in-progress: false`）⇒ ⇒ 没人能取消它。
#
# ⚠️ **为什么触发只有手动与夜间定时**（与 desktop-e2e.yml 同理由）：一次 ~几十分钟 ⇒ ⇒
#   在「每 2–4 分钟一次 push」的协作节奏下，push 触发 ⇒ ⇒ 排队的那一个永远被下一次
#   push 顶掉 ⇒ ⇒ 手动触发也会被推挤掉 ⇒ ⇒ 只留 workflow_dispatch 与 schedule。
#   ⚡️ 本 workflow 的**第一次真跑**会给出**冷编时长读数** ⇒ ⇒ 那个读数决定「它能不能进
#   push 流水线」（见仓内 ㏀ 条⑥❶ 的登记：桌面 Rust crate 无 CI 防线）。

on:
  # ⚠️⚠️ 2026-11-08 **加了 push 触发** —— 以前「只留手动与夜间定时」的理由是
  # 「一次 ~几十分钟 ⇒ ⇒ 在每 2–4 分钟一次 push 的节奏下，push 触发 ⇒ ⇒ 排队的那一个
  # 永远被下一次 push 顶掉 ⇒ ⇒ 手动触发也会被推挤掉」⇒ ⇒ 而那条理由**只在「push 触发
  # 排队并互相等」时成立** ⇒ ⇒ 现在两处前提都改了：
  #   ① **冷编从 13 分 53 秒压到分钟级**（rust-cache 现在把桌面 crate 自己的 target
  #      也纳入 ⇒ ⇒ 详见下面 Setup Rust 那一步的注释 ⇒ ⇒ 这一跑不再是「几十分钟」）；
  #   ② **push 触发的那几跑互相顶掉**（并发组按事件名分开 ＋ push 那一档
  #      cancel-in-progress: true）⇒ ⇒ 不排队 ⇒ ⇒ 队列那条反对理由不成立。
  # ⇒ ⇒ **只推桌面 crate 相关的改动才触发**（paths 过滤）⇒ ⇒ 前端/文档改动不触发。
  push:
    branches: [master]
    paths:
      - 'shadow-desktop/src-tauri/**'
      - '.github/workflows/desktop-rust.yml'
      - '.github/actions/ibloc-siblings/**'
  workflow_dispatch:
  schedule:
    # UTC 21:23 ＝ 北京 05:23 ⇒ ⇒ 与 desktop-e2e 的 19:37 UTC **错峰** ⇒ ⇒ 两个重型
    # job 不会同时抢 runner。
    - cron: '23 21 * * *'

concurrency:
  # ⚠️ **两组**：push 触发的那一档**互相顶掉**（只留最新一次 ⇒ ⇒ 不排队 ⇒ ⇒ 队列不会
  #   越积越长）；夜间/手动那一档**永不取消**（false 是这个 workflow 存在的全部理由
  #   ⇒ ⇒ 改回 true ⇒ ⇒ 「它从来没跑完过」回来）。
  group: ${{ github.event_name == 'push' && 'desktop-rust-push' || 'desktop-rust' }}
  # ⚠️ **false 是这个 workflow 存在的全部理由** ⇒ ⇒ 改回 true ⇒ ⇒ 「它从来没跑完过」回来。
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop-rust:
    name: Desktop Rust (桌面 crate 的 Rust 防线)
    runs-on: ubuntu-latest
    # ⚠️ 冷编整栈 ⇒ ⇒ 给足时间；但不许无限跑（磁盘/内存打满时 runner 会被掐掉，
    #   日志都传不回来 —— 比超时更难查）。
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      # ⚠️⚠️ **尺子必须与另两个 workflow 同一把**（1.99.0）—— desktop-e2e.yml 与
      #   ci.yml 的 prefrontal-rust job 都钉死它 ⇒ ⇒ 三个 job 编同一套 path 依赖 ⇒ ⇒
      #   用不同版本编会出现「这里编过、那里编不过」的尺子漂移。
      # ⚠️⚠️ **变量名必须是 `RUSTUP_TOOLCHAIN`**（带 `UP`）—— 写成 `RUST_TOOLCHAIN` ⇒ ⇒
      #   rustup **完全无视它** ⇒ ⇒ 装了 1.99.0、却用 stable 跑 ⇒ ⇒ 假钉（真机实测过）。
      RUSTUP_TOOLCHAIN: '1.99.0'
    steps:
      # ⚠️⚠️ **checkout 的落点决定了 path 依赖能不能解析** —— 桌面 crate 的依赖是
      #   `path = "../../../encephalon"` ⇒ ⇒ 三级 ⇒ ⇒ **必须**是
      #   `$GITHUB_WORKSPACE/shadow/shadow-desktop/src-tauri` ⇒ ⇒ 三级上来正好是
      #   `$GITHUB_WORKSPACE` ⇒ ⇒ 而兄弟仓由 composite action 检在 `$GITHUB_WORKSPACE/<repo>`
      #   ⇒ ⇒ **布局对上** ⇒ ⇒ path 依赖解析得到。
      #   ⚠️ 这正是 ci.yml 里那一步注释写的「Tauri Rust side is NOT built here」的成因：
      #   那个 job 把 shadow 检在**工作区根** ⇒ ⇒ `../../../` 指到工作区的**外面** ⇒ ⇒
      #   manifest 读不到（state-surface 闸实测：`cargo tree` 退出码 101）⇒ ⇒ 桌面 crate
      #   在 CI 上**从来没有被解析过、更没有被编过**。
      - name: Checkout shadow
        uses: actions/checkout@v7
        with:
          path: shadow

      # ⚠️ 检出清单**只有这一份**（在 composite action 里）⇒ ⇒ 与 ci.yml / desktop-e2e.yml
      #   不会漂移（2026-11-05 实测踩过：「搬完家要逐个 job 核对检出清单」）。
      - name: Checkout the iBLOC stack
        id: stack
        uses: ./shadow/.github/actions/ibloc-siblings
        with:
          token: ${{ secrets.IBLOC_TOKEN }}

      # ⚠️⚠️ **检出清单逐个核对** —— cargo 连 **optional 的 path 依赖也要读它的 manifest**
      #   ⇒ ⇒ 少检一个兄弟仓 ⇒ ⇒ cargo 直接报「failed to load manifest」⇒ ⇒ 整道闸判不了
      #   （2026-11-05 真机实测：只放 synapse、不放 ziti-rust ⇒ `cargo metadata` EXIT=101）。
      - name: Verify the sibling checkout list
        run: |
          set -eu
          for d in telencephalon encephalon synapse prefrontal hippocampus neuron diencephalon temporal occipital ziti-rust; do
            if [ ! -d "$GITHUB_WORKSPACE/$d" ]; then
              echo "::error::missing sibling checkout: $d"
              exit 1
            fi
          done
          echo "✅ 10 个兄弟仓在位"

      # ⚠️ 系统依赖：**tauri 的 wry 要 webkit2gtk-4.1**（不是 4.0 —— 4.0 在 24.04 上已无）
      #   ＋ git2/native-tls 要 openssl 头 ＋ tray-icon 要 appindicator ＋ lance-encoding
      #   的 build script 要 protoc。
      #   ⚠️⚠️ 2026-11-08 **第一次真跑补上的那一条**：`libpipewire-0.3-dev` —— 首跑编译炸在
      #   「The system library `libpipewire-0.3` required by crate `libspa-sys` was not
      #   found」⇒ ⇒ 依赖链＝**xcap（屏幕捕获）→ pipewire → libspa** ⇒ ⇒ apt 默认装的是
      #   pipewire 的**运行时**（`libpipewire-0.3-0t64`）⇒ ⇒ **没有 `.pc` 文件** ⇒ ⇒ 必须装
      #   **dev 包**（`libpipewire-0.3-dev`）⇒ ⇒ 这条**只有真编一次才会知道**。
      #   ⚠️⚠️ 第二跑补上的：**libgbm-dev ＋ libegl1-mesa-dev** —— 整栈编完（冷编约 13 分钟）后
      #   死在**链接**：「rust-lld: error: unable to find library -lgbm」⇒ ⇒ wry 的 GL 后端要
      #   Mesa 的 GBM/EGL ⇒ ⇒ 运行时库 runner 上有，**链接期要的 dev/so 符号没有**。
      - name: Install system dependencies
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential curl wget file pkg-config libssl-dev libxdo-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            protobuf-compiler \
            libpipewire-0.3-dev \
            libgbm-dev libegl1-mesa-dev

      # ⚠️ runner 磁盘：预装工具合计 ~10GB，而本 job 要编整栈 + tauri ⇒ ⇒ 磁盘写满时
      #   runner 会被直接掐掉（「No space left on device」⇒ ⇒ 日志都传不回来）。
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeSC || true
          sudo rm -rf /usr/share/swift /usr/local/share/powershell || true
          sudo rm -f /swapfile || true
          df -h /home/runner

      - name: Setup Rust
        uses: Swatinem/rust-cache@v2
        with:
          # ⚠️⚠️ **必须把桌面 crate 自己的 workspace 也列进来**（2026-11-08 实测）——
          #   缓存**只列兄弟仓** ⇒ ⇒ 命中的是「兄弟仓各自的 target」⇒ ⇒ 而桌面 crate 是
          #   **独立 workspace** ⇒ ⇒ 它的 path 依赖（tauri/wasmtime/lance/datafusion…）
          #   **全被编进桌面 crate 自己的 target**（shadow/shadow-desktop/src-tauri/target）
          #   ⇒ ⇒ **那几百个 crate 每次都从零编** ⇒ ⇒ 冷编 13 分 53 秒（run 42451957343
          #   实测：缓存显示「Cache restored successfully · 621 MB · full match」，
          #   **而测试步仍然 13 分 53 秒** ⇒ ⇒ 命中的那份缓存对这个编译**一点用没有**）。
          #   ⇒ ⇒ 把桌面 crate 的 workspace 加进来 ⇒ ⇒ 那份重编译才能被缓存命中。
          workspaces: |
            ${{ steps.stack.outputs.workspaces }}
            shadow/shadow-desktop/src-tauri
          # ⚠️ shared-key：让**同一套 target** 在不同 workflow 的 job 之间共用缓存
          #   （默认键含 job id ⇒ ⇒ 换 workflow 就换键 ⇒ ⇒ 缓存白存）。
          shared-key: desktop-rust-stack

      # ⚠️⚠️ **被钉住的版本必须显式装** —— `RUSTUP_TOOLCHAIN` 只是**指定**版本 ⇒ ⇒ runner
      #   预装的 stable 里未必有那个精确版本 ⇒ ⇒ 不装就报 "toolchain '1.99.0' is not
      #   installed"。⇒ ⇒ 同样把版本**打出来**（尺子漂了必须看得见）＋ **断言它真的生效**
      #   （装了不等于用了）。
      - name: Install pinned Rust toolchain
        run: |
          set -eu
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy
          rustup default "$RUSTUP_TOOLCHAIN"
          rustc --version
          cargo --version
          cargo clippy --version
          active="$(rustup show active-toolchain)"
          echo "active toolchain: $active"
          case "$active" in
            "$RUSTUP_TOOLCHAIN"*) echo "✅ pinned toolchain is active" ;;
            *) echo "::error::pinned toolchain is NOT active (active=$active, pinned=$RUSTUP_TOOLCHAIN)"; exit 1 ;;
          esac

      # ⚠️⚠️ **「能不能解析依赖图」与「能不能编过」是两步** —— 这一步只判前者 ⇒ ⇒ 它便宜 ⇒ ⇒
      #   放在最前面当**快速信号**：path 依赖读不到 ⇒ ⇒ 这里当场红 ⇒ ⇒ 不用等几十分钟的
      #   编译才发现「压根没检全兄弟仓」。
      - name: Cargo metadata (path 依赖可解析)
        working-directory: shadow/shadow-desktop/src-tauri
        run: |
          set -eu
          cargo metadata --format-version 1 --manifest-path Cargo.toml > /tmp/desktop-metadata.json
          node -e "const m=require('/tmp/desktop-metadata.json');const p=m.packages.find(x=>x.name==='shadow-desktop');const paths=p.dependencies.filter(d=>d.path).map(d=>d.name+' -> '+d.path);console.log(paths.join('\n'));if(!paths.length)throw new Error('no path deps resolved');"

      # ⚠️⚠️ **这一道是本 workflow 的正事**：桌面 crate 的 Rust 测试**从来没在 CI 上跑过**
      #   ⇒ ⇒ 包括 2026-11-08 刚收的那处安全修复（task_id 路径穿越 ⇒ `src/task_path.rs`
      #   的两条反向验证用例）⇒ ⇒ 它们只在本机跑过 ⇒ ⇒ 「本机绿」≠「CI 绿」。
      #   ⚠️ 只跑 `--lib`（单元测试）：`tests/embedded_stack.rs` 与 `tests/asr_engine_probe.rs`
      #   要真机/真脑 ⇒ ⇒ 那是**真机级**欠项，不属于这一档。
      #   ⚠️⚠️ 2026-11-08 **第三跑实测补上的**：**必须挂 xvfb** —— 首跑 131 条里 **129 绿 2 红**，
      #   两条红都是 `computer_use` 的用例（它们构造 **enigo** 夹具）⇒ ⇒ runner 上**没有显示器**
      #   ⇒ ⇒ `x11rb` 连不上 X server ⇒ ⇒ 「failed to construct enigo for test fixture」⇒ ⇒
      #   ⇒ 这是**环境缺口不是代码缺陷** ⇒ ⇒ 用 `xvfb-run --auto-servernum` 给它一块虚拟屏
      #   （与 desktop-e2e.yml 同一手法）⇒ ⇒ 代码一行不动。
      #   ⚠️⚠️⚠️ 2026-11-08 **但那层垫片不可靠** —— 第八跑（第一次 push 触发的那跑）在
      #   **xvfb 已经挂上**的情况下**仍然红在同一处**（`computer_use::tests::
      #   screenshot_does_not_require_gate`，enigo 依然绑不上）⇒ ⇒ 「给 CI 套一层虚拟 X」
      #   只是**把环境依赖推到另一个层面**，并没有消掉它 ⇒ ⇒ **正确修法＝从源头去掉显示器
      #   依赖**：那两条用例断言的**只是闸逻辑**（enabled 原子量），而 `ComputerUse.enigo`
      #   本来就是 `Option`（结构体注释：headless ⇒ None ⇒ 动作一律 Disabled）⇒ ⇒ 夹具
      #   改成 `enigo: None` ⇒ ⇒ **测试不再需要显示器** ⇒ ⇒ 这层 xvfb 也就没必要了 ⇒ ⇒
      #   撤掉（少一个变量 ＋ 少一个「安静地飘红」的来源）。
      - name: Cargo test (lib)
        working-directory: shadow/shadow-desktop/src-tauri
        run: |
          set -o pipefail
          cargo test --manifest-path Cargo.toml --lib 2>&1 | tee /tmp/desktop-test.log
          echo "--- 测试读数（尺子要可见）---"
          grep -E 'test result:' /tmp/desktop-test.log || true

      # ⚠️⚠️ **口径已收回 `-D warnings`**（2026-11-08 池子清零刀）—— 上面的注释
      #   立过规矩「谁先清零谁先收回口径」：桌面 crate 自身的 clippy warning 池
      #   （原 lib 58／lib test 41 ＋ fmt 25 文件/194 处）已全数清零 ⇒ ⇒ 收紧。
      #   ⚠️ **范围钉在 `-p shadow-desktop`**：workspace 里编着兄弟仓
      #   （telencephalon 81 条等存量不归本闸管 ⇒ 它们只印不挡）；
      #   `-D warnings` 经 `--` 只作用于选中包 ⇒ ⇒ 兄弟仓的存量不会被连坐。
      - name: Cargo clippy (桌面 crate, -D warnings)
        working-directory: shadow/shadow-desktop/src-tauri
        run: |
          set -o pipefail
          cargo clippy --manifest-path Cargo.toml --all-targets -p shadow-desktop -- -D warnings
