name: Secret Plaintext

# ⚠️ **为什么单独成文件**（2026-11-09 真机实测）：
#   · 这道闸是**纯 node、零依赖、秒级**的（实测本地 < 3 秒）⇒ ⇒ 它**不重**；
#   · 但它**跨仓**：它扫的不只是 shadow 自己 ⇒ ⇒ **要检出五个兄弟仓**
#     （telencephalon / encephalon / prefrontal / synapse ＋ shadow 自带的
#      desktop / mobile）⇒ ⇒ 检出这一步**有成本**（私有仓要 PAT）
#     ⇒ ⇒ 不该塞进「重任务」的 ci.yml 主流程里拖慢每一次 CI；
#   · ci.yml 是**共享文件**（并行会话常在飞改）⇒ ⇒ 共享文件上的接线是本仓
#     最容易出「把别人的在飞件卷进我的提交」「我的暂存被别人抢走署名」
#     两类事故的地方 ⇒ ⇒ 独立文件 ⇒ ⇒ **接线面零共享** ⇒ ⇒ 竞态根本不存在。
#   （与 desktop-e2e.yml 那种「重任务另开」不同：那里是为**不被 cancel**；
#     这里是为**不碰共享文件** ＋ **不拖慢主流程**。）

# ⚠️ **它守的是什么** —— 明文密钥落盘：
#   「密钥材料写进文件 / DB / 浏览器存储 / 进程环境」是**静默**的
#   ⇒ ⇒ 不报错、只是「正常地工作」⇒ ⇒ 没有人会发现 ⇒ ⇒ 必须有闸盯着。
#   ⚠️ 2026-11-09 补的那一格：**覆盖不全 ⇒ ⇒ 退出码 2**
#     （CI 只检出部分仓时 ⇒ ⇒ 那些债是「没判」而不是「还了」
#      ⇒ ⇒ **不许**把真债当「已还」销账 ⇒ ⇒ 闸必须喊出来）。

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  secret-plaintext:
    name: Secret Plaintext
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # ⚠️ 判读落盘路径（**仓外**）—— 分母要覆盖**这一盏灯里所有**真跑的闸 ⇒ ⇒ 每道闸的结论都得落到同一份记录里 ⇒ ⇒ 收尾一步汇总成带分母的读数。
      # ⚠️ 落在仓根会污染被测面（顶层对账闸会当场判红）⇒ ⇒ 用 RUNNER_TEMP。
      # ⚠️ 落盘路径**不能**用表达式上下文（job 级 env 里不可用 ⇒ ⇒ 整个 workflow 文件会被拒绝加载 ⇒ ⇒ run 零 job 失败）。
      - name: 准备判读落盘路径（仓外）
        run: echo "GATE_RESULT_FILE=$RUNNER_TEMP/gate-results.ndjson" >> "$GITHUB_ENV"
      - name: Checkout shadow
        uses: actions/checkout@v7

      # ⚠️⚠️ **兄弟仓是私有的**（iBLOC/prefrontal 等）⇒ ⇒ 默认 GITHUB_TOKEN
      #    只对 iBLOC/shadow 有权限 ⇒ ⇒ 检不出来 ⇒ ⇒ 闸会「一个仓都读不到」
      #    ⇒ ⇒ 退出码 2「判不了」⇒ ⇒ 那不是「闸抓到了泄漏」，那是**环境缺**。
      - name: Require cross-repo token
        env:
          IBLOC_TOKEN: ${{ secrets.IBLOC_TOKEN }}
        run: |
          if [ -z "$IBLOC_TOKEN" ]; then
            echo "::error::secrets.IBLOC_TOKEN is not configured."
            echo "::error::The secret-plaintext gate scans the sibling crates"
            echo "::error::(telencephalon / encephalon / prefrontal / synapse), which
            echo "::error::are private repos. Add a PAT with read access as the
            echo "::error::IBLOC_TOKEN repository secret."
            exit 1
          fi

      # ⚠️ **检出形状决定闸能不能找到它们**（2026-11-09 真机实测）：
      #   闸用「shadow 仓根的**兄弟目录**」找兄弟仓（`../<name>`）
      #   ⇒ ⇒ 在 CI 上兄弟仓被 checkout 到 **shadow 仓根之下**（`<name>`）
      #   ⇒ ⇒ **两处都要认**（闸已补双布局解析，见 scripts/check-secret-plaintext.mjs
      #   的 scanRoots）⇒ ⇒ 否则闸在 CI 上会「一个仓都读不到」⇒ ⇒ 恒退出码 2。
      - name: Checkout telencephalon
        uses: actions/checkout@v7
        with:
          repository: iBLOC/telencephalon
          path: telencephalon
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: Checkout encephalon
        uses: actions/checkout@v7
        with:
          repository: iBLOC/encephalon
          path: encephalon
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: Checkout prefrontal
        uses: actions/checkout@v7
        with:
          repository: iBLOC/prefrontal
          path: prefrontal
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: Checkout synapse
        uses: actions/checkout@v7
        with:
          repository: iBLOC/synapse
          path: synapse
          token: ${{ secrets.IBLOC_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # ⚠️ **两步都要跑** —— 判定 ＋ 判据自检（自检证明这道闸**真的会红**）。
      - name: Secret plaintext check
        run: node scripts/run-gate-once.mjs --strict scripts/check-secret-plaintext.mjs

      - name: Secret plaintext check (self-test)
        run: node scripts/check-secret-plaintext.mjs --self-test
      # ⚠️ 收尾：把这一盏灯「绿得有多真」写出来 —— 这一盏灯里**所有**真跑的闸
      #    都落了判读 ⇒ ⇒ 这里汇总成**带分母的读数**（真判 N ｜ 判不了 K ｜ 红 M）
      #    ⇒ ⇒ 「判不了」不当红（它不是「有问题」）⇒ ⇒ 但也不当绿（它不是「没问题」）。
      # ⚠️ if: always() ⇒ ⇒ **闸红的时候分母照样在** ⇒ ⇒ 不然「红」的那一格
      #    恰好是**唯一没有分母**的那一格 ⇒ ⇒ 红灯也读不出「到底跑了哪几道」。
      - name: 判读汇总（带分母的绿灯）
        if: always()
        run: node scripts/lib/gate-tally.mjs --report
