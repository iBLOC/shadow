name: Brain Route Surface

# ⚠️ **它守的是什么** —— 2026-11-11 实测（iBLOC/shadow）：
#   端脑**源码**里明明有「GET/PUT /api/telencephalon/lobes/capability-defaults」
#   （兄弟仓 telencephalon 的 src/api/lobe_manifest.rs）⇒ ⇒ 而手机里那份
#   NDK 内嵌大脑（jniLibs/arm64-v8a/libencephalon.so）**没有**那条路由
#   ⇒ ⇒ 真机上「按能力分档的默认模型」整块 404 ⇒ ⇒ 界面只显示一条原始错误
#   ⇒ ⇒ **失败长得像成功**。
#
# ⚠️ **为什么既有那道闸盖不住** —— scripts/check-jni-surface.mjs 查的是
#   **JNI 函数符号**面 ⇒ ⇒ 符号是稳定的 ⇒ ⇒ 一份旧 .so 的符号可以**全对**、
#   而 HTTP 路由少了一堆 ⇒ ⇒ 符号面与路由面是**两族**。
#
# ⚠️ **为什么单独成文件**（与 e2e-endbrain-wiring.yml 同理）：
#   ci.yml 是**共享文件**（并行会话在飞）⇒ ⇒ 独立成文件 ⇒ ⇒ 接线面**零共享**。

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  brain-route-surface:
    name: Brain Route Surface
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # ⚠️ 判读落盘路径（**仓外**）—— 分母要覆盖**这一盏灯里所有**真跑的闸 ⇒ ⇒ 每道闸的结论都得落到同一份记录里 ⇒ ⇒ 收尾一步汇总成带分母的读数。
      # ⚠️ 落在仓根会污染被测面（顶层对账闸会当场判红）⇒ ⇒ 用 RUNNER_TEMP。
      # ⚠️ 落盘路径**不能**用表达式上下文（job 级 env 里不可用 ⇒ ⇒ 整个 workflow 文件会被拒绝加载 ⇒ ⇒ run 零 job 失败）。
      - name: 准备判读落盘路径（仓外）
        run: echo "GATE_RESULT_FILE=$RUNNER_TEMP/gate-results.ndjson" >> "$GITHUB_ENV"
      - name: Checkout shadow
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # ⚠️ **两步都要跑** —— 判据自检（证明这道闸**真的会红**）＋ 产物级校验。
      - name: 端脑路由面（产物级）
        run: |
          set +e
          node scripts/run-gate-once.mjs --strict scripts/check-brain-route-surface.mjs
          code=$?
          set -e
          # ⚠️ 退出码 2 =「判不了」（CI 上没有 .so，也没有兄弟仓端脑）
          # ⇒ ⇒ **显式说判不了**，不许把 2 当绿（那是构造出来的零）。
          if [ "$code" = "2" ]; then
            echo "::warning::端脑路由面这一格在 CI 上判不了（没有 .so 产物 / 端脑源码）"
            exit 0
          fi
          exit "$code"

      - name: 端脑路由面（自检）
        run: node scripts/check-brain-route-surface.mjs --self-test
      # ⚠️ 收尾：把这一盏灯「绿得有多真」写出来 —— 这一盏灯里**所有**真跑的闸
      #    都落了判读 ⇒ ⇒ 这里汇总成**带分母的读数**（真判 N ｜ 判不了 K ｜ 红 M）
      #    ⇒ ⇒ 「判不了」不当红（它不是「有问题」）⇒ ⇒ 但也不当绿（它不是「没问题」）。
      # ⚠️ if: always() ⇒ ⇒ **闸红的时候分母照样在** ⇒ ⇒ 不然「红」的那一格
      #    恰好是**唯一没有分母**的那一格 ⇒ ⇒ 红灯也读不出「到底跑了哪几道」。
      - name: 判读汇总（带分母的绿灯）
        if: always()
        run: node scripts/lib/gate-tally.mjs --report
