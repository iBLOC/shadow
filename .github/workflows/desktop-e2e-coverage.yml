name: Desktop E2E Coverage

# ⚠️ **为什么单独成文件**（2026-11-11 实测，本仓 iBLOC/shadow）：
#   · 这道闸是**纯 node、零依赖、秒级**（除了 C5 那格要跑一次
#     `playwright --list` ⇒ ⇒ 需要桌面端依赖 ⇒ ⇒ 但 `--list` **不跑浏览器**
#     ⇒ ⇒ 实测 **1.1 秒**）⇒ ⇒ 它**不重**；
#   · 但它盯的是**桌面端 E2E 的「谁真被跑过」** ⇒ ⇒ 而 ci.yml 是**共享文件**
#     （并行会话在飞）⇒ ⇒ 共享文件上的接线是本仓最容易出两类事故的地方：
#     「把别人的在飞件卷进我的提交」；「我的暂存被别人一次 plain commit 抢走署名」。
#     ⇒ ⇒ 所以它**单独成文件** ⇒ ⇒ 接线面**零共享** ⇒ ⇒ 竞态根本不存在。
#   （与 desktop-e2e.yml 那种「重任务另开」不同：那是为**不被 cancel**；
#     这里是为**不碰共享文件**。）

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-e2e-coverage:
    name: Desktop E2E Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout shadow
        uses: actions/checkout@v7
        with:
          # ⚠️ **必须带 `path: shadow`** —— 否则仓落在 runner 工作目录的**根**
          #   ⇒ ⇒ 下面的 `working-directory: shadow/shadow-desktop` 会指向
          #   `/home/runner/work/shadow/shadow/shadow/shadow-desktop`（多一层）
          #   ⇒ ⇒ **CI 立刻红**：
          #   「An error occurred trying to start process '/usr/bin/bash'
          #     with working directory '.../shadow/shadow/shadow/shadow-desktop'」
          #   ⇒ ⇒ 这是本轮**真 CI 读数**抓到的（不是猜的）。
          #   ⚠️ 兄弟 workflow（e2e-typecheck.yml / desktop-e2e.yml）都带它。
          path: shadow

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.31.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # ⚠️ **C5 那一格需要桌面端依赖** —— 尺子要对着被测物：
      #   `playwright --list` 是 **Playwright 自己**的读数（它说哪些文件真被跑）
      #   ⇒ ⇒ 没有它 ⇒ ⇒ C5 这一格只能「判不了」⇒ ⇒ 尺子漂了没人知道。
      #   ⇒ ⇒ 只装依赖，**不装浏览器**（--list 不跑浏览器 ⇒ ⇒ 快）。
      - name: Install desktop dependencies (for the playwright --list probe)
        working-directory: shadow/shadow-desktop
        run: pnpm install --frozen-lockfile

      # ⚠️ **两步都要跑** —— 判定 ＋ 判据自检（自检证明这道闸**真的会红**）。
      - name: Desktop E2E coverage check
        run: node scripts/check-desktop-e2e-coverage.mjs

      - name: Desktop E2E coverage check (self-test)
        run: node scripts/check-desktop-e2e-coverage.mjs --self-test
