name: Desktop E2E Coverage

# ⚠️ **为什么单独成文件**（2026-11-11 实测，本仓 iBLOC/shadow）：
#   · 这道闸是**纯 node、零依赖、秒级**（除了 C5 那格要跑一次
#     `playwright --list` ⇒ ⇒ 需要桌面端依赖 ⇒ ⇒ 但 `--list` **不跑浏览器**
#     ⇒ ⇒ 实测 **1.1 秒**）⇒ ⇒ 它**不重**；
#   · 但它盯的是**桌面端 E2E 的「谁真被跑过」** ⇒ ⇒ 而 ci.yml 是**共享文件**
#     （并行会话在飞）⇒ ⇒ 共享文件上的接线是本仓最容易出两类事故的地方：
#     「把别人的在飞件卷进我的提交」；「我的暂存被别人一次 plain commit 抢走署名」。
#     ⇒ ⇒ 所以它**单独成文件** ⇒ ⇒ 接线面**零共享** ⇒ ⇒ 竞态根本不存在。
#   （与 desktop-e2e.yml 那种「重任务另开」不同：那是为**不被 cancel**；
#     这里是为**不碰共享文件**。）

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-e2e-coverage:
    name: Desktop E2E Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # ⚠️ 判读落盘路径（**仓外**）—— 分母要覆盖**这一盏灯里所有**真跑的闸 ⇒ ⇒ 每道闸的结论都得落到同一份记录里 ⇒ ⇒ 收尾一步汇总成带分母的读数。
      # ⚠️ 落在仓根会污染被测面（顶层对账闸会当场判红）⇒ ⇒ 用 RUNNER_TEMP。
      # ⚠️ 落盘路径**不能**用表达式上下文（job 级 env 里不可用 ⇒ ⇒ 整个 workflow 文件会被拒绝加载 ⇒ ⇒ run 零 job 失败）。
      - name: 准备判读落盘路径（仓外）
        run: echo "GATE_RESULT_FILE=$RUNNER_TEMP/gate-results.ndjson" >> "$GITHUB_ENV"
      - name: Checkout shadow
        uses: actions/checkout@v7
        # ⚠️⚠️ **不要带 `path: shadow`** —— 那样仓会落在 runner 工作目录的**子目录**
        #   ⇒ ⇒ 下面的 `run: node scripts/...`（工作目录＝仓库根）就**找不到脚本**：
        #   「Error: Cannot find module
        #     '/home/runner/work/shadow/shadow/scripts/check-desktop-e2e-coverage.mjs'」
        #   ⇒ ⇒ **本轮真 CI 逐字读数**（run 42632142640）抓到的。
        #   ⇒ ⇒ 兄弟 workflow（desktop-test-assertions.yml）也是**不带** path 的。
        #   ⚠️ 兄弟 workflow（e2e-typecheck.yml / desktop-e2e.yml）**带** path: shadow
        #   ⇒ ⇒ 因为它们的 step 全都显式写了 `working-directory: shadow/shadow-desktop`
        #   ⇒ ⇒ **两套写法各自成立，但不能混用**（混用就会多一层 / 少一层）。

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.31.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # ⚠️ **C5 那一格需要桌面端依赖** —— 尺子要对着被测物：
      #   `playwright --list` 是 **Playwright 自己**的读数（它说哪些文件真被跑）
      #   ⇒ ⇒ 没有它 ⇒ ⇒ C5 这一格只能「判不了」⇒ ⇒ 尺子漂了没人知道。
      #   ⇒ ⇒ 只装依赖，**不装浏览器**（--list 不跑浏览器 ⇒ ⇒ 快）。
      - name: Install desktop dependencies (for the playwright --list probe)
        working-directory: shadow-desktop
        run: pnpm install --frozen-lockfile

      # ⚠️ **两步都要跑** —— 判定 ＋ 判据自检（自检证明这道闸**真的会红**）。
      - name: Desktop E2E coverage check
        run: node scripts/run-gate-once.mjs --strict scripts/check-desktop-e2e-coverage.mjs

      - name: Desktop E2E coverage check (self-test)
        run: node scripts/check-desktop-e2e-coverage.mjs --self-test
      # ⚠️ 收尾：把这一盏灯「绿得有多真」写出来 —— 这一盏灯里**所有**真跑的闸
      #    都落了判读 ⇒ ⇒ 这里汇总成**带分母的读数**（真判 N ｜ 判不了 K ｜ 红 M）
      #    ⇒ ⇒ 「判不了」不当红（它不是「有问题」）⇒ ⇒ 但也不当绿（它不是「没问题」）。
      # ⚠️ if: always() ⇒ ⇒ **闸红的时候分母照样在** ⇒ ⇒ 不然「红」的那一格
      #    恰好是**唯一没有分母**的那一格 ⇒ ⇒ 红灯也读不出「到底跑了哪几道」。
      - name: 判读汇总（带分母的绿灯）
        if: always()
        run: node scripts/lib/gate-tally.mjs --report
