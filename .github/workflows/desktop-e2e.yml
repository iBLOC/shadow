name: Desktop E2E

# ⚠️⚠️ **这个 workflow 单独成文件，是因为它跑不完**（2026-11-05 真机实测）：
#   「Desktop E2E」那个 job 要**冷编端脑 server 全链**（candle / datafusion /
#   lance / wasmtime）⇒ ⇒ 实测 **13 分 39 秒**（run 42013193864 的
#   「Build the 端脑 server」一步）⇒ ⇒ 而 CI 主 workflow 的 concurrency 是
#   `cancel-in-progress: true` ⇒ ⇒ **每次 push 都把它砍掉** ⇒ ⇒ ⇒
#   「Run Playwright E2E」这一步**从来没跑过**（2026-11-05 连续 5 个 run
#   全部 cancelled 在编端脑那一半）。
#   ⇒ ⇒ 修法：**长任务不进 push 流水线** ⇒ ⇒ 它有自己的 workflow、自己的并发
#   组、`cancel-in-progress: false` ⇒ ⇒ 没人能取消它 ⇒ ⇒ 它能跑完。
#
# ⚠️ **为什么没有 `push:` 触发**：这个 job 一次 ~17 分钟 ⇒ ⇒ 在「每 2–4 分钟
#   一次 push」的协作节奏下，push 触发 ⇒ ⇒ 一个 run 永远在跑、另一个永远排队
#   ⇒ ⇒ 排队那个还会被下一次 push 顶掉 ⇒ ⇒ **手动触发会被推挤掉**。
#   ⇒ ⇒ 所以触发只有两个：**手动**（workflow_dispatch）与**夜间定时**（schedule）。
#
# ⚠️ **为什么缓存救不了它**（2026-11-05 实测）：rust-cache 的缓存路径是**十个
#   仓的整个 target 树**（日志逐字：`.../encephalon/target` 等 10 条）⇒ ⇒ 本机
#   同款 target **32 GB** ⇒ ⇒ **远超 GitHub 单个缓存 10 GB 的上限** ⇒ ⇒
#   就算把 `cache-on-failure` 打开也存不进去 ⇒ ⇒ ⇒ 「把 E2E 压到 3 分钟内」
#   这条路**不成立** ⇒ ⇒ 能走的只有「让它跑完」这一条。

on:
  workflow_dispatch:
  schedule:
    # UTC 19:37 ＝ 北京 03:37 ⇒ ⇒ 避开整点（整点的 runner 最挤）。
    - cron: '37 19 * * *'

concurrency:
  group: desktop-e2e
  # ⚠️ **false 是这个 workflow 存在的全部理由** ⇒ ⇒ 改回 true ⇒ ⇒
  #    「Playwright 从来没跑过」立刻回来。
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop-e2e:
    name: Desktop E2E (Playwright + 端脑)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      # ⚠️⚠️ **尺子要钉住** —— 与 `ci.yml` 的 `prefrontal-rust` job
      #    **同一把**（1.99.0）。
      #    ⇒ ⇒ 为什么两处必须一致：这个 workflow 也编 **Rust**（端脑
      #    server，`cargo build --bin encephalon-server`）⇒ ⇒ 它也用同一套 path 依赖
      #    （prefrontal / synapse / hippocampus / neuron）⇒ ⇒ 两个 job 用不同版本编
      #    同一套依赖，就会出现「**这里编过、那里编不过**」的
      #    尺子漂移（一个用 1.96、一个用 1.99）。
      #    ⚡️ 版本号与 `ci.yml` **必须相同** ⇒ ⇒ 两处同步手改。
      # ⚠️⚠️ **变量名必须是 `RUSTUP_TOOLCHAIN`**（带 `UP`）—— 不是 `RUST_TOOLCHAIN`！
      #    ⚡️ **真机实测（2026-11-05）**：写错名字 ⇒ ⇒ rustup 完全无视 ⇒ ⇒ 装了 1.99.0、
      #    全绿、而实际用的是 stable（那天是 1.99.1）⇒ ⇒ **装了不等于用了**。
      RUSTUP_TOOLCHAIN: '1.99.0'
    steps:
      - name: Checkout shadow
        uses: actions/checkout@v7
        with:
          path: shadow

      # ⚠️ 检出清单**只有这一份**（在 composite action 里）⇒ ⇒ 与 ci.yml 的
      #    跨仓闸 job 不会漂移。
      - name: Checkout the iBLOC stack
        id: stack
        uses: ./shadow/.github/actions/ibloc-siblings
        with:
          token: ${{ secrets.IBLOC_TOKEN }}

      # protoc 只有**编**的时候要（lance-encoding 的 build script）⇒ ⇒
      # 跨仓闸那个 job 不需要它 ⇒ ⇒ 它留在本 workflow，不进 composite。
      - name: Install protobuf-compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.31.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: shadow/shadow-desktop/pnpm-lock.yaml

      # runner 磁盘 —— 预装工具先删掉。
      - name: Free disk space
        run: |
          # ⚠️ 每一刀都 `|| true`：GitHub 的 bash 是 `-e` 模式 ⇒ ⇒ 任何一条
          #    rm 失败 ⇒ ⇒ **整个 step 就红了** —— 而这一步的目的只是
          #    「尽量腾出磁盘」⇒ ⇒ 「腾不出来」不该阻断 CI。
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeSC || true
          sudo rm -rf /usr/share/swift /usr/local/share/powershell || true
          sudo rm -f /swapfile || true
          df -h /home/runner

      # ⚠️ rust-cache 留在 job 层（composite **没有 post 步** ⇒ ⇒ 真正存缓存的
      #    那一步不会跑 ⇒ ⇒ 缓存永远存不下来）⇒ ⇒ `workspaces` 由 composite 输出
      #    ⇒ ⇒ 检出清单仍然只有一份。
      - name: Setup Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ steps.stack.outputs.workspaces }}

      # ⚠️⚠️ 同 `ci.yml`：被钉住的版本**必须显式装**（`RUST_TOOLCHAIN`
      #    只是指定，runner 预装的 stable 里未必有那个精确版本）
      #    ⇒ ⇒ 不装就会在编译那一步报 "toolchain '1.99.0' is not
      #    installed"。⇒ ⇒ 同样把版本**打出来**（尺子漂了必须看得见）。
      - name: Install pinned Rust toolchain
        run: |
          set -eu
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup default "$RUSTUP_TOOLCHAIN"
          rustc --version
          cargo --version
          # ⚠️⚠️ 断言它真的生效了（装了不等于用了）。
          active="$(rustup show active-toolchain)"
          echo "active toolchain: $active"
          case "$active" in
            "$RUSTUP_TOOLCHAIN"*) echo "✅ pinned toolchain is active" ;;
            *) echo "::error::pinned toolchain is NOT active (active=$active, pinned=$RUSTUP_TOOLCHAIN)"; exit 1 ;;
          esac

      # 两道跨仓闸 —— 放在长编译**之前** ⇒ ⇒ 便宜地先判一次「依赖图还成不成立」。
      - name: External tools wiring check
        run: node shadow/scripts/check-external-tools.mjs

      - name: External tools wiring check (self-test)
        run: node shadow/scripts/check-external-tools.mjs --self-test

      - name: Neuron ownership check
        run: node shadow/scripts/check-neuron-ownership.mjs

      # One process, one port: neuron's OpenAI face at the root, the 端脑
      # face (/shadow/v1/*, /api/telencephalon/*), 海马体 at /hippocampus.
      - name: Build the 端脑 server
        working-directory: encephalon
        run: cargo build --manifest-path Cargo.toml --bin encephalon-server

      - name: Install dependencies
        working-directory: shadow/shadow-desktop
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: shadow/shadow-desktop
        run: pnpm exec playwright install --with-deps chromium

      # ⚠️ **E2E 要走「构建产物」那条路** —— playwright.config.ts 自己的文档就写着：
      #    dev server 要逐模块 transform ⇒ ⇒ 在被编译占满的机器上首屏 38 秒、
      #    「/settings」的 load 事件 180 秒都没等到 ⇒ ⇒ 页面全白 ⇒ ⇒ 页面类断言必红。
      - name: Build the web bundle for E2E
        working-directory: shadow/shadow-desktop
        run: pnpm exec vite build --config vite.config.web.ts --mode web

      - name: Run Playwright E2E against the 端脑 server
        working-directory: shadow/shadow-desktop
        env:
          SHADOW_TELENCEPHALON_BIN: ${{ github.workspace }}/encephalon/target/debug/encephalon-server
          SHADOW_TELENCEPHALON_CWD: ${{ github.workspace }}/encephalon
          SHADOW_FULL_STACK: '1'
          # ⚠️ 端脑在 CI 上是**冷启动**（datafusion / lance / wasmtime 初始化）
          #    ⇒ ⇒ 本地那个 15 秒的时限在这儿不够 ⇒ ⇒ 而「不够」和「崩了」
          #    在 stdio: ignore 下长得一模一样 ⇒ ⇒ 这里给 120 秒。
          SHADOW_TELENCEPHALON_START_TIMEOUT_MS: '120000'
          # ⚠️ baseURL 与 webServer 必须**一起**换（playwright.config.ts 的注释）
          SHADOW_E2E_SERVER_CMD: pnpm preview:web
          SHADOW_E2E_SERVER_URL: http://127.0.0.1:4173
          SHADOW_E2E_BASE_URL: http://127.0.0.1:4173
          # ⚠️ **admin 钥匙：端脑的 admin 面 fail-closed**（2026-11-05 真机实测）
          #    —— 独立 server 的 admin 钥匙**默认是空** ⇒ ⇒ 配一把才开得了。
          # ⇒ ⇒ 这把钥匙**同一个值**喂两端：服务端（global-setup 转成
          #    `TELENCEPHALON_ADMIN_KEY`）＋ 客户端（`playwright.config.ts` 的
          #    `extraHTTPHeaders`）⇒ ⇒ 头名与钥匙**只有一处** ⇒ ⇒ 不会漂。
          # ⇒ ⇒ 这是**回环上的测试凭据**，不是产品密钥。
          SHADOW_E2E_ADMIN_KEY: e2e-loopback-admin-key
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
            pnpm exec playwright test --reporter=github \
              e2e-conversation-flow e2e-task-scheduling business-flow-ui \
              telencephalon-endpoints

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: shadow/shadow-desktop/playwright-report
          retention-days: 7

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: shadow/shadow-desktop/test-results
          retention-days: 7

      # ⚠️⚠️ **端脑的服务端日志必须进产物** —— 2026-11-05 真机实测：
      #    日志原本写在 `TEST_DATA_DIR/telencephalon-server.log` ⇒ ⇒ 而
      #    `global-teardown.ts` 会 `rmSync(TEST_DATA_DIR, {recursive:true})`
      #    ⇒ ⇒ **日志在上传之前就被删掉了** ⇒ ⇒ artifact 里只有各条 spec 的
      #    error-context.md，**没有服务端日志** ⇒ ⇒ ⇒ 「端脑为什么那样答」
      #    在 CI 上**判不了**。
      # ⇒ ⇒ 修法两处：日志写到 `TEST_DATA_DIR` **之外**（teardown 删不到它）
      #    ＋ 这里的 path 跟着改（CI 上是 /tmp/shadow-e2e-logs/）。
      - name: Upload the 端脑 server log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: telencephalon-server-log
          path: /tmp/shadow-e2e-logs/telencephalon-server.log
          retention-days: 7
          # ⚠️ **不许再静默** —— 2026-11-05 真机实测：这里原本写的是 `ignore`
          #    ⇒ ⇒ 「什么都没传」被判成**绿** ⇒ ⇒ 「端脑为什么那样答」在 CI 上
          #    **判不了**却看不出来 ⇒ ⇒ 正是「**有防线 ≠ 防线生效**」。
          # ⇒ ⇒ 改成 `error` ⇒ ⇒ 日志路径再漂一次就**当场变红**（而不是又一次静默绿）。
          if-no-files-found: error

      # ⚠️⚠️ **trace 就是请求级取证通道** —— Playwright 的 trace 逐行记着每个请求的
      #    方法 ＋ URL ＋ 状态码 ＋ **请求头** ⇒ ⇒ 「端脑那扇门到底**有没有**收到凭据」
      #    **不必**等端脑加请求级日志就能判 ⇒ ⇒ 这道闸把它变成**会红的读数**。
      #    ⇒ ⇒ 真实事故：仓里那份 config 把两个头 spread 到 `use` 的顶层 ⇒ ⇒ Playwright
      #    **静默忽略** ⇒ ⇒ 那一轮打向端脑的请求**一条都没带凭据**、**全部 401** ⇒ ⇒
      #    每一条红都是它的下游 ⇒ ⇒ 这道闸就是为了让下一次**当场变红**。
      # ⚠️ `if: always()` ⇒ ⇒ Playwright 红了它照样跑 ⇒ ⇒ 它的读数就是**诊断**：
      #    「凭据到位了（绿）⇒ ⇒ 剩下的红是别的」／「连凭据都没发出去（红）」。
      - name: E2E trace credential check
        if: always()
        run: |
          set -eu
          OUT="$RUNNER_TEMP/e2e-traces"
          mkdir -p "$OUT"
          n=0
          for z in $(find shadow/shadow-desktop/test-results -name 'trace.zip' 2>/dev/null); do
            d="$OUT/$(echo "$z" | tr '/' '_')"
            mkdir -p "$d"
            unzip -o -q "$z" -d "$d"
            n=$((n+1))
          done
          echo "trace.zip 个数：$n"
          node shadow/scripts/check-e2e-trace-credentials.mjs --dir "$OUT"
