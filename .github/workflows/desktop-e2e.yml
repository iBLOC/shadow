name: Desktop E2E

# ⚠️⚠️ **这个 workflow 单独成文件，是因为它跑不完**（2026-11-05 真机实测）：
#   「Desktop E2E」那个 job 要**冷编端脑 server 全链**（candle / datafusion /
#   lance / wasmtime）⇒ ⇒ 实测 **13 分 39 秒**（run 42013193864 的
#   「Build the 端脑 server」一步）⇒ ⇒ 而 CI 主 workflow 的 concurrency 是
#   `cancel-in-progress: true` ⇒ ⇒ **每次 push 都把它砍掉** ⇒ ⇒ ⇒
#   「Run Playwright E2E」这一步**从来没跑过**（2026-11-05 连续 5 个 run
#   全部 cancelled 在编端脑那一半）。
#   ⇒ ⇒ 修法：**长任务不进 push 流水线** ⇒ ⇒ 它有自己的 workflow、自己的并发
#   组、`cancel-in-progress: false` ⇒ ⇒ 没人能取消它 ⇒ ⇒ 它能跑完。
#
# ⚠️ **为什么没有 `push:` 触发**：这个 job 一次 ~17 分钟 ⇒ ⇒ 在「每 2–4 分钟
#   一次 push」的协作节奏下，push 触发 ⇒ ⇒ 一个 run 永远在跑、另一个永远排队
#   ⇒ ⇒ 排队那个还会被下一次 push 顶掉 ⇒ ⇒ **手动触发会被推挤掉**。
#   ⇒ ⇒ 所以触发只有两个：**手动**（workflow_dispatch）与**夜间定时**（schedule）。
#
# ⚠️ **为什么缓存救不了它**（2026-11-05 实测）：rust-cache 的缓存路径是**十个
#   仓的整个 target 树**（日志逐字：`.../encephalon/target` 等 10 条）⇒ ⇒ 本机
#   同款 target **32 GB** ⇒ ⇒ **远超 GitHub 单个缓存 10 GB 的上限** ⇒ ⇒
#   就算把 `cache-on-failure` 打开也存不进去 ⇒ ⇒ ⇒ 「把 E2E 压到 3 分钟内」
#   这条路**不成立** ⇒ ⇒ 能走的只有「让它跑完」这一条。

on:
  workflow_dispatch:
  schedule:
    # UTC 19:37 ＝ 北京 03:37 ⇒ ⇒ 避开整点（整点的 runner 最挤）。
    - cron: '37 19 * * *'

concurrency:
  group: desktop-e2e
  # ⚠️ **false 是这个 workflow 存在的全部理由** ⇒ ⇒ 改回 true ⇒ ⇒
  #    「Playwright 从来没跑过」立刻回来。
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop-e2e:
    name: Desktop E2E (Playwright + 端脑)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      # ⚠️⚠️ **尺子要钉住** —— 与 `ci.yml` 的 `prefrontal-rust` job
      #    **同一把**（1.99.0）。
      #    ⇒ ⇒ 为什么两处必须一致：这个 workflow 也编 **Rust**（端脑
      #    server，`cargo build --bin encephalon-server`）⇒ ⇒ 它也用同一套 path 依赖
      #    （prefrontal / synapse / hippocampus / neuron）⇒ ⇒ 两个 job 用不同版本编
      #    同一套依赖，就会出现「**这里编过、那里编不过**」的
      #    尺子漂移（一个用 1.96、一个用 1.99）。
      #    ⚡️ 版本号与 `ci.yml` **必须相同** ⇒ ⇒ 两处同步手改。
      # ⚠️⚠️ **变量名必须是 `RUSTUP_TOOLCHAIN`**（带 `UP`）—— 不是 `RUST_TOOLCHAIN`！
      #    ⚡️ **真机实测（2026-11-05）**：写错名字 ⇒ ⇒ rustup 完全无视 ⇒ ⇒ 装了 1.99.0、
      #    全绿、而实际用的是 stable（那天是 1.99.1）⇒ ⇒ **装了不等于用了**。
      RUSTUP_TOOLCHAIN: '1.99.0'
    steps:
      - name: Checkout shadow
        uses: actions/checkout@v7
        with:
          path: shadow

      # ⚠️ 检出清单**只有这一份**（在 composite action 里）⇒ ⇒ 与 ci.yml 的
      #    跨仓闸 job 不会漂移。
      - name: Checkout the iBLOC stack
        id: stack
        uses: ./shadow/.github/actions/ibloc-siblings
        with:
          token: ${{ secrets.IBLOC_TOKEN }}

      # protoc 只有**编**的时候要（lance-encoding 的 build script）⇒ ⇒
      # 跨仓闸那个 job 不需要它 ⇒ ⇒ 它留在本 workflow，不进 composite。
      - name: Install protobuf-compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.31.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: shadow/shadow-desktop/pnpm-lock.yaml

      # runner 磁盘 —— 预装工具先删掉。
      - name: Free disk space
        run: |
          # ⚠️ 每一刀都 `|| true`：GitHub 的 bash 是 `-e` 模式 ⇒ ⇒ 任何一条
          #    rm 失败 ⇒ ⇒ **整个 step 就红了** —— 而这一步的目的只是
          #    「尽量腾出磁盘」⇒ ⇒ 「腾不出来」不该阻断 CI。
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeSC || true
          sudo rm -rf /usr/share/swift /usr/local/share/powershell || true
          sudo rm -f /swapfile || true
          df -h /home/runner

      # ⚠️ rust-cache 留在 job 层（composite **没有 post 步** ⇒ ⇒ 真正存缓存的
      #    那一步不会跑 ⇒ ⇒ 缓存永远存不下来）⇒ ⇒ `workspaces` 由 composite 输出
      #    ⇒ ⇒ 检出清单仍然只有一份。
      - name: Setup Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ steps.stack.outputs.workspaces }}

      # ⚠️⚠️ 同 `ci.yml`：被钉住的版本**必须显式装**（`RUST_TOOLCHAIN`
      #    只是指定，runner 预装的 stable 里未必有那个精确版本）
      #    ⇒ ⇒ 不装就会在编译那一步报 "toolchain '1.99.0' is not
      #    installed"。⇒ ⇒ 同样把版本**打出来**（尺子漂了必须看得见）。
      - name: Install pinned Rust toolchain
        run: |
          set -eu
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup default "$RUSTUP_TOOLCHAIN"
          rustc --version
          cargo --version
          # ⚠️⚠️ 断言它真的生效了（装了不等于用了）。
          active="$(rustup show active-toolchain)"
          echo "active toolchain: $active"
          case "$active" in
            "$RUSTUP_TOOLCHAIN"*) echo "✅ pinned toolchain is active" ;;
            *) echo "::error::pinned toolchain is NOT active (active=$active, pinned=$RUSTUP_TOOLCHAIN)"; exit 1 ;;
          esac

      # 两道跨仓闸 —— 放在长编译**之前** ⇒ ⇒ 便宜地先判一次「依赖图还成不成立」。
      - name: External tools wiring check
        run: node shadow/scripts/check-external-tools.mjs

      - name: External tools wiring check (self-test)
        run: node shadow/scripts/check-external-tools.mjs --self-test

      - name: Neuron ownership check
        run: node shadow/scripts/check-neuron-ownership.mjs

      # One process, one port: neuron's OpenAI face at the root, the 端脑
      # face (/shadow/v1/*, /api/telencephalon/*), 海马体 at /hippocampus.
      - name: Build the 端脑 server
        working-directory: encephalon
        run: cargo build --manifest-path Cargo.toml --bin encephalon-server

      - name: Install dependencies
        working-directory: shadow/shadow-desktop
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: shadow/shadow-desktop
        run: pnpm exec playwright install --with-deps chromium

      # ⚠️ **E2E 要走「构建产物」那条路** —— playwright.config.ts 自己的文档就写着：
      #    dev server 要逐模块 transform ⇒ ⇒ 在被编译占满的机器上首屏 38 秒、
      #    「/settings」的 load 事件 180 秒都没等到 ⇒ ⇒ 页面全白 ⇒ ⇒ 页面类断言必红。
      - name: Build the web bundle for E2E
        working-directory: shadow/shadow-desktop
        run: pnpm exec vite build --config vite.config.web.ts --mode web

      - name: Run Playwright E2E against the 端脑 server
        working-directory: shadow/shadow-desktop
        env:
          SHADOW_TELENCEPHALON_BIN: ${{ github.workspace }}/encephalon/target/debug/encephalon-server
          SHADOW_TELENCEPHALON_CWD: ${{ github.workspace }}/encephalon
          SHADOW_FULL_STACK: '1'
          # ⚠️ 端脑在 CI 上是**冷启动**（datafusion / lance / wasmtime 初始化）
          #    ⇒ ⇒ 本地那个 15 秒的时限在这儿不够 ⇒ ⇒ 而「不够」和「崩了」
          #    在 stdio: ignore 下长得一模一样 ⇒ ⇒ 这里给 120 秒。
          SHADOW_TELENCEPHALON_START_TIMEOUT_MS: '120000'
          # ⚠️ baseURL 与 webServer 必须**一起**换（playwright.config.ts 的注释）
          SHADOW_E2E_SERVER_CMD: pnpm preview:web
          SHADOW_E2E_SERVER_URL: http://127.0.0.1:4173
          SHADOW_E2E_BASE_URL: http://127.0.0.1:4173
          # ⚠️ **admin 钥匙：端脑的 admin 面 fail-closed**（2026-11-05 真机实测）
          #    —— 独立 server 的 admin 钥匙**默认是空** ⇒ ⇒ 配一把才开得了。
          # ⇒ ⇒ 这把钥匙**同一个值**喂两端：服务端（global-setup 转成
          #    `TELENCEPHALON_ADMIN_KEY`）＋ 客户端（`playwright.config.ts` 的
          #    `extraHTTPHeaders`）⇒ ⇒ 头名与钥匙**只有一处** ⇒ ⇒ 不会漂。
          # ⇒ ⇒ 这是**回环上的测试凭据**，不是产品密钥。
          SHADOW_E2E_ADMIN_KEY: e2e-loopback-admin-key
        run: |
          # ⚠️⚠️ **GitHub 的 `run:` 默认是 `bash -e`** ⇒ ⇒ 失败的那条命令**后面**
          #    的诊断全都不执行 ⇒ ⇒ 「红」得莫名其妙 ⇒ ⇒ 这里自己接管：
          #    ① `set +e` 关掉 `-e`（退出码逐条判）；② **先打印输出、再判退出码**
          #    ⇒ ⇒ 红的时候原因就在眼前（不许「失败长得像没发生」）。
          set +e
          set -uo pipefail
          OUT="$RUNNER_TEMP/playwright-e2e.txt"
          # ⚠️⚠️⚠️ **2026-11-11 真跑级实测：这里原来只点名 4 个规格**
          #   （e2e-conversation-flow / e2e-task-scheduling / business-flow-ui /
          #   telencephalon-endpoints）⇒ ⇒ **另外 22 个规格的断言从未在 CI
          #   里执行过**（刀 M 的取证：39 个 E2E 文件，CI 真跑 4 个 = 10%）。
          #   ⇒ ⇒ 现在**去掉过滤参数** ⇒ ⇒ Playwright 按自己的语义跑**整个
          #   testDir**（26 个规格 / 102 条用例）⇒ ⇒ 债从「登记」变成「真跑」。
          #   ⇒ ⇒ ⚠️ **为什么不用「逐个点名」**：Playwright 的 CLI 过滤参数是
          #   **正则**（实测：`conversation` 会同时命中 conversation-chat 与
          #   conversation）⇒ ⇒ 点名 26 个要写 26 条转义正则 ⇒ ⇒ 脆 ⇒ ⇒
          #   ⇒ 宁可**不点名**（跑整族）⇒ ⇒ 闸那一格也据此改（零过滤参数 = 整族）。
          #   ⇒ ⇒ ⚠️ 本机实测读数：**95 passed / 0 failed / 7 skipped**（24.4 秒）
          #   ⇒ ⇒ 7 条跳过是**诚实跳过**（逐条白名单在下面判）。
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
            pnpm exec playwright test --reporter=github > "$OUT" 2>&1
          PSTATUS=$?
          cat "$OUT"
          if [ "$PSTATUS" != "0" ]; then
            echo "::error::Playwright 红了（退出码 $PSTATUS）—— 上面就是逐条读数"
            exit "$PSTATUS"
          fi
          # ⚠️ **必须先剥掉 ANSI 颜色码再判**（github reporter 的摘要行带颜色码）
          CLEAN=$(sed -r 's/\x1B[[0-9;]*[mK]//g' "$OUT")
          # ⚠️ **按语义判，不按版式判** —— 要「N passed」这个**事实**，
          #    不许钉某个具体版式字符串（版式会随环境变，事实不会）。
          PASSED=$(printf '%s' "$CLEAN" | grep -oE '[0-9]+ passed' | head -1)
          if [ -z "$PASSED" ]; then
            echo "::error::Playwright 读数里没有「N passed」—— 是不是全被 skip 了？（skip 在 Playwright 里不算失败 ⇒ ⇒ 退出码仍是 0）"
            exit 1
          fi
          # ⚠️⚠️ **「跳过」不许算绿，但**合法跳过要**逐条白名单点名**
          #    —— 2026-11-11 真跑级实测：全族跑起来后有 **7 条**跳过，分两族：
          #      · ❶ **环境债**（2 条）：要 `MIMO_API_KEY` 才跑（真供应商）。
          #      · ❷ **产品面未实现/已移除**（5 条）：`visual-qa-clarification-chip`
          #        与 `VideoSourcesCard` 在 `src/` 里**零引用** ⇒ ⇒ 断言不可能绿
          #        ⇒ ⇒ spec 里**诚实跳过**并写明原因（不许伪装成「跑过了」）。
          #    ⇒ ⇒ **白名单之外**的任何一条跳过 ⇒ ⇒ 判红 ⇒ ⇒ 「跳过也算绿」
          #    ⇒ ⇒ 依然是假绿。
          #    ⇒ ⇒ ⚠️ 白名单按**文件名**认（不是行号/标题）⇒ ⇒ 标题会变。
          SKIPPED_ALLOW=(
            "e2e-provider-conversation.spec.ts"   # ❶ 要 MIMO_API_KEY（环境债）
            "providers-models.spec.ts"            # ❶ 要 MIMO_API_KEY（环境债）
            "video-sources.spec.ts"               # ❷ 产品面已从设置页移除
            "visual-qa-clarification.spec.ts"     # ❷ 产品面从未实现
          )
          SKIPPED_LINES=$(printf '%s' "$CLEAN" | grep -E '^[\s-]*-[\s-]+[0-9]+ \[chromium\]' || true)
          SKIPPED_TOTAL=$(printf '%s' "$SKIPPED_LINES" | grep -c '\[chromium\]' || true)
          if [ "$SKIPPED_TOTAL" -gt 0 ]; then
            echo "::notice::逐条跳过读数（$SKIPPED_TOTAL 条）—— 逐条对白名单："
            printf '%s\n' "$SKIPPED_LINES" | sed 's/^/    /'
            UNALLOWED=0
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              OK=0
              for allow in "${SKIPPED_ALLOW[@]}"; do
                if printf '%s' "$line" | grep -q "$allow"; then OK=1; break; fi
              done
              if [ "$OK" != "1" ]; then
                echo "::error::白名单外的跳过：$line"
                UNALLOWED=1
              fi
            done <<< "$SKIPPED_LINES"
            if [ "$UNALLOWED" != "0" ]; then
              echo "::error::有跳过不在白名单里 —— 跳过不算失败 ⇒ ⇒ 这一格是假绿"
              exit 1
            fi
            echo "::notice::全部 $SKIPPED_TOTAL 条跳过都在白名单里（逐条点名过）"
          fi
          # ⚠️⚠️ **failed 一律判红** —— Playwright 自己的退出码已经覆盖这一条，
          #    但**逐条点名**红的是哪几条 ⇒ ⇒ 「红得莫名其妙」是最贵的失败。
          if printf '%s' "$CLEAN" | grep -qE '[0-9]+ failed'; then
            echo "::error::Playwright 读数里有 failed —— 逐条名字在上面的输出里"
            exit 1
          fi
          echo "::notice::Playwright 读数：$PASSED（且无白名单外的跳过）"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: shadow/shadow-desktop/playwright-report
          retention-days: 7

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: shadow/shadow-desktop/test-results
          retention-days: 7

      # ⚠️⚠️ **端脑的服务端日志必须进产物** —— 2026-11-05 真机实测：
      #    日志原本写在 `TEST_DATA_DIR/telencephalon-server.log` ⇒ ⇒ 而
      #    `global-teardown.ts` 会 `rmSync(TEST_DATA_DIR, {recursive:true})`
      #    ⇒ ⇒ **日志在上传之前就被删掉了** ⇒ ⇒ artifact 里只有各条 spec 的
      #    error-context.md，**没有服务端日志** ⇒ ⇒ ⇒ 「端脑为什么那样答」
      #    在 CI 上**判不了**。
      # ⇒ ⇒ 修法两处：日志写到 `TEST_DATA_DIR` **之外**（teardown 删不到它）
      #    ＋ 这里的 path 跟着改（CI 上是 /tmp/shadow-e2e-logs/）。
      - name: Upload the 端脑 server log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: telencephalon-server-log
          path: /tmp/shadow-e2e-logs/telencephalon-server.log
          retention-days: 7
          # ⚠️ **不许再静默** —— 2026-11-05 真机实测：这里原本写的是 `ignore`
          #    ⇒ ⇒ 「什么都没传」被判成**绿** ⇒ ⇒ 「端脑为什么那样答」在 CI 上
          #    **判不了**却看不出来 ⇒ ⇒ 正是「**有防线 ≠ 防线生效**」。
          # ⇒ ⇒ 改成 `error` ⇒ ⇒ 日志路径再漂一次就**当场变红**（而不是又一次静默绿）。
          if-no-files-found: error

      # ⚠️⚠️ **API 契约套件（真端脑 → 桌面端依赖的每一个端点都必须答）** —— 2026-11-09 新增。
      #   · ⚠️⚠️ **这道套件在 CI 上从来没有跑过** —— 没有任何 workflow 调它
      #     ⇒ ⇒ 「它有 50 个用例」是**假象**；而且它原来的 **404 白名单是全局的**
      #     ⇒ ⇒ 端脑缺路由时它照样绿 ⇒ ⇒ 端点漂移永远抓不到。
      #   · ⇒ ⇒ 现在三处一起修：① **404 只对带 `{id}` 占位符的路径放行**；
      #     ② 递**读门钥匙**（影子锁 ∪ admin token —— 门形真源＝端脑 door_policy.txt）；
      #     ③ **核读数**：必须出现「N passed」，且**不许有 skipped**。
      #   · ⚠️ 为什么放这个 workflow 而不是每次 push：它要**编端脑**（冷编几十分钟）
      #     ⇒ ⇒ 而 `ci.yml` 是共享文件（并行会话在飞）⇒ ⇒ **独立成文件会重复冷编**
      #     ⇒ ⇒ 这里复用这个 workflow 已经编好的端脑二进制 ⇒ ⇒ 频率＝夜间/手动
      #     （**不是每次 push** ⇒ ⇒ 台账里记着这一格的真实频率）。
      - name: API contract suite (real 端脑 → every client endpoint must answer)
        working-directory: shadow/shadow-desktop
        env:
          # ⚠️ **回环上的测试凭据**，不是产品密钥 ⇒ ⇒ 只活在这一步里。
          TELENCEPHALON_ADMIN_KEY: e2e-loopback-admin-key
          TELENCEPHALON_SHADOW_KEY: e2e-loopback-shadow-key
          SHADOW_TEST_ADMIN_TOKEN: e2e-loopback-admin-key
          SHADOW_TEST_SHADOW_KEY: e2e-loopback-shadow-key
          SHADOW_TELENCEPHALON_URL: http://127.0.0.1:60194
          # ⚠️ **端脑不在 ⇒ 硬失败** —— 端脑起不来 ⇒ ⇒ 契约套件会**整份 skip**
          #   ⇒ ⇒ vitest 对整份跳过退出 **0** ⇒ ⇒ 「没跑过」被伪装成「绿」。
          #   ⇒ ⇒ 这里强制 fail-closed ⇒ ⇒ 那一格只可能红、不可能假绿。
          RUN_API_TESTS: force-fail
        run: |
          # ⚠️⚠️ 同样的纪律（与上面那两步同）：① `set +e` 关掉 `-e`；
          #   ② **先打印输出、再判退出码** ⇒ ⇒ 红的时候原因就在眼前。
          set +e
          set -uo pipefail
          BIN="$GITHUB_WORKSPACE/encephalon/target/debug/encephalon-server"
          SRVLOG="$RUNNER_TEMP/api-contract-server.log"
          OUT="$RUNNER_TEMP/api-contract.txt"
          if [ ! -x "$BIN" ]; then
            echo "::error::端脑二进制不在：$BIN —— 「Build the 端脑 server」那一步应该已经红了（那才是真因）"
            exit 1
          fi
          ( cd "$GITHUB_WORKSPACE/encephalon" && exec "$BIN" --port 60194 --bind 127.0.0.1 ) > "$SRVLOG" 2>&1 &
          SRV=$!
          trap 'kill "$SRV" 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 180); do
            if curl -sf http://127.0.0.1:60194/healthz > /dev/null 2>&1; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then
            echo "::error::端脑没起来（180 秒）—— 真跑级判据**不许**因此被跳过"
            tail -n 60 "$SRVLOG" || true
            exit 1
          fi
          # ⚠️⚠️ **这段曾经写的是「只跑『契约存在性』那一族」—— 那是临时的，现在不是了**
          #   · 2026-11-09 的真端脑实测暴露：整族跑 ⇒ ⇒ `schemas` 的 5 条 **401**
          #     （形状探针**默认不带**读门钥匙 ⇒ ⇒ 「没测到」被写成「形状不对」）
          #     ＋ `/health` 的 **403**（它在**读门后** ⇒ ⇒ 公开健康面是 `/healthz`）
          #     ＋ `a2ui-live` 的 3 条 **401**（`/a2a` 在影子锁后）
          #     ⇒ ⇒ 那 13 条红**全是凭据面**的债 ⇒ ⇒ 于是临时只跑存在性族。
          #   · ⚠️ **就地订正（2026-11-09 晚）**：那 13 条已在 **U+346D 条**收口
          #     （形状探针**默认**递读门钥匙 ＋ A2UI 注入影子锁 ＋ 401/403/503
          #     改成**诚实跳过**而不是 throw）⇒ ⇒ **现在跑整族**（下面那段命令）。
          #   · ⇒ ⇒ 「只跑存在性族」这条旧约束**已作废** ⇒ ⇒ 留着它就是
          #     **「欠项理由」变成假事实**（未覆盖清单会自己腐烂 —— 真源见台账）。
          # ⚠️ **跑整族**（2026-11-09 晚）：三支都在 —— **contract**（端点存在性）
          #   ＋ **schemas**（形状）＋ **a2ui-live**（活端脑字节）⇒ ⇒ 另两支的
          #   **凭据面**已在 U+346D 条收口（探针默认递读门钥匙 ＋ A2UI 注入影子锁
          #   ＋「门/下游没就绪」改成**诚实跳过**而不是 throw）。
          # ⚠️ **按语义判，不按版式钉** —— 用 **JSON 报告**读数 ⇒ ⇒ 不依赖 vitest
          #   的摘要行版式（它随版本变）⇒ ⇒ 也不依赖 reporter 的字符（✓/↓ 在
          #   无 unicode 终端时会退化成 ASCII ⇒ ⇒ 按字符判会误判）。
          pnpm exec vitest run --config vitest.api.config.ts \
            --reporter=json --outputFile="$RUNNER_TEMP/api-contract.json" > "$OUT" 2>&1
          VSTATUS=$?
          cat "$OUT"
          # ⚠️⚠️⚠️ **逐条读数必须打出来 —— 不管退出码**（2026-11-09 真 CI 实测的教训）：
          #   第一版是「退出码 ≠ 0 ⇒ ⇒ 打一句『红了』⇒ ⇒ exit」⇒ ⇒ **红的是哪一条
          #   根本没留下** ⇒ ⇒ 「红得莫名其妙」＝最贵的失败（人只能自己去猜）。
          #   ⇒ ⇒ 现在**先**解析 JSON 报告（**无条件**跑）⇒ ⇒ 把 failed / skipped 的
          #   **名字逐条**打出来（连失败消息的前几行）⇒ ⇒ 诊断就在眼前 ⇒ ⇒ 再判退出码。
          #   ⚠️ 顺带把「版本差」这类红当场说清：端脑来自**兄弟仓 master**，
          #   而端点清单在**本仓** ⇒ ⇒ 两个仓节奏不同 ⇒ ⇒ 清单里的新端点在
          #   那台端脑上**还不存在** ⇒ ⇒ 404 ⇒ ⇒ 红的正是那一条（名字会点名）。
          READ_STATUS=0
          node -e '
            const fs = require("fs");
            const file = process.argv[1];
            if (!fs.existsSync(file)) {
              console.error("::error::JSON 报告不存在 —— 这一步没真的跑（vitest 压根没起来？）");
              process.exit(2);
            }
            let r;
            try { r = JSON.parse(fs.readFileSync(file, "utf8")); }
            catch (e) { console.error("::error::JSON 报告解析失败：" + e.message); process.exit(2); }
            const all = (r.testResults || []).flatMap((f) => f.assertionResults || []);
            const failed = all.filter((a) => a.status === "failed");
            const skipped = all.filter((a) => a.status !== "passed" && a.status !== "failed");
            const allowed = ["thalamus/preview/sensors"];
            const passed = all.filter((a) => a.status === "passed").length;
            // ⚠️ **以逐条为准** —— reporter 自报的 numFailedTests 与逐条清单
            //   在「合成/旧版报告」上会打架 ⇒ ⇒ 出现「failed=0 却列了红」
            //   ⇒ ⇒ 那就是**读数自相矛盾** ⇒ ⇒ 判据不许依赖它。
            console.log("::notice::API 契约读数：passed=" + passed + " failed=" + failed.length + " skipped=" + skipped.length + " total=" + all.length + "（reporter 自报：passed=" + r.numPassedTests + " failed=" + r.numFailedTests + " skipped=" + r.numPendingTests + " total=" + r.numTotalTests + "）");
            for (const f of failed) {
              const msg = String((f.failureMessages || []).join(" | ")).split("\n").slice(0, 4).join(" / ");
              console.error("::error::红了：" + f.fullName + " ⇒ " + msg);
            }
            for (const s of skipped) console.log("::notice::跳过：" + s.fullName);
            let bad = 0;
            if (failed.length) bad = 1;
            if (passed < 45) {
              console.error("::error::passed 只有 " + passed + " —— 低于 45 ⇒ ⇒ 整族没跑起来 ⇒ ⇒ 绝不能当成绿");
              bad = 1;
            }
            for (const s of skipped) {
              if (!allowed.some((a) => String(s.fullName || "").includes(a))) {
                console.error("::error::白名单外的跳过：" + s.fullName);
                bad = 1;
              }
            }
            process.exit(bad);
          ' "$RUNNER_TEMP/api-contract.json" || READ_STATUS=$?
          if [ "$VSTATUS" != "0" ]; then
            echo "::error::API 契约套件红了（退出码 $VSTATUS）—— 逐条原因就在上面"
            exit "$VSTATUS"
          fi
          if [ "$READ_STATUS" != "0" ]; then
            echo "::error::API 契约读数不合格 —— 逐条理由就在上面"
            exit 1
          fi
          echo "::notice::API 契约套件读数合格（整族三支：端点存在性 ＋ 形状 ＋ A2UI 字节）"
      # ⚠️ **报告不许丢** —— 红的时候**逐条原因**已经打在上面了，但这 JSON
      #   报告本身也要留下来 ⇒ ⇒ 否则「下一次又红了」时连对照都没有。
      - name: Upload the API contract reading (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: api-contract-reading
          path: ${{ runner.temp }}/api-contract.json
          retention-days: 7
          if-no-files-found: error
      # ⚠️⚠️ **trace 就是请求级取证通道** —— Playwright 的 trace 逐行记着每个请求的
      #    方法 ＋ URL ＋ 状态码 ＋ **请求头** ⇒ ⇒ 「端脑那扇门到底**有没有**收到凭据」
      #    **不必**等端脑加请求级日志就能判 ⇒ ⇒ 这道闸把它变成**会红的读数**。
      #    ⇒ ⇒ 真实事故：仓里那份 config 把两个头 spread 到 `use` 的顶层 ⇒ ⇒ Playwright
      #    **静默忽略** ⇒ ⇒ 那一轮打向端脑的请求**一条都没带凭据**、**全部 401** ⇒ ⇒
      #    每一条红都是它的下游 ⇒ ⇒ 这道闸就是为了让下一次**当场变红**。
      # ⚠️ `if: always()` ⇒ ⇒ Playwright 红了它照样跑 ⇒ ⇒ 它的读数就是**诊断**：
      #    「凭据到位了（绿）⇒ ⇒ 剩下的红是别的」／「连凭据都没发出去（红）」。
      - name: E2E trace credential check
        if: always()
        run: |
          set -eu
          OUT="$RUNNER_TEMP/e2e-traces"
          mkdir -p "$OUT"
          n=0
          for z in $(find shadow/shadow-desktop/test-results -name 'trace.zip' 2>/dev/null); do
            d="$OUT/$(echo "$z" | tr '/' '_')"
            mkdir -p "$d"
            unzip -o -q "$z" -d "$d"
            n=$((n+1))
          done
          echo "trace.zip 个数：$n"
          node shadow/scripts/check-e2e-trace-credentials.mjs --dir "$OUT"
      # ⚠️ Flutter —— 只为了跑**移动端**那条真跑级判据。
      #    版本与 `ci.yml` 的 `mobile-analyze` / `mobile-test` **同一把**（3.47.8）
      #    ⇒ ⇒ 不许漂 ⇒ ⇒ 两处同步手改。
      - name: Setup Flutter
        if: always()
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable

      # ⚠️ `hashFiles` 的路径**必须带 `shadow/` 前缀** —— 这个 workflow 的
      #    checkout 在 `shadow` 子目录里（不是仓库根）⇒ ⇒ 写 `shadow-mobile/…`
      #    ⇒ ⇒ 哈希的是**空集** ⇒ ⇒ 缓存键每次都变 ⇒ ⇒ 缓存等于没有。
      - name: Cache Flutter pub
        if: always()
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('shadow/shadow-mobile/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-flutter-pub-

      - name: Flutter pub get
        if: always()
        working-directory: shadow/shadow-mobile
        run: flutter pub get

      # ⚠️ sqflite_common_ffi 走 dart:ffi 找 `libsqlite3.so` ⇒ ⇒ ubuntu-latest
      #    只有 `libsqlite3.so.0`、没有那个 **`-dev` 软链** ⇒ ⇒ 不装它，
      #    `flutter test` 会在加载原生库时炸 ⇒ ⇒ 与 `ci.yml` 的 `mobile-test`
      #    同一款装法（那一步是它第一次真跑就栽在这）。
      - name: Install SQLite runtime
        if: always()
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      # ⚠️⚠️ **真跑级判据在这里有读数** —— 「真端脑 → 真客户端 → 真 ack」
      #    那一段的两份判据**默认是跳过的**（`SHADOW_LIVE_ENDBRAIN` 不等于 `1`
      #    就整份跳过）⇒ ⇒ 别的 workflow 跑它们 ⇒ ⇒ **跳过也算绿** ⇒ ⇒
      #    线上形状漂移了**没人知道** ⇒ ⇒ ⇒ **判据会腐烂**。
      # ⇒ ⇒ 这里给它们一个**真端脑**（上面刚编出来的那个）⇒ ⇒ 并**断言它们
      #    真的跑了**（读数里必须有「5 passed」／「All tests passed」）⇒ ⇒
      #    「被跳过」在这里判**红**。
      # ⚠️ **为什么要多这一句断言**：vitest／flutter 对**整份跳过**都退出 0
      #    ⇒ ⇒ 端脑没起来／环境变量名写错 ⇒ ⇒ 都是「skipped」＋ **绿的 step**
      #    ⇒ ⇒ 正是「失败长得像成功」⇒ ⇒ 这里用 grep 把「跳过」判成红。
      # ⚠️ **两端拆成两步** ⇒ ⇒ 各自**独立读数** ⇒ ⇒ 移动端那条红**不会遮住**
      #    桌面端那条的绿 ⇒ ⇒ 「各有各的读数」才看得出是谁坏了。
      - name: Live notification contract — desktop (real 端脑 → 真客户端 → 真 ack)
        if: always()
        env:
          # ⚠️ **回环上的测试凭据**，不是产品密钥 ⇒ ⇒ 只活在这一步里。
          TELENCEPHALON_ADMIN_KEY: live-loopback-admin-key
          TELENCEPHALON_SHADOW_KEY: live-loopback-shadow-key
          TELENCEPHALON_TASKS_FILE: ${{ runner.temp }}/live-notif-tasks-desktop.json
          SHADOW_LIVE_ENDBRAIN: '1'
          SHADOW_LIVE_ADMIN_TOKEN: live-loopback-admin-key
          SHADOW_LIVE_SHADOW_KEY: live-loopback-shadow-key
          SHADOW_LIVE_ENDBRAIN_URL: http://127.0.0.1:60192
        run: |
          # ⚠️⚠️ **GitHub 的 `run:` 默认是 `bash -e`** ⇒ ⇒ 失败的那条命令
          #    **后面**的诊断全都不执行 ⇒ ⇒ 「红」得莫名其妙 ⇒ ⇒ 而把输出
          #    重定向进文件 ⇒ ⇒ 连红的原因都**看不见** ⇒ ⇒ 「失败长得像没发生」。
          #    ⇒ ⇒ 这里两件事都自己接管：① `set +e` 关掉 `-e`（退出码逐条判）；
          #    ② **先打印输出、再判退出码** ⇒ ⇒ 红的时候原因就在眼前。
          set +e
          set -uo pipefail
          BIN="$GITHUB_WORKSPACE/encephalon/target/debug/encephalon-server"
          SRVLOG="$RUNNER_TEMP/live-notif-server.log"
          OUT="$RUNNER_TEMP/live-notif-vitest.txt"
          if [ ! -x "$BIN" ]; then
            echo "::error::端脑二进制不在：$BIN —— 上一步「Build the 端脑 server」应该已经红了（那才是真因）"
            exit 1
          fi
          ( cd "$GITHUB_WORKSPACE/encephalon" && exec "$BIN" --port 60192 --bind 127.0.0.1 ) > "$SRVLOG" 2>&1 &
          SRV=$!
          trap 'kill "$SRV" 2>/dev/null || true' EXIT
          # ⚠️ 端脑在 CI 上是**冷启动**（datafusion / lance / wasmtime）⇒ ⇒
          #    本地那个 15 秒的时限在这儿不够（Playwright 那步给的是 120 秒）
          #    ⇒ ⇒ 这里给 180 秒 ⇒ ⇒ **不许**因为「还没起来」就去跑判据
          #    （那会变成「跳过」＝「绿」）。
          READY=0
          for i in $(seq 1 180); do
            if curl -sf http://127.0.0.1:60192/healthz > /dev/null 2>&1; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then
            echo "::error::端脑没起来（180 秒）—— 真跑级判据**不许**因此被跳过"
            tail -n 60 "$SRVLOG" || true
            exit 1
          fi
          cd "$GITHUB_WORKSPACE/shadow/shadow-desktop" || { echo "::error::进不去 shadow-desktop"; exit 1; }
          pnpm exec vitest run tests/lib/reminderNotificationsLive.test.ts > "$OUT" 2>&1
          VSTATUS=$?
          # ⚠️⚠️ **必须先剥掉 ANSI 颜色码再 grep** —— vitest 的摘要行是
          #    `Tests` ESC[22m ESC[1m ESC[32m `5 passed` ⇒ ⇒ 颜色码**夹在**
          #    `Tests` 与 `5 passed` **中间** ⇒ ⇒ 不剥的话，grep 能不能匹配上
          #    全看「中间恰好有没有空格」⇒ ⇒ 换个 vitest 版本就**误判红**
          #    ⇒ ⇒ 那是「尺子靠运气」⇒ ⇒ 这里剥掉再判。
          sed -r 's/\x1B\[[0-9;]*[mK]//g' "$OUT" > "$OUT.plain"
          cat "$OUT.plain"
          if [ "$VSTATUS" != "0" ]; then
            echo "::error::桌面端真跑级判据红了（退出码 $VSTATUS）—— 输出就在上面"
            exit 1
          fi
          if ! grep -qE 'Tests[[:space:]]+5 passed' "$OUT.plain"; then
            echo "::error::桌面端真跑级判据**没有真的跑**（读数里没有「5 passed」）—— 端脑没起来、或环境变量名写错了 ⇒ ⇒ 绝不能把它当成绿"
            exit 1
          fi
          echo "✅ 桌面端真跑级判据**真的跑了**（Tests 5 passed）—— 通知面的线上形状在真端脑上对得上"

      # ⚠️ **移动端那条** —— ⚠️⚠️ **它现在在 CI 上是红的，而红在 CI 环境侧**：
      #    `package:sqlite3` 拉到的 `libsqlite3.x64.linux.so` 哈希与期望值不符
      #    ⇒ ⇒ `flutter test` 在 **native asset 构建阶段**就红 ⇒ ⇒ 连测试都
      #    **没开始** ⇒ ⇒ 与端脑、与判据都无关（台账 U+3441 条已登记这笔环境债）。
      # ⇒ ⇒ 但这一步**照样留着、照样硬判** ⇒ ⇒ 一是它一好就绿（那是环境修好的
      #    **信号**），二是它红的时候**明写**了红在哪儿 ⇒ ⇒ 不许把它静默掉。
      - name: Live notification contract — mobile (real 端脑 → 真客户端 → 真 ack)
        if: always()
        env:
          TELENCEPHALON_ADMIN_KEY: live-loopback-admin-key
          TELENCEPHALON_SHADOW_KEY: live-loopback-shadow-key
          TELENCEPHALON_TASKS_FILE: ${{ runner.temp }}/live-notif-tasks-mobile.json
          SHADOW_LIVE_ENDBRAIN: '1'
          SHADOW_LIVE_ADMIN_TOKEN: live-loopback-admin-key
          SHADOW_LIVE_SHADOW_KEY: live-loopback-shadow-key
          SHADOW_LIVE_ENDBRAIN_URL: http://127.0.0.1:60193
          # ⚠️ **移动端这一处不是冗余**（2026-11-09 实测）：`flutter test` 的摘要行
          #    由 Dart 的 `test_core` 打颜色码 ⇒ ⇒ 而下面那条 `sed` 只剥
          #    `ESC[...m` / `ESC[...K` **两种**形态 ⇒ ⇒ `ESC[?25l`（光标隐藏）
          #    与 `ESC]8;;…`（OSC 超链接）**剥不掉** ⇒ ⇒ 颜色码混进读数、
          #    `grep` 就可能匹配不上 ⇒ ⇒ ⇒ 那里用 `NO_COLOR` **从源头**关掉颜色。
          #    （桌面端那一处**删了** ⇒ ⇒ vitest 只用 `ESC[...m` ⇒ ⇒ `sed` 够用。
          #    ⇒ ⇒ 死变量闸把这一处判成「没人读」⇒ ⇒ **是误报**：
          #    ⇒ ⇒ 它的读者在**测试工具链里**（vitest 的 tinyrainbow / picocolors、
          #    ⇒ ⇒ Dart 的 test_core 都读这个变量名）⇒ ⇒ 那几个包在 `node_modules`
          #    ⇒ ⇒ 与 pub cache 里 ⇒ ⇒ **不在闸的扫描面内** ⇒ ⇒ 已登记进闸的
          #    ⇒ ⇒ 「读者是工具链自己」那一档。)
          #    ⚠️ **注释里不许写那个变量的读取形状** —— 闸**不剥注释** ⇒ ⇒ 注释里
          #    ⇒ ⇒ 出现读取形状 ⇒ ⇒ 闸就认为「有人读」⇒ ⇒ **登记被架空** ⇒ ⇒
          #    ⇒ ⇒ 那道闸就变成「靠措辞吃饭」⇒ ⇒ 登记必须**自己**承重。)
          NO_COLOR: '1'
        run: |
          set +e
          set -uo pipefail
          BIN="$GITHUB_WORKSPACE/encephalon/target/debug/encephalon-server"
          SRVLOG="$RUNNER_TEMP/live-notif-server-mobile.log"
          MOUT="$RUNNER_TEMP/live-notif-flutter.txt"
          if [ ! -x "$BIN" ]; then
            echo "::error::端脑二进制不在：$BIN —— 「Build the 端脑 server」那一步应该已经红了（那才是真因）"
            exit 1
          fi
          ( cd "$GITHUB_WORKSPACE/encephalon" && exec "$BIN" --port 60193 --bind 127.0.0.1 ) > "$SRVLOG" 2>&1 &
          SRV=$!
          trap 'kill "$SRV" 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 180); do
            if curl -sf http://127.0.0.1:60193/healthz > /dev/null 2>&1; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then
            echo "::error::端脑没起来（180 秒）—— 真跑级判据**不许**因此被跳过"
            tail -n 60 "$SRVLOG" || true
            exit 1
          fi
          cd "$GITHUB_WORKSPACE/shadow/shadow-mobile" || { echo "::error::进不去 shadow-mobile"; exit 1; }
          flutter test test/unit/reminder_inbox_live_test.dart --timeout 5m > "$MOUT" 2>&1
          FSTATUS=$?
          sed -r 's/\x1B\[[0-9;]*[mK]//g' "$MOUT" > "$MOUT.plain"
          cat "$MOUT.plain"
          if [ "$FSTATUS" != "0" ]; then
            echo "::error::移动端真跑级判据红了（退出码 $FSTATUS）—— 输出就在上面；⚠️ 已知有一笔 CI 环境侧的债：package:sqlite3 的原生 .so 哈希不符 ⇒ ⇒ flutter test 在 native asset 阶段就红 ⇒ ⇒ 连测试都没开始"
            exit 1
          fi
          # ⚠️⚠️ **两种 flutter 版本的摘要行不一样**（实测）：
          #    本机（较旧）⇒ 「00:54 +4: All tests passed!」；
          #    CI 的 3.47.8 ⇒ 「🎉 4 tests passed.」
          #    ⇒ ⇒ 只认一种字面量 ⇒ ⇒ **尺子会误判红**（真跑通了却判红）
          #    ⇒ ⇒ 那是「尺子钉着旧世界」的一个新面 ⇒ ⇒ 这里**两种都认**，
          #    且**必须带数字 4**（不许「0 个也算过」）⇒ ⇒ 整份跳过时 flutter
          #    印的是「All tests skipped.」⇒ ⇒ 匹配不上 ⇒ ⇒ 判红 ⇒ ⇒
          #    跳过不许算绿。
          if ! grep -qE '(\+4:|[^0-9]4 tests passed|All tests passed)' "$MOUT.plain" || grep -q 'All tests skipped' "$MOUT.plain"; then
            echo "::error::移动端真跑级判据**没有真的跑**（读数里没有「4 passed」）—— 整份跳过也是退出 0 ⇒ ⇒ 绝不能把它当成绿"
            exit 1
          fi
          echo "✅ 移动端真跑级判据**真的跑了**（All tests passed）—— 通知面的线上形状在真端脑上对得上"

      # ⚠️ **端脑的日志必须进产物** —— 判红时「端脑为什么那样答」判不了
      #    ⇒ ⇒ 那条红就只是一条红 ⇒ ⇒ `if-no-files-found: error` ⇒ ⇒
      #    日志路径再漂一次就**当场变红**（而不是又一次静默绿）。
      - name: Upload the live-notification 端脑 log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: live-notif-server-log
          path: |
            ${{ runner.temp }}/live-notif-server.log
            ${{ runner.temp }}/live-notif-server-mobile.log
          retention-days: 7
          if-no-files-found: error
