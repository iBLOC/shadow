name: Commit Revert

# ⚠️ **它守的是什么** —— 2026-11-09 真机实测（本仓 iBLOC/shadow）：
#   · 共享工作树 ＋ 并发「独立索引提交」⇒ ⇒ 两个会话各自构造自己的提交面
#     ⇒ ⇒ **后一个的基线可能落后** ⇒ ⇒ 它写出来的文件内容会把**前一个提交
#     的增量整段退掉**；
#   · 实测：`afb7814` 把 `21f56d4`（TS7006 的类型补法）**退回旧版**
#     ⇒ ⇒ 那条判据在真 CI 上红了（run 42646242924）⇒ ⇒ 表现是「类型闸红了」，
#     **看起来像产品回归，其实是一次静悄悄的提交面回退**。
#   ⇒ ⇒ 这一族失败**极难归因**（CI 只说「哪一行红了」，不说「谁把它退掉了」）
#     ⇒ ⇒ 本闸把这件事变成**可数的读数**：谁、在哪个文件上、把谁的增量退掉了。
#
# ⚠️ **为什么单独成文件**（与 desktop-test-assertions.yml 同理）：
#   · ci.yml 是**共享文件**（并行会话在飞）⇒ ⇒ 共享文件上的接线是本仓最容易出
#     两类事故的地方（「把别人的在飞件卷进我的提交」／「我的暂存被别人抢走署名」）
#     ⇒ ⇒ 独立成文件 ⇒ ⇒ 接线面**零共享** ⇒ ⇒ 竞态根本不存在。
#   · **fetch-depth: 0 是硬需求** —— 这道闸读的是**提交历史**
#     ⇒ ⇒ 浅克隆（depth=1）下它只能看见 1 个提交 ⇒ ⇒ 等于没跑。

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  commit-revert:
    name: Commit Revert
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # ⚠️ 判读落盘路径（**仓外**）—— 分母要覆盖**这一盏灯里所有**真跑的闸 ⇒ ⇒ 每道闸的结论都得落到同一份记录里 ⇒ ⇒ 收尾一步汇总成带分母的读数。
      # ⚠️ 落在仓根会污染被测面（顶层对账闸会当场判红）⇒ ⇒ 用 RUNNER_TEMP。
      # ⚠️ 落盘路径**不能**用表达式上下文（job 级 env 里不可用 ⇒ ⇒ 整个 workflow 文件会被拒绝加载 ⇒ ⇒ run 零 job 失败）。
      - name: 准备判读落盘路径（仓外）
        run: echo "GATE_RESULT_FILE=$RUNNER_TEMP/gate-results.ndjson" >> "$GITHUB_ENV"
      - name: Checkout shadow (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # ⚠️ **两步都要跑** —— 判定 ＋ 判据自检（自检证明这道闸**真的会红**）。
      - name: Commit revert check
        run: node scripts/run-gate-once.mjs --strict scripts/check-commit-revert.mjs -- --limit=40

      - name: Commit revert check (self-test)
        run: node scripts/check-commit-revert.mjs --self-test
      # ⚠️ 收尾：把这一盏灯「绿得有多真」写出来 —— 这一盏灯里**所有**真跑的闸
      #    都落了判读 ⇒ ⇒ 这里汇总成**带分母的读数**（真判 N ｜ 判不了 K ｜ 红 M）
      #    ⇒ ⇒ 「判不了」不当红（它不是「有问题」）⇒ ⇒ 但也不当绿（它不是「没问题」）。
      # ⚠️ if: always() ⇒ ⇒ **闸红的时候分母照样在** ⇒ ⇒ 不然「红」的那一格
      #    恰好是**唯一没有分母**的那一格 ⇒ ⇒ 红灯也读不出「到底跑了哪几道」。
      - name: 判读汇总（带分母的绿灯）
        if: always()
        run: node scripts/lib/gate-tally.mjs --report
