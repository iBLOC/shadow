name: Unwired Gates

# ⚠️ **它守的是什么** —— 「**有闸但没人跑**」这一族。
#
#   2026-11-11 真测：仓里 **57 道闸**，而**只有 41 道接进 CI**
#   ⇒ ⇒ 16 道「有闸但没人跑」⇒ ⇒ CI 一盏绿灯，**什么都没证明**。
#
#   ⚠️ 债表里当时的理由是「多数要本机工具链 ⇒ ⇒ 贸然接进 CI 只会让 CI 因**无关原因**变红」
#   ⇒ ⇒ 但 2026-11-11 **逐条在本机量过**：14 道**真跑绿**、1 道**判不了**（msrv-floor 找不到 Cargo.toml）
#   ⇒ ⇒ 那条理由**已过期** ⇒ ⇒ 这一刀就是把它兑现。
#   ⇒ ⇒ 2026-11-13 订正：那 1 道（msrv-floor）**已兑现** —— 接线补上 `-- --manifest-path shadow-desktop/src-tauri/Cargo.toml`
#
#   ⚠️ 同一刀顺带补齐 **D3**（接进 CI 的闸，自检必须印出**可数读数** N/N）
#   ⇒ ⇒ 11 道闸的自检原本只印「✅ 自检全过」/「（13 只样本）」⇒ ⇒ 读数**不可比**
#   ⇒ ⇒ 逐道补成**算出来的** N/N（不硬编数字）。
#
# ⚠️ **为什么单独成文件**（与其它闸的 workflow 同理）：ci.yml 是**共享文件**（并行会话在飞）
#   ⇒ ⇒ 独立成文件 ⇒ ⇒ 接线面**零共享**。
#
# ⚠️ **每道闸一步**，且由 `scripts/run-gate-once.mjs` 转译退出码：
#   · 0 ⇒ 绿；· 1 ⇒ 红（阻断）；· **2 ⇒ 判不了** ⇒ ⇒ 打印显眼提示但**不当红**
#   ⇒ ⇒ 「读不到判据源」不会伪装成「有问题」，也不会伪装成「绿」。

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  unwired-gates:
    name: Unwired Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # ⚠️⚠️ **secrets 不能直接用在 step 的 `if:` 里**（平台限制，2026-11-11 真 CI 实测）
      #    ⇒ ⇒ 那个写法会让**整个 workflow 文件被拒绝加载**⇒ ⇒ run 的名字变成**文件路径**
      #    ⇒ ⇒ 且报「This run likely failed because of a workflow file issue」
      #    ⇒ ⇒ 修法：把 secret 映射到**作业级 env** ⇒ ⇒ `if:` 只引用 env 上下文。
      IBLOC_TOKEN: ${{ secrets.IBLOC_TOKEN }}
    steps:
      - name: Checkout shadow
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # ⚠️ **兄弟仓是私有的**（iBLOC/telencephalon、hippocampus）⇒ ⇒ 默认 GITHUB_TOKEN
      #    只对 iBLOC/shadow 有权限 ⇒ ⇒ 检不出来 ⇒ ⇒ 那些闸会「读不到判据源」。
      # ⚠️ 这里**不硬失败**：token 缺失只警告 ⇒ ⇒ 闸自己报「判不了」（退出码 2）
      #    ⇒ ⇒ 「读不到」既不伪装成「有问题」，也不伪装成「绿」。
      - name: Require cross-repo token
        run: |
          if [ -z "$IBLOC_TOKEN" ]; then
            echo "::warning::secrets.IBLOC_TOKEN is not configured ⇒ ⇒ 跨仓闸会报「判不了」（退出码 2）⇒ ⇒ 那一格没验成。"
          else
            echo "IBLOC_TOKEN 在位 ⇒ ⇒ 跨仓闸能真判。"
          fi

      - name: Checkout telencephalon
        if: ${{ env.IBLOC_TOKEN != '' }}
        uses: actions/checkout@v7
        with:
          repository: iBLOC/telencephalon
          path: telencephalon
          token: ${{ env.IBLOC_TOKEN }}

      - name: Checkout hippocampus
        if: ${{ env.IBLOC_TOKEN != '' }}
        uses: actions/checkout@v7
        with:
          repository: iBLOC/hippocampus
          path: hippocampus
          token: ${{ env.IBLOC_TOKEN }}

      # ⚠️ neuron 是**公开仓** ⇒ ⇒ 不用 token
      - name: Checkout neuron
        uses: actions/checkout@v7
        with:
          repository: iBLOC/neuron
          path: neuron

      # ⚠️ **synapse 也要检出** —— 2026-11-11 真 CI 实测（run 42746963183）
      #    ⇒ ⇒ 「公布出去的地址」那道闸逐字报「仓「synapse」没扫到 ⇒ ⇒ 锚点无法核对」
      #    ⇒ ⇒ 而 **synapse 是公开仓**（iBLOC/synapse）⇒ ⇒ **不用 token** ⇒ ⇒ 检出即可真判。
      - name: Checkout synapse
        uses: actions/checkout@v7
        with:
          repository: iBLOC/synapse
          path: synapse

      # ⚠️ **大脑仓（encephalon）也要检出** —— 2026-11-11 真 CI 实测（run 42720852662)
      #    ⇒ ⇒ 「CORS 白名单」那道闸的判据源在**它**那儿
      #    （`src/api/cors.rs` ＋ `src/a2a_server.rs`）⇒ ⇒ 不检出 ⇒ ⇒ **判不了**
      #    ⇒ ⇒ 而这一刀刚把它的路径改成「仓外优先、仓内兜底」⇒ ⇒ **检出即可真判**。
      # ⚠️ 它是**私有仓** ⇒ ⇒ 仍走同一个 token ⇒ ⇒ token 缺失时跳过 ⇒ ⇒ 那一格「判不了」。
      - name: Checkout encephalon
        if: ${{ env.IBLOC_TOKEN != '' }}
        uses: actions/checkout@v7
        with:
          repository: iBLOC/encephalon
          path: encephalon
          token: ${{ env.IBLOC_TOKEN }}

      # ⚠️ A2UI 形态的「会话身份」两端一致
      # ⚠️ **绿灯要带分母** —— 每道闸的结论往这里落一行，收尾一步汇总。
      # ⚠️⚠️ **两处踩过的坑（2026-11-11 真 CI 实测）**：
      #    ① 落在**仓根** ⇒ ⇒ 顶层对账闸判红（run 42750340522）。
      #    ② 写成 `${{ runner.temp }}` ⇒ ⇒ `runner` 上下文在 **job 级 `env:` 里不可用**
      #       ⇒ ⇒ **整个 workflow 文件被拒绝加载**⇒ ⇒ run **零 job** 失败
      #       （run 42752071028；run 名变成**文件路径**）。
      # ⇒ ⇒ ⇒ 落盘路径改用 runner 的**默认环境变量** RUNNER_TEMP，写进 $GITHUB_ENV
      #    ⇒ ⇒ 不依赖表达式上下文 ⇒ ⇒ 且落在**仓外**。
      - name: 准备判读落盘路径（仓外）
        run: echo "GATE_RESULT_FILE=$RUNNER_TEMP/gate-results.ndjson" >> "$GITHUB_ENV"
      - name: a2ui-session-identity
        run: node scripts/run-gate-once.mjs scripts/check-a2ui-session-identity.mjs
      # ⚠️ 能力面的凭据：每一处打这面的请求都带门认的凭据
      - name: agent-surface-credentials
        run: node scripts/run-gate-once.mjs scripts/check-agent-surface-credentials.mjs
      # ⚠️ 后门：放行分支 / 字面量默认凭据 / 前端硬编码
      - name: auth-backdoors
        run: node scripts/run-gate-once.mjs scripts/check-auth-backdoors.mjs
      # ⚠️ 源码级宽绑定
      - name: bind-exposure
        run: node scripts/run-gate-once.mjs scripts/check-bind-exposure.mjs
      # ⚠️ 客户端与端脑的「话怎么说」对不对得上
      - name: client-dialect
        run: node scripts/run-gate-once.mjs scripts/check-client-dialect.mjs
      # ⚠️ 客户端调用点 ↔ 端脑路由表
      - name: client-endpoint-map
        run: node scripts/run-gate-once.mjs scripts/check-client-endpoint-map.mjs
      # ⚠️ 两端发给模型的客户端工具必须一致
      - name: client-tools
        run: node scripts/run-gate-once.mjs scripts/check-client-tools.mjs
      # ⚠️ 跨端一致性的**统一入口**（5 个守卫当子进程跑一遍）
      # ⚠️ 2026-11-11 接进来：它之前**没有 --self-test**、**没有退出码 2 那一档**、
      #    也**没接进任何 workflow** ⇒ ⇒ 「有闸但没人跑」这一族的最后一道。
      - name: cross-client
        run: node scripts/run-gate-once.mjs scripts/check-cross-client.mjs
      # ⚠️ 两端认的是同一套会话内容口径
      - name: conversation-prefix
        run: node scripts/run-gate-once.mjs scripts/check-conversation-prefix.mjs
      # ⚠️ CORS 白名单：没有 permissive
      - name: cors-allowlist
        run: node scripts/run-gate-once.mjs scripts/check-cors-allowlist.mjs
      # ⚠️ 提交树面：死环境变量 / 改名漂移
      # ⚠️ 端脑路由矩阵
      - name: endpoint-matrix
        run: node scripts/run-gate-once.mjs scripts/check-endpoint-matrix.mjs
      # ⚠️ Rust MSRV 下限
      - name: msrv-floor
        # ⚠️ 必须带 --manifest-path（2026-11-13 本机实测）：不带 ⇒ 闸在仓根找不到 Cargo.toml
        #    ⇒ 退出码 2 ⇒ 被包装器转成 0 ⇒ **这一步永远是绿的，什么都没验**。
        #    闸自己的参数必须写在「--」之后（跑批器的约定）。
        run: node scripts/run-gate-once.mjs scripts/check-msrv-floor.mjs -- --manifest-path shadow-desktop/src-tauri/Cargo.toml
      # ⚠️ provider 面挂没挂门
      - name: provider-admin-headers
        run: node scripts/run-gate-once.mjs scripts/check-provider-admin-headers.mjs
      # ⚠️ 公布出去的地址：端口来自真实监听
      - name: publish-address
        run: node scripts/run-gate-once.mjs scripts/check-publish-address.mjs
      # ⚠️ 工具调用的拦截点接缝
      - name: tool-interception
        run: node scripts/run-gate-once.mjs scripts/check-tool-interception.mjs

      # ⚠️⚠️ **收尾：把这一轮「绿得有多真」写出来** —— 2026-11-11 真 CI 实测
      #    （run 42717285106）：「Unwired Gates」＝ **success**，而那 15 道闸里
      #    **8 道是「判不了」**（跨仓闸：兄弟仓没检出 ⇒ ⇒ 读不到判据源）
      #    ⇒ ⇒ 「绿」把「没验成」一起吞了 ⇒ ⇒ 一盏绿灯，**分母不见了**。
      # ⇒ ⇒ 这一步把每道闸的结论汇总成**带分母的读数**：
      #    「15 道 ｜ 真判 7 ｜ 判不了 8 ｜ 红 0」
      # ⇒ ⇒ 「判不了」**不当红**（它不是「有问题」）⇒ ⇒ 但也**不当绿**
      # ⇒ ⇒ 它被逐个点名、进了 step summary ⇒ ⇒ 缺口留在视野里。
      - name: 判读汇总（带分母的绿灯）
        run: node scripts/lib/gate-tally.mjs --report

      # ⚠️ 尺子自己的自检 —— 汇总读数这台尺子也得证明自己会红
      - name: 判读汇总尺子的自检
        run: node scripts/lib/gate-tally.mjs --self-test
